<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punch Code Compiler</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx-itemid.js"></script>
<style>
    body { background: var(--bg-color, #000); color: var(--fg-color, #0f0); font-family: var(--font-face, monospace); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #toolbar {
        background: var(--bg-color, #111);
        padding: 10px; 
        display: flex;
        justify-content: left;
        align-items: center; 
        gap: 10px;
        flex-wrap: wrap; 
        border-bottom: 2px solid var(--sel-bg, #333);
    }
    
    .toolbar-actions { display: flex; gap: 8px; align-items: right; }
    
    #main-editor {
        display: flex;
        flex-direction: column;
        flex: 1; 
        padding: 15px; 
        overflow-y: auto;
    }
    
    .target-label { 
        font-weight: bold; 
        background: var(--bg-color, #000); 
        color: var(--fg-color, #0f0); 
        font-size: 1.1em; 
        padding: 6px 12px;
        border: 1px solid var(--fg-color, #0f0);
        border-radius: 4px;
    }
    
    textarea { width: 100%; height: 100px; background: var(--input-bg, #000); color: var(--input-fg, #0f0); border: 1px solid var(--fg-color, #0f0); padding: 10px; font-family: monospace; font-size: 16px; resize: none; box-sizing: border-box; margin-top: 15px; }
    
    button { padding: 8px 16px; cursor: pointer; background: var(--sel-bg, #333); color: var(--sel-fg, #0f0); border: 1px solid var(--sel-fg, #0f0); font-weight: bold; font-family: inherit; border-radius: 4px; }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Visual Decompiler Styles */
    #decompiler-view { 
        background: var(--case-bg, #080808); 
        border: 1px solid var(--case-fg, #333);
        min-height: 60%; 
        padding: 10px;
        border-radius: 4px;
        flex: 1;
        overflow-y: auto; 
    }
    
    .punchcode-space { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; }
    .punchcode-text { display: inline-flex; align-items: center; justify-content: center; background-color: var(--sel-bg, #006600); color: var(--sel-fg, #FFF); font-family: monospace; font-size: 16px; font-weight: bold; border-radius: 4px; width: 32px; height: 32px; vertical-align: middle; margin: 1px; }
    .punchcode-img { width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin: 1px; background-size: cover; }
    .punchcode-img img { width: 32px; height: 32px; display: block; image-rendering: pixelated; }

    #tooltip { position: absolute; background: var(--menu-bg, #111); color: var(--menu-fg, #aaa); padding: 6px 10px; font-size: 14px; font-weight: bold; pointer-events: none; border: 1px solid var(--menu-fg, #aaa); display: none; z-index: 100; border-radius: 4px; box-shadow: 2px 2px 10px rgba(0,0,0,0.8); }

</style>
</head>
<body>

<div id="toolbar">
    <div class="target-label">Sector <span id="target-file">None Selected</span></div>
    <button id="cancel-btn" onclick="cancelEdit()">CANCEL</button>
    <button id="save-btn" onclick="saveLogic()" disabled>SAVE TO DISK</button>
</div>

<div id="main-editor">
    <div id="decompiler-view"></div>
    <textarea id="punchcodeInput" placeholder="Enter Punch Code logic here..." oninput="onCodeChange()"></textarea>
</div>
<div id="tooltip"></div>

<script>
let currentTargetPath = null;
let originalCode = "";

window.onload = function() {
    if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
        window.CylonSDK.applyColors(window.parent.CylonColors);
    }
    loadTarget();
};

// Listen for focus/activation from the OS
window.addEventListener('message', async (e) => {
    if (e.data.type === 'QANDY_PAGE_ACTIVATED') {
        await loadTarget();
    }
});

function formatTargetHeadline(targetPath) {
    let parts = targetPath.split('/');
    let filename = parts[parts.length - 1] || '';
    let sector = parts.length >= 2 ? parts[parts.length - 2] : '';

    if (filename.length >= 4 && sector) {
        let iconId = filename.substring(0, 2);
        let zCode = filename.substring(2, 4);
        let itemLabel = typeof gfxItemID === 'function' ? gfxItemID(iconId) : iconId;
        return `${sector} ${zCode} "${itemLabel}":`;
    }
    return targetPath;
}

async function loadTarget() {
    let dos = window.parent.CylonDOS;
    if (!dos) return;
    
    try {
        let targetPath = await dos.load('cylon:/a/gfxEditTarget');
        if (targetPath) targetPath = targetPath.trim();
        
        if (targetPath && targetPath !== currentTargetPath) {
            currentTargetPath = targetPath;
            document.getElementById('target-file').innerText = formatTargetHeadline(currentTargetPath);
            
            let logic = await dos.load(currentTargetPath);
            if (logic === null) logic = ""; // Handle empty/new files
            logic = logic.replace(/\\n/g, '\n'); // Expand escaped newlines
            
            originalCode = logic;
            document.getElementById('punchcodeInput').value = logic;
            document.getElementById('save-btn').disabled = true;
            
            decompilepunchcode(logic);
        }
    } catch(e) {
        console.warn("Could not read edit target", e);
    }
}

function cancelEdit() {
    currentTargetPath = null;
    originalCode = "";
    document.getElementById('target-file').innerText = "None Selected";
    document.getElementById('punchcodeInput').value = "";
    document.getElementById('save-btn').disabled = true;
    document.getElementById('decompiler-view').innerHTML = "";

    if (window.parent && typeof window.parent.PageOpen === 'function') {
        window.parent.PageOpen('cylon-gfx-create.htm');
    } else if (window.parent && typeof window.parent.showPage === 'function') {
        window.parent.showPage('cylon-gfx-create.htm');
    } else if (typeof window.CylonCommand === 'function') {
        window.CylonCommand('cylon-gfx-create.htm');
    }
}

function onCodeChange() {
    let currentCode = document.getElementById('punchcodeInput').value;
    document.getElementById('save-btn').disabled = (currentCode === originalCode);
    decompilepunchcode(currentCode);
}

async function saveLogic() {
    if (!currentTargetPath) return;
    
    let currentCode = document.getElementById('punchcodeInput').value;
    // Condense for file storage
    let safeCode = currentCode.replace(/\n/g, '\\n');
    if (safeCode.trim() === '') safeCode = '\\n'; 
    
    // Save via terminal command so it registers in history and triggers GFX hooks
    await window.CylonCommand(`save ${currentTargetPath} ${safeCode}`);
    
    originalCode = currentCode;
    document.getElementById('save-btn').disabled = true;
    
    // Quick popup notification
    if (window.popHtm) {
        window.PopAlign = "center";
        window.popHtm(`<div style="padding:15px; background:var(--menu-bg); border:1px solid var(--menu-fg); color:var(--menu-fg); text-align:center;"><b>Saved successfully!</b></div>`);
        setTimeout(() => { if(window.hpop) window.hpop(); }, 1000);
    }
}

// ---------------------------------------------------------
// Visual Decompiler Engine (Stripped Down)
// ---------------------------------------------------------

function getCodeDescription(code) {
    if (code === "Za") return "nothing (null)";
    let itemText = typeof gfxItemID === "function" ? gfxItemID(code) : "Unknown";
    if (itemText !== "Item " + code && itemText !== "Unknown") return itemText;
    return `code "${code}"`;
}

function decompilepunchcode(initialCode) {
    const container = document.getElementById('decompiler-view');
    container.innerHTML = "";
    if (!initialCode) return;
    
    let hostOrigin = window.cylonHostOrigin || '';
    let iconBase = (window.parent.CylonGFX && window.parent.CylonGFX.gfxIconDir) ? window.parent.CylonGFX.gfxIconDir : (hostOrigin + 'i/');
    let tileBase = (window.parent.CylonGFX && window.parent.CylonGFX.gfxTileDir) ? window.parent.CylonGFX.gfxTileDir : (hostOrigin + 't/');

    function bindHover(element, desc, startIdx, endIdx) {
        element.style.cursor = "pointer";
        element.addEventListener('mousemove', (e) => {
            const ta = document.getElementById('punchcodeInput');
            ta.focus({ preventScroll: true });
            ta.setSelectionRange(startIdx, endIdx);

            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            tooltip.innerText = desc;
            tooltip.style.left = (e.pageX + 15) + 'px';
            tooltip.style.top = (e.pageY + 15) + 'px';
        });
        element.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });
    }

    let col = 0;
    let ifnot = false;
    let ifnotStartIdx = null;
    let srcString = initialCode;

    while (col < srcString.length) {
        let startIdx = col;
        let char = srcString.charAt(col);

        if (char === ' ' || char === '\t') {
            const spacer = document.createElement('div');
            spacer.className = 'punchcode-space';
            container.appendChild(spacer);
            col++; continue;
        } else if (char === '\n' || char === '\r') {
            const br = document.createElement('div');
            br.style.flexBasis = '100%'; br.style.height = '0';
            container.appendChild(br);
            if (char === '\r' && srcString.charAt(col + 1) === '\n') col++;
            col++; continue;
        }

        let endIdx = col;
        let len = Math.min(2, srcString.length - col);
        let text = srcString.substring(col, col + len);
        endIdx = col + len;
        col = endIdx;

        let item = text;
        let rawDesc = getCodeDescription(item);

        if (item === "Xn") {
            ifnot = true;
            ifnotStartIdx = startIdx;
            continue;
        }

        let blockEl = document.createElement('div');
        blockEl.className = 'punchcode-img';
        blockEl.style.backgroundImage = `url('${tileBase}Za.png')`; // default background

        let img = document.createElement('img');
        
        if (item === "Xc") {
            img.src = `${iconBase}Xc.png`;
            bindHover(blockEl, rawDesc, startIdx, endIdx);
        } else if (item.startsWith("##") || item.startsWith("%%") || item.startsWith("$$")) {
            // Unhandled raw parameter fallback visually
            blockEl.className = 'punchcode-text';
            blockEl.textContent = item;
            bindHover(blockEl, "Parameter Marker", startIdx, endIdx);
        } else {
            img.src = ifnot ? `${iconBase}${item}n.png` : `${iconBase}${item}.png`;
            
            let tooltipDesc = ifnot ? ("If Not: " + rawDesc) : rawDesc;
            let finalStart = ifnot ? ifnotStartIdx : startIdx;
            bindHover(blockEl, tooltipDesc || item, finalStart, endIdx);
        }

        if(blockEl.className === 'punchcode-img') blockEl.appendChild(img);
        container.appendChild(blockEl);
        
        // Handle parameters (##, %%, $$) directly attached
        while (col < srcString.length && (srcString.substring(col, col+2) === "%%" || srcString.substring(col, col+2) === "$$" || srcString.substring(col, col+2) === "##")) {
            let prefix = srcString.substring(col, col+2);
            col += 2;
            let paramText = srcString.substring(col, col+2);
            col += 2;
            
            let paramBlock = document.createElement('div');
            let paramDesc = "";
            
            if (prefix === "##") {
                paramBlock.className = 'punchcode-text';
                paramBlock.textContent = paramText;
                paramDesc = "Number: " + paramText;
            } else {
                paramBlock.className = 'punchcode-img';
                paramBlock.style.backgroundImage = `url('${tileBase}Za.png')`;
                let pImg = document.createElement('img');
                pImg.src = `${iconBase}${paramText}.png`;
                paramBlock.appendChild(pImg);
                paramDesc = (prefix === "%%" ? "Param: " : "Item: ") + getCodeDescription(paramText);
            }
            container.appendChild(paramBlock);
            bindHover(paramBlock, paramDesc, col-4, col);
        }
        
        ifnot = false;
    }
}
</script>
</body>
</html>
