<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CREATE .GFX WORLD</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            background: #333;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #444;
        }
        
        #outerContainer { display: flex; flex-direction: row; height: 90vh; }
        
        #sideToolbar {
          width: 56px;
          background: #202a36;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 8px 0;
          border-right: 1px solid #333;
          gap: 14px;
        }
        #viewport {
            flex-grow: 1;
            overflow: auto;
            background: #111;
            padding: 20px;
        }
        canvas {
            background: #000;
            cursor: crosshair;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .brush-info {
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2em;
            background: #444;
            padding: 5px 10px;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #068;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background: #07a; }
        #toolbar .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #444;
            padding: 4px 10px;
            border-radius: 4px;
        }
        #toolbar input[type="number"], #toolbar input[type="text"] {
            background: #222;
            color: #0af;
            border: 1px solid #555;
            padding: 4px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="toolbar"></div>

<div id="outerContainer">
    <div id="viewport"> <canvas id="mapCanvas"></canvas></div>
</div>

<div id="toolPopup" style="display:none; position:fixed; left:200px; top:100px; background:#333; border:2px solid #0af; color:#eee; border-radius:8px; z-index:1000; min-width:250px; min-height:120px; box-shadow:0 6px 32px #000a"></div>

<script>
    // Dimensions are now dynamic based on loaded map or 'New Map' settings
    let SECTORS_WIDE = 10, SECTORS_TALL = 11;
    let SECTOR_TILE_WIDTH = 14, SECTOR_TILE_HEIGHT = 10;

    const DEFAULT_MAP_URL = 'queville.gfx'; 
    let currentFileName = 'queville.gfx';

    let copiedSectorData = null; 
    let copiedSectorLabel = null; 

    let TILE_W = SECTORS_WIDE * SECTOR_TILE_WIDTH;
    let TILE_H = SECTORS_TALL * SECTOR_TILE_HEIGHT;
    let TILE_SIZE = 32; 
    const NOISE_TILES = ['Fa', 'Gb', 'Gc', 'Gd', 'Ge', 'Gf', 'Gg'];

    let mapData = [];
    const imageCache = {}; 
    const itemCache = {}; 

    const uniqueTileCodes = new Set(); 
    const uniqueItemCodes = new Set();

    let mapHistory = [];
    const MAX_UNDO = 20;

    let sectorExits = {};  

    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const LOWER = "abcdefghijklmnopqrstuvwxyz";

    let lastEditedSector = "Aa";
    
    let selection = null; 
    let isSelecting = false;
    let selectionStart = null; 
    let clipboard = "";

    let activeTool = 'brush';   

    let brush = "Ga";
    let brushSize = 1;
    let brushShape = 'box'; 

    let flowerMode = false;
    let currentFlowerSet = 'yellow'; 
    let flowerWeights = { primary: 30, variant: 20, weeds: 10 }; 
    
    let pathMode = 0; 
    let pathStartNode = null;
    
    let sectorLOS = {}; 
    let sectorItems = {}; 

    let preservedLines = {}; 

    let currentItemCode = "I1";
    let currentItemData = "00";

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    async function initMap() {
        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;

        try {
            let mapText = null;
            // 1. Try to load from the Virtual File System first
            if (window.parent && window.parent.CylonDOS && await window.parent.CylonDOS.exists(DEFAULT_MAP_URL)) {
                console.log(`Loading map from CylonDOS: ${DEFAULT_MAP_URL}`);
                mapText = await window.parent.CylonDOS.load(DEFAULT_MAP_URL);
                currentFileName = DEFAULT_MAP_URL;
            } 
            // 2. Fallback to server fetch (for standalone testing)
            else {
                console.log(`Loading default map from server: ${DEFAULT_MAP_URL}`);
                const response = await fetch(DEFAULT_MAP_URL);
                if (response.ok) {
                    mapText = await response.text();
                    currentFileName = DEFAULT_MAP_URL;
                }
            }

            if (mapText) {
                processMap(mapText);
                await preloadAllImages(); 
                renderFullMap(); 
                console.log("Map loaded and rendered.");
                return;
            } else {
                throw new Error("Map data empty or not found.");
            }

        } catch (error) {
            console.error("Failed to load map:", error);
            alert("Failed to load map. Initializing with random noise.");
            // Fallback to noise
            mapData = [];
            for (let y = 0; y < TILE_H; y++) {
                mapData[y] = [];
                for (let x = 0; x < TILE_W; x++) {
                    const tile = NOISE_TILES[Math.floor(Math.random() * NOISE_TILES.length)];
                    mapData[y][x] = tile;
                    uniqueTileCodes.add(tile);
                }
            }
            await preloadAllImages(); 
            renderFullMap();
        }
    }


    async function preloadAllImages() {
        const imagePromises = [];

        for (const code of uniqueTileCodes) {
            if (!imageCache[code]) {
                const img = new Image();
                img.src = `t/${code}.png`;
                const promise = new Promise((resolve) => {
                    img.onload = () => resolve();
                    img.onerror = () => { resolve(); }; 
                });
                imageCache[code] = img;
                imagePromises.push(promise);
            }
        }

        for (const id of uniqueItemCodes) {
            if (!itemCache[id]) {
                const img = new Image();
                img.src = `i/${id}.png`;
                const promise = new Promise((resolve) => {
                    img.onload = () => resolve();
                    img.onerror = () => { resolve(); }; 
                });
                itemCache[id] = img;
                imagePromises.push(promise);
            }
        }

        await Promise.all(imagePromises);
    }

    function renderToolbar() {
        const toolbar = document.getElementById('toolbar');
        toolbar.innerHTML = ''; 

        function addButton(label, onclick) {
            var btn = document.createElement('button');
            btn.innerText = label;
            btn.onclick = onclick;
            toolbar.appendChild(btn);
        }

        // Tile size dropdown
        const select = document.createElement('select');
        [
          {label:'2x', value:64},
          {label:'1x', value:32},
          {label:'1/2x', value:16},
          {label:'1/4x', value:8}
        ].forEach(opt => {
          let o = document.createElement('option');
          o.textContent = opt.label;
          o.value = opt.value;
          if (opt.value === TILE_SIZE) o.selected = true;
          select.appendChild(o);
        });

        select.addEventListener('change', function() { setTileSize(Number(this.value)); });
        toolbar.appendChild(select);

        addButton('File', showFileTool);
        addButton('Borders', borders);

        const sizeGroup = document.createElement('div');
        sizeGroup.className = 'tool-group';
        sizeGroup.innerHTML = `
            <label style="font-size:0.8em; color:#aaa;">SIZE</label>
            <input type="number" id="toolbarBrushSize" value="${brushSize}" min="1" max="25" style="width:45px;" onchange="syncBrushSize(this.value)">
        `;
        toolbar.appendChild(sizeGroup);
            
        addButton('Brush', bigbrush);
        addButton('Flower', showFlowerTool);
        addButton('Terrain', showTerrainTool);
        addButton('Sectors', showSectorTool);
        addButton('Stamp', showStampTool);    
        addButton('Exits', () => showExitsEditor(lastEditedSector));
    }

    function syncBrushSize(val) {
        brushSize = parseInt(val, 10);
        const slider = document.getElementById('brushSizeSlider');
        if (slider) {
            slider.value = brushSize;
            updateBrushSizePreview(brushSize);
        }
    }

    let currentSectorToolMode = 'fill'; 

    function showSectorTool() {
        activeTool = 'sector_tool'; 
        const popup = document.getElementById('toolPopup');

        const buttonStyle = (mode) => currentSectorToolMode === mode ? 'background:#0af; color:white;' : '';

        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#1abc9c; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Sector Editor
                <span style="float:right;cursor:pointer;" onclick="exitSectorTool()">✕</span>
            </div>
            <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
                <p style="font-size:0.85em; color:#eee; margin-top:0;">Select an action, then click a sector on the map.</p>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
                    <button onclick="setSectorToolMode('fill')" style="${buttonStyle('fill')}">Fill Sector</button>
                    <button onclick="setSectorToolMode('copy')" style="${buttonStyle('copy')}">Copy Sector</button>
                    <button onclick="setSectorToolMode('paste')" style="${buttonStyle('paste')}">Paste Sector</button>
                </div>

                <div style="background:#222; padding:10px; border-radius:4px; font-size:0.85em; color:#bbb;">
                    Current Brush: <span style="color:#0af; font-family:monospace;">${brush}</span><br>
                    Copied Sector: <span style="color:#0af; font-family:monospace;">${copiedSectorLabel || 'None'}</span>
                </div>
                
                <button onclick="exitSectorTool()" style="background:#555; width:100%; margin-top:10px;">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function setSectorToolMode(mode) {
        currentSectorToolMode = mode;
        showSectorTool(); 
    }

    function fillSectorWithBrush(globalX, globalY) {
        saveHistory(); 
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) { 
                    if (mapData[y][x] !== brush) {
                        mapData[y][x] = brush;
                        drawTile(x, y); 
                    }
                }
            }
        }
        renderFullMap(); 
    }

    function copySector(globalX, globalY, label) {
        copiedSectorData = [];
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                    copiedSectorData.push(mapData[y][x]);
                } else {
                    copiedSectorData.push('Ga'); 
                }
            }
        }
        copiedSectorLabel = label;
        showSectorTool(); 
    }

    function pasteSector(globalX, globalY) {
        saveHistory(); 
        let sourceTiles = copiedSectorData;
        if (!sourceTiles) {
            sourceTiles = Array(SECTOR_TILE_WIDTH * SECTOR_TILE_HEIGHT).fill('Ga');
            copiedSectorLabel = "Default Grass"; 
        }

        let tileIndex = 0;
        for (let y = globalY; y < globalY + SECTOR_TILE_HEIGHT; y++) {
            for (let x = globalX; x < globalX + SECTOR_TILE_WIDTH; x++) {
                if (x >= 0 && x < TILE_W && y >= 0 && y < TILE_H) {
                    mapData[y][x] = sourceTiles[tileIndex] || 'Ga'; 
                }
                tileIndex++;
            }
        }
        renderFullMap();
        showSectorTool(); 
    }

    function exitSectorTool() {
        activeTool = 'brush'; 
        document.getElementById('toolPopup').style.display = 'none';
    }

    async function showFileTool() {
        activeTool = 'file';
        let fileOptions = "";
        
        // Dynamically build file list if CylonDOS is present
        if (window.parent && window.parent.CylonDOS) {
            try {
                let files = await window.parent.CylonDOS.dir('');
                files.forEach(f => {
                    if (f.name.endsWith('.gfx')) {
                        let sel = (f.name === currentFileName) ? "selected" : "";
                        fileOptions += `<option value="${f.name}" ${sel}>${f.name}</option>`;
                    }
                });
            } catch(e) {}
        }

        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#222; padding:8px; border-radius:6px 6px 0 0; font-weight:bold; border-bottom:1px solid #444;">
                File Operations
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:16px; display:flex; flex-direction:column; gap:10px;">
                
                <!-- DOS VFS File Management -->
                <div style="background:#333; padding:10px; border-radius:4px; border:1px solid #555;">
                    <b style="color:#0af;">CylonDOS Virtual Drive</b><br>
                    <select id="dosFileSelect" style="width:100%; margin:5px 0; background:#111; color:#eee; border:1px solid #444; padding:4px;">
                        ${fileOptions || '<option value="">(No .gfx files found)</option>'}
                    </select>
                    <div style="display:flex; gap:5px;">
                        <button onclick="loadFromDOS()" style="flex:1; background:#8e44ad;">Load File</button>
                        <button onclick="saveToDOS()" style="flex:1; background:#27ae60;">Save to Drive</button>
                    </div>
                </div>

                <!-- Map Builder -->
                <div style="background:#333; padding:10px; border-radius:4px; border:1px solid #555;">
                    <b style="color:#e67e22;">Create New Map</b><br>
                    <input type="text" id="newFileName" placeholder="filename.gfx" style="width:100%; margin-bottom:5px; box-sizing:border-box;"><br>
                    <div style="display:flex; gap:5px; align-items:center; margin-bottom:5px;">
                        Map W (sectors): <input type="number" id="newMapW" value="10" style="width:50px;">
                        Map H (sectors): <input type="number" id="newMapH" value="11" style="width:50px;">
                    </div>
                    <div style="display:flex; gap:5px; align-items:center;">
                        Sector W (tiles): <input type="number" id="newSectorW" value="14" style="width:50px;">
                        Sector H (tiles): <input type="number" id="newSectorH" value="10" style="width:50px;">
                    </div>
                    <button onclick="createNewMap()" style="width:100%; margin-top:8px; background:#c0392b;">Generate Blank Map</button>
                </div>

                <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
                
                <button onclick="importMap()" style="background:#2980b9;">📥 Import from Clipboard</button>
                <button onclick="exportMap()" style="background:#27ae60;">📤 Export to Clipboard</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    // --- NEW VIRTUAL FILE SYSTEM LOGIC ---
    function generateMapString() {
        const SECTOR_W = SECTOR_TILE_WIDTH;
        const SECTOR_H = SECTOR_TILE_HEIGHT;
        let output = "";

        for (let r = 0; r < SECTORS_TALL; r++) { 
            for (let c = 0; c < SECTORS_WIDE; c++) { 
                const sectorLabel = `${UPPER[r]}${LOWER[c]}`;
                let tilesString = "";

                for (let sy = 0; sy < SECTOR_H; sy++) {
                    for (let sx = 0; sx < SECTOR_W; sx++) {
                        const globalX = (c * SECTOR_W) + sx;
                        const globalY = (r * SECTOR_H) + sy;
                        tilesString += mapData[globalY][globalX];
                    }
                }

                const exits = sectorExits[sectorLabel] || "";
                
                let objectString = "";
                if (sectorItems[sectorLabel] && sectorItems[sectorLabel].length > 0) {
                    const objSerialized = sectorItems[sectorLabel].map(it => {
                        let meta = it.id + it.z;
                        if (it.data && it.data.trim().length === 2) meta += it.data; 
                        return it.logic ? `${meta}|${it.logic}` : meta;
                    }).join('~');
                    objectString = "." + objSerialized;
                }
                output += `${sectorLabel}=${tilesString}${exits}${objectString}\n`;
            }
        }
        
        for (const [key, value] of Object.entries(preservedLines)) {
            output += `${key}=${value}\n`;
        }
        return output.trim();
    }

    async function saveToDOS() {
        if (!window.parent || !window.parent.CylonDOS) {
            alert("Error: CylonDOS not connected.");
            return;
        }
        let select = document.getElementById('dosFileSelect');
        let fname = select ? select.value : currentFileName;
        if (!fname) fname = currentFileName;

        let data = generateMapString();
        try {
            await window.parent.CylonDOS.save(fname, data);
            alert(`Map successfully saved to virtual drive as [${fname}]`);
            currentFileName = fname;
            showFileTool(); // Refresh the list
        } catch (e) {
            alert("Save failed: " + e.message);
        }
    }

    async function loadFromDOS() {
        if (!window.parent || !window.parent.CylonDOS) return;
        let select = document.getElementById('dosFileSelect');
        if (!select || !select.value) return;

        let fname = select.value;
        try {
            let data = await window.parent.CylonDOS.load(fname);
            if (data) {
                currentFileName = fname;
                processMap(data);
                await preloadAllImages();
                renderFullMap();
                document.getElementById('toolPopup').style.display = 'none';
                alert(`Loaded ${fname}`);
            }
        } catch(e) {
            alert("Load failed: " + e.message);
        }
    }

    function createNewMap() {
        let fname = document.getElementById('newFileName').value.trim();
        if(!fname) fname = "newmap.gfx";
        if(!fname.toLowerCase().endsWith('.gfx')) fname += '.gfx';
        
        let w = parseInt(document.getElementById('newMapW').value, 10);
        let h = parseInt(document.getElementById('newMapH').value, 10);
        let secW = parseInt(document.getElementById('newSectorW').value, 10);
        let secH = parseInt(document.getElementById('newSectorH').value, 10);
        
        if (w < 1 || h < 1 || w > 26 || h > 26) {
            alert("Map dimensions must be between 1 and 26 sectors.");
            return;
        }
        if (secW < 1 || secH < 1 || secW > 64 || secH > 64) {
            alert("Sector dimensions must be between 1 and 64 tiles.");
            return;
        }

        SECTORS_WIDE = w;
        SECTORS_TALL = h;
        SECTOR_TILE_WIDTH = secW;
        SECTOR_TILE_HEIGHT = secH;
        TILE_W = SECTORS_WIDE * SECTOR_TILE_WIDTH;
        TILE_H = SECTORS_TALL * SECTOR_TILE_HEIGHT;
        
        mapData = [];
        for (let y = 0; y < TILE_H; y++) { 
            mapData[y] = Array(TILE_W).fill('Ga'); 
        }
        sectorExits = {};
        sectorItems = {};
        preservedLines = {};
        currentFileName = fname;
        
        // Auto-generate the alpha script W4 dimension bounds so the engine knows map size!
        let lowerBoundsCharX = LOWER[w - 1];
        let lowerBoundsCharY = UPPER[h - 1];
        preservedLines['a'] = `XsW4${lowerBoundsCharY}${lowerBoundsCharX}`;
        
        // Save sector dimensions so we know them on load
        preservedLines['d'] = `${secW}x${secH}`;

        canvas.width = TILE_W * TILE_SIZE;
        canvas.height = TILE_H * TILE_SIZE;
        
        renderFullMap();
        document.getElementById('toolPopup').style.display = 'none';
        
        // Save immediately so it appears in the VFS
        saveToDOS();
    }


    function showRiverTool() {
        activeTool = 'river';
        pathMode = 1; 
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#005588; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                River Generator
                <span style="float:right;cursor:pointer;" onclick="exitPathMode()">✕</span>
            </div>
            <div style="padding:16px;">
                <div style="background:#111; padding:10px; border-radius:4px; margin-bottom:10px;">
                    <b style="color:#0af;">Step 1: Draw Water</b>
                    <p id="pathStatus" style="font-size:0.9em; margin:5px 0;">Click map for <b>River Start</b>.</p>
                    <p style="font-size:0.8em; color:#aaa;">Thickness linked to Brush Size: <b>${brushSize}</b></p>
                </div>
                
                <div style="background:#111; padding:10px; border-radius:4px; margin-bottom:10px;">
                    <b style="color:#2ecc71;">Step 2: Auto-Edge</b><br>
                    <button onclick="solveRiverEdges()" style="background:#27ae60; margin-top:5px; width:100%;">Fix All River Edges</button>
                </div>

                <button onclick="exitPathMode()" style="background:#555; width:100%;">Cancel / Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function applySimpleRiver(start, end) {
        const originalWalkable = window.isWalkable;
        window.isWalkable = () => true; 

        const path = findPath(start, end);
        window.isWalkable = originalWalkable;

        if (!path) return;

        path.forEach(node => {
            for (let dy = 0; dy <= 1; dy++) {
                for (let dx = 0; dx <= 1; dx++) {
                    const nx = node.x + dx;
                    const ny = node.y + dy;
                    if (nx >= 0 && nx < TILE_W && ny >= 0 && ny < TILE_H) {
                        mapData[ny][nx] = 'Ua';
                    }
                }
            }

            if (Math.random() > 0.2) {
                const offsets = [
                    {x: -1, y: 0}, {x: 2, y: 0}, 
                    {x: 0, y: -1}, {x: 0, y: 2},
                    {x: 1, y: -1}, {x: -1, y: 1}
                ];
                for (let i = 0; i < 2; i++) {
                    const off = offsets[Math.floor(Math.random() * offsets.length)];
                    const sx = node.x + off.x;
                    const sy = node.y + off.y;
                    if (sx >= 0 && sx < TILE_W && sy >= 0 && sy < TILE_H) {
                        mapData[sy][sx] = 'Ua';
                    }
                }
            }
        });

        renderFullMap();
    }

    function solveRiverEdges() {
        saveHistory();
        const tempMap = mapData.map(row => [...row]);

        const isW = (x, y) => {
            if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return true; 
            const t = tempMap[y][x];
            return t.startsWith('U') || t.startsWith('A'); 
        };

        for (let y = 0; y < TILE_H; y++) {
            for (let x = 0; x < TILE_W; x++) {
                if (!isW(x, y)) continue;

                const N = isW(x, y - 1), S = isW(x, y + 1), W = isW(x - 1, y), E = isW(x + 1, y);
                const NW = isW(x - 1, y - 1), NE = isW(x + 1, y - 1), SW = isW(x - 1, y + 1), SE = isW(x + 1, y + 1);

                const cardinalCount = (N?1:0) + (S?1:0) + (W?1:0) + (E?1:0);
                
                let tile = 'Ua'; 

                if (cardinalCount === 3) {
                    if (!N) tile = 'Aa'; 
                    if (!S) tile = 'Ab'; 
                    if (!E) tile = 'Ac'; 
                    if (!W) tile = 'Ad'; 
                } 
                else if (cardinalCount === 2) {
                    if (S && E) tile = 'Ag'; 
                    if (S && W) tile = 'Ah';
                    if (N && E) tile = 'Ai';
                    if (N && W) tile = 'Ae';
                }
                else if (cardinalCount === 4) {
                    if (!SE) tile = 'Ub';
                    if (!SW) tile = 'Uc';
                    if (!NE) tile = 'Ud';
                    if (!NW) tile = 'Ue';
                }

                mapData[y][x] = tile;
            }
        }
        renderFullMap();
    }

    function applyDrunkRiver(start, end) {
        let path = findPath(start, end);
        if (!path) {
            alert("No path found!");
            return;
        }

        saveHistory();
        const half = Math.floor(brushSize / 2);

        path.forEach(node => {

            offsetX = e.clientX - popup.offsetLeft;
            offsetY = e.clientY - popup.offsetTop;
            document.onmousemove = function(e) {
                if (!isDown) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';

            document.onmouseup = function() {

    function updateBrushSizePreview(val) {
        brushSize = parseInt(val, 10);
        document.getElementById('brushSizeValue').textContent = brushSize;
        
        let out = '<table style="border-collapse:collapse; background:#000;">';
        const half = Math.floor(brushSize / 2);

        for (let dy = -half; dy <= half; dy++) {
            out += '<tr>';
            for (let dx = -half; dx <= half; dx++) {
                let isActive = false;
                
                if (brushShape === 'box') isActive = true;
                else if (brushShape === 'circle') isActive = (dx * dx + dy * dy <= (half * half) + 0.5);
                else if (brushShape === 'diamond') isActive = (Math.abs(dx) + Math.abs(dy) <= half);
                else if (brushShape === 'hline') isActive = (dy === 0);
                else if (brushShape === 'vline') isActive = (dx === 0);
                else if (brushShape === 'triangle') {
                    let rowWidth = (dy + half); 
                    isActive = (Math.abs(dx * 2) <= rowWidth);
                }
                
                const color = isActive ? '#0af' : 'transparent';
                out += `<td style="width:4px; height:4px; background:${color};"></td>`;
            }
            out += '</tr>';
        }
        out += '</table>';
        document.getElementById('brushPreview').innerHTML = out;
    }

    function borders() {
        drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
    }

    function drawSectorBorders(ctx, tileSize, sectorsWide, sectorsTall, sectorTileWidth, sectorTileHeight) {
        ctx.save();
        for (let r = 0; r < sectorsTall; r++) {
            for (let c = 0; c < sectorsWide; c++) {
                const currentLabel = `${UPPER[r]}${LOWER[c]}`;
                const exits = sectorExits[currentLabel] || "";

                const x = c * sectorTileWidth * tileSize;
                const y = r * sectorTileHeight * tileSize;
                const w = sectorTileWidth * tileSize;
                const h = sectorTileHeight * tileSize;

                if (c < sectorsWide - 1) {
                    const rightNeighbor = `${UPPER[r]}${LOWER[c + 1]}`;
                    const neighborExits = sectorExits[rightNeighbor] || "";
                    
                    const canGoNext = exits.includes(rightNeighbor);
                    const canComeBack = neighborExits.includes(currentLabel);

                    if (canGoNext || canComeBack) {
                        ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; 
                        ctx.lineWidth = 1;
                    } else {
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';  
                        ctx.lineWidth = 3;
                    }

                    ctx.beginPath();
                    ctx.moveTo(x + w, y);
                    ctx.lineTo(x + w, y + h);
                    ctx.stroke();
                }

                if (r < sectorsTall - 1) {
                    const downNeighbor = `${UPPER[r + 1]}${LOWER[c]}`;
                    const neighborExits = sectorExits[downNeighbor] || "";

                    const canGoDown = exits.includes(downNeighbor);
                    const canComeUp = neighborExits.includes(currentLabel);

                    if (canGoDown || canComeUp) {
                        ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; 
                        ctx.lineWidth = 1;
                    } else {
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';  
                        ctx.lineWidth = 3;
                    }

                    ctx.beginPath();
                    ctx.moveTo(x, y + h);
                    ctx.lineTo(x + w, y + h);
                    ctx.stroke();
                }
            }
        }
        ctx.restore();
    }


    function drawTile(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        const code = mapData[y][x];
        const img = getTileImage(code); 
        ctx.fillStyle = '#000';
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        if (img && img.complete && img.naturalWidth !== 0) { 
            ctx.drawImage(img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        } else {
            ctx.strokeStyle = '#333';
            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }
    }

    let isPainting = false;

    function handlePaintAction(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const tileX = Math.floor((clientX - rect.left) / TILE_SIZE);
        const tileY = Math.floor((clientY - rect.top) / TILE_SIZE);

        const half = Math.floor(brushSize / 2);

        for (let dy = -half; dy <= half; dy++) {
            for (let dx = -half; dx <= half; dx++) {
                let skip = false;
                if (brushShape === 'circle' && (dx * dx + dy * dy > (half * half) + 0.5)) skip = true;
                if (brushShape === 'diamond' && (Math.abs(dx) + Math.abs(dy) > half)) skip = true;
                if (brushShape === 'hline' && dy !== 0) skip = true;
                if (brushShape === 'vline' && dx !== 0) skip = true;
                if (brushShape === 'triangle' && (Math.abs(dx * 2) > (dy + half))) skip = true;

                if (skip) continue;

                const x = tileX + dx;
                const y = tileY + dy;
                if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) continue;
                
                if (activeTool === 'forest') { applyForestSpray(x, y); }
                
                if (activeTool === 'road') { applySmartRoad(x, y); } 

                if (activeTool === 'mountain') {
                    applySmartMountain(x, y);
                } else if (activeTool === 'flower') {
                    applyFlowerSpray(x, y);
                } else if (activeTool === 'brush') {
                    if (mapData[y][x] !== brush) {
                        mapData[y][x] = brush;
                        drawTile(x, y);
                    }
                } else if (activeTool === 'path') {
                    if (!mapData[y][x].startsWith('B')) mapData[y][x] = 'Ba';
                    fixPathTile(x, y);
                    fixPathTile(x, y - 1); fixPathTile(x, y + 1);
                    fixPathTile(x - 1, y); fixPathTile(x + 1, y);
                }
            }
        }
    }

    function applyFlowerSpray(x, y) {
        const currentTile = mapData[y][x];
        
        const isGrass = currentTile.startsWith('G') || currentTile === 'Fa'; 
        if (!isGrass) return;

        const roll = Math.random() * 100;
        let targetTile = null;

        const sets = {
            yellow: { primary: 'Fa', variant: 'Fe', weeds: 'Gb' },
            white:  { primary: 'Fb', variant: 'Ff', weeds: 'Gb' },
            blue:   { primary: 'Fc', variant: 'Fd', weeds: 'Gb' }
        };

        const config = sets[currentFlowerSet];

        if (roll < flowerWeights.primary) {
            targetTile = config.primary;
        } else if (roll < (flowerWeights.primary + flowerWeights.variant)) {
            targetTile = config.variant;
        } else if (roll < (flowerWeights.primary + flowerWeights.variant + flowerWeights.weeds)) {
            targetTile = config.weeds;
        }

        if (targetTile && mapData[y][x] !== targetTile) {
            mapData[y][x] = targetTile;
            drawTile(x, y);
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        saveHistory();
        const rect = canvas.getBoundingClientRect();
        const tx = Math.floor((e.clientX - rect.left) / TILE_SIZE);
        const ty = Math.floor((e.clientY - rect.top) / TILE_SIZE);

        const sectorX = Math.floor(tx / SECTOR_TILE_WIDTH);
        const sectorY = Math.floor(ty / SECTOR_TILE_HEIGHT);
        
        lastEditedSector = `${UPPER[sectorY]}${LOWER[sectorX]}`;    
        
        if (document.getElementById('toolPopup').style.display === 'block' && exitEditSector !== null) {
            showExitsEditor(lastEditedSector);
        }

        if (activeTool === 'sector_tool' && e.button === 0) { 
            const sectorGlobalX = sectorX * SECTOR_TILE_WIDTH;
            const sectorGlobalY = sectorY * SECTOR_TILE_HEIGHT;
            
            if (currentSectorToolMode === 'fill') {
                fillSectorWithBrush(sectorGlobalX, sectorGlobalY);
            } else if (currentSectorToolMode === 'copy') {
                copySector(sectorGlobalX, sectorGlobalY, lastEditedSector);
            } else if (currentSectorToolMode === 'paste') {
                pasteSector(sectorGlobalX, sectorGlobalY);
            }
            return; 
        }

        if (activeTool === 'stamp' && e.button === 0) {
            applyStamp(tx, ty);
            return; 
        }

        if (activeTool === 'items') {
            const sectorX = Math.floor(tx / SECTOR_TILE_WIDTH);
            const sectorY = Math.floor(ty / SECTOR_TILE_HEIGHT);
            const label = `${UPPER[sectorY]}${LOWER[sectorX]}`;    
        
            const localX = tx % SECTOR_TILE_WIDTH;
            const localY = ty % SECTOR_TILE_HEIGHT;
            const zIndex = (localY * SECTOR_TILE_WIDTH) + localX;
            
            const zStr = zIndex.toString(16).toUpperCase().padStart(2, '0');
            
            if (!sectorItems[label]) sectorItems[label] = [];

            const existingIdx = sectorItems[label].findIndex(it => it.z === zStr);
            if (existingIdx > -1) {
                sectorItems[label].splice(existingIdx, 1);
            } else {
                sectorItems[label].push({ id: currentItemCode, z: zStr, data: currentItemData });
            }
            renderFullMap();
            return;
        }

        if (activeTool === 'select') {
            isSelecting = true;
            selectionStart = { x: tx, y: ty };
            selection = { x: tx, y: ty, w: 1, h: 1 };
            return;
        }

        if (activeTool === 'paste') {
            pasteAt(tx, ty);
            return;
        }

        if (activeTool === 'river') {
            if (pathMode === 1) {
                pathStartNode = { x: tx, y: ty };
                pathMode = 2;
                document.getElementById('pathStatus').innerHTML = "Click for <b>River End</b>.";
                return;
            } 
            if (pathMode === 2) {
                applyDrunkRiver(pathStartNode, { x: tx, y: ty });
                return;
            }
        }    
        
        if (activeTool === 'path') {
            if (pathMode === 1) {
                pathStartNode = { x: tx, y: ty };
                pathMode = 2;
                document.getElementById('pathStatus').innerHTML = "Click for <b>Path End</b>.";
                return;
            } 
            if (pathMode === 2) {
                const path = findPath(pathStartNode, { x: tx, y: ty });
                if (path) applyPathToMap(path);
                exitPathMode();
                return;
            }
            isPainting = true; 
            handlePaintAction(e.clientX, e.clientY);
            return;
        }    
        
        if (e.button === 0) {
            isPainting = true;
            handlePaintAction(e.clientX, e.clientY);
        } else if (e.button === 2) {
            if (ty >= 0 && ty < TILE_H && tx >= 0 && tx < TILE_W) {
                brush = mapData[ty][tx];
                updateBrushUI();
            }
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (isSelecting) {
            const rect = canvas.getBoundingClientRect();
            const tx = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const ty = Math.floor((e.clientY - rect.top) / TILE_SIZE);
            
            selection.x = Math.min(tx, selectionStart.x);
            selection.y = Math.min(ty, selectionStart.y);
            selection.w = Math.abs(tx - selectionStart.x) + 1;
            selection.h = Math.abs(ty - selectionStart.y) + 1;
            renderFullMap(); 
        }
        if (isPainting) handlePaintAction(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
        isPainting = false
        isSelecting = false;
    });

        if (e.ctrlKey) {
            if (e.key === 'c' && activeTool === 'select') copySelectionToStamp();
            else if (e.key === 'c') copySelected();
            
            if (e.key === 'x') copySelected(true);
            
            if (e.key === 'v' && activeTool === 'select') applyStampToSelection();
            else if (e.key === 'v') activeTool = 'paste';
            
            if (e.key === 'z') undo();
        }

        if (e.key.length === 1 && !e.ctrlKey) {
            if (/[A-Z]/.test(e.key)) brush = e.key + brush[1];
            else if (/[a-z]/.test(e.key)) brush = brush[0] + e.key;
            updateBrushUI();
        }
        
        if (e.key === 'Escape') { exitSelectionMode(); }
    });

    function resetExitsToNatural(sectorLabel) {
        let r = UPPER.indexOf(sectorLabel.charAt(0));
        let c = LOWER.indexOf(sectorLabel.charAt(1));
        let exits = "";
        if (r > 0) exits += `${UPPER[r-1]}${LOWER[c]}`;
        if (r < SECTORS_TALL - 1) exits += `${UPPER[r+1]}${LOWER[c]}`;
        if (c > 0) exits += `${UPPER[r]}${LOWER[c-1]}`;
        if (c < SECTORS_WIDE - 1) exits += `${UPPER[r]}${LOWER[c+1]}`;
        
        document.getElementById('exitsInput').value = exits;
        validateExitsInput();
    }

    function autoCalculateExits(isRound) {
        const rowCount = SECTORS_TALL;
        const colCount = SECTORS_WIDE;
        
        sectorExits = {};

        for (let r = 0; r < rowCount; r++) {
            for (let c = 0; c < colCount; c++) {
                const currentLabel = `${UPPER[r]}${LOWER[c]}`;
                let neighbors = [];

                const directions = [
                    { dr: -1, dc: 0 }, 
                    { dr: 1, dc: 0 },  
                    { dr: 0, dc: -1 }, 
                    { dr: 0, dc: 1 }   
                ];

                directions.forEach(dir => {
                    let nr = r + dir.dr;
                    let nc = c + dir.dc;

                    if (isRound) {
                        nr = (nr + rowCount) % rowCount;
                        nc = (nc + colCount) % colCount;
                        neighbors.push(`${UPPER[nr]}${LOWER[nc]}`);
                    } else {
                        if (nr >= 0 && nr < rowCount && nc >= 0 && nc < colCount) {
                            neighbors.push(`${UPPER[nr]}${LOWER[nc]}`);
                        }
                    }
                });

                sectorExits[currentLabel] = neighbors.join("");
            }
        }
        
        alert(`Exits calculated for ${isRound ? 'Round' : 'Flat'} world!`);
        renderFullMap();
    }

    function processMap(text) {
        const lines = text.split('\n');

        let maxR = 0, maxC = 0;
        let forcedSecW = null, forcedSecH = null;

        // 1st Pass: Find the boundaries of the map
        lines.forEach(line => {
            if (!line.includes('=')) return;
            const dataParts = line.trim().split('=');
            const label = dataParts.shift();
            const data = dataParts.join('=');
            
            if (label === 'd') {
                const parts = data.split('x');
                if (parts.length === 2) {
                    forcedSecW = parseInt(parts[0], 10);
                    forcedSecH = parseInt(parts[1], 10);
                }
                return;
            }

            const rChar = label.charAt(0);
            const cChar = label.charAt(1);
            const rIndex = UPPER.indexOf(rChar);
            const cIndex = LOWER.indexOf(cChar);

            if (label.length === 2 && rIndex !== -1 && cIndex !== -1) {
                if (rIndex > maxR) maxR = rIndex;
                if (cIndex > maxC) maxC = cIndex;
                
                if (!forcedSecW && !forcedSecH) {
                    const parts = data.split('.');
                    const mainData = parts[0];
                    const tileString = mainData.replace(/([A-Z][a-z])+$/, '');
                    const numTiles = tileString.length / 2;
                    if (numTiles === 96) { forcedSecW = 8; forcedSecH = 12; }
                    else if (numTiles === 140) { forcedSecW = 14; forcedSecH = 10; }
                }
            }
        });

        if (forcedSecW && forcedSecH) {
            SECTOR_TILE_WIDTH = forcedSecW;
            SECTOR_TILE_HEIGHT = forcedSecH;
        } else {
            SECTOR_TILE_WIDTH = 14;
            SECTOR_TILE_HEIGHT = 10;
        }

        const SECTOR_W = SECTOR_TILE_WIDTH;
        const SECTOR_H = SECTOR_TILE_HEIGHT;
        const TILES_PER_SECTOR = SECTOR_W * SECTOR_H; 
        
        sectorExits = {};
        sectorItems = {};
        preservedLines = {}; 
        
        uniqueTileCodes.clear(); 
        uniqueItemCodes.clear(); 

        if (maxC >= 0 || maxR >= 0) {
            SECTORS_WIDE = maxC + 1;
            SECTORS_TALL = maxR + 1;
            TILE_W = SECTORS_WIDE * SECTOR_TILE_WIDTH;
            TILE_H = SECTORS_TALL * SECTOR_TILE_HEIGHT;
            canvas.width = TILE_W * TILE_SIZE;
            canvas.height = TILE_H * TILE_SIZE;
        }

        mapData = []; 
        for (let y = 0; y < TILE_H; y++) { 
            mapData[y] = Array(TILE_W).fill('Ga'); 
        }

        // 2nd Pass: Populate the map
        lines.forEach(line => {
            if (!line.includes('=')) return;

            const dataParts = line.trim().split('=');
            const label = dataParts.shift();
            const allData = dataParts.join('=');
            if (!label || !allData) return;
            
            const rChar = label.charAt(0);
            const cChar = label.charAt(1);
            const rIndex = UPPER.indexOf(rChar);
            const cIndex = LOWER.indexOf(cChar);

            if (label.length !== 2 || rIndex === -1 || cIndex === -1 || rIndex >= SECTORS_TALL || cIndex >= SECTORS_WIDE) {
                preservedLines[label] = allData;
                return;
            }

            const parts = allData.split('.');
            const mainData = parts[0];     
            const objectData = parts[1] || ""; 

            const tilesLength = TILES_PER_SECTOR * 2; 
            const tilesString = mainData.substring(0, tilesLength);
            
            const exitString = mainData.substring(tilesLength);
            sectorExits[label] = exitString;

            for (let i = 0; i < TILES_PER_SECTOR; i++) {
                const tileCode = tilesString.substring(i * 2, (i * 2) + 2) || 'Ga';
                const sx = i % SECTOR_W;
                const sy = Math.floor(i / SECTOR_W);
                const globalX = (cIndex * SECTOR_W) + sx;
                const globalY = (rIndex * SECTOR_H) + sy;

                if (globalX < TILE_W && globalY < TILE_H) {
                    mapData[globalY][globalX] = tileCode;
                    uniqueTileCodes.add(tileCode); 
                }
            }

            if (objectData) {
                sectorItems[label] = [];
                const objectChunks = objectData.split('~');
                objectChunks.forEach(chunk => {
                    if (!chunk) return;
                    
                    const pipeIdx = chunk.indexOf('|');
                    const meta = pipeIdx !== -1 ? chunk.substring(0, pipeIdx) : chunk;
                    const logic = pipeIdx !== -1 ? chunk.substring(pipeIdx + 1) : "";

                    if (meta) {
                        if (meta.length >= 6) {
                            const item = {
                                id: meta.substring(0, 2),
                                z: meta.substring(2, 4),
                                data: meta.substring(4, 6),
                                logic: logic || ""
                            };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        } else if (meta.length >= 4) {
                            const item = {
                                id: meta.substring(0, 2),
                                z: meta.substring(2, 4),
                                data: "", 
                                logic: logic || ""
                            };
                            sectorItems[label].push(item);
                            uniqueItemCodes.add(item.id);
                        }
                    }
                });
            }
        });

        preloadAllImages().then(() => renderFullMap());
    }

    function fixPathTile(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return;
        if (!mapData[y][x].startsWith('B')) return;

        const isP = (nx, ny) => {
            if (nx < 0 || nx >= TILE_W || ny < 0 || ny >= TILE_H) return false;
            return mapData[ny][nx].startsWith('B');
        };

        const n = isP(x, y - 1), s = isP(x, y + 1), w = isP(x - 1, y), e = isP(x + 1, y);
        let tile = 'Ba'; 

        if (n && s && e && w) tile = 'Bc';
        else if (n && s && w) tile = 'Bh';
        else if (n && s && e) tile = 'Bi';
        else if (w && e && n) tile = 'Bj'; 
        else if (w && e && s) tile = 'Bk'; 
        else if (n && s) tile = 'Ba';
        else if (e && w) tile = 'Bb';
        else if (n && w) tile = 'Bd';
        else if (n && e) tile = 'Be';
        else if (s && e) tile = 'Bf';
        else if (s && w) tile = 'Bg';
        else if (n) tile = 'Bm';
        else if (s) tile = 'Bn';
        else if (e) tile = 'Bk';
        else if (w) tile = 'Bl';

        mapData[y][x] = tile;
        drawTile(x, y);
    }

    function isWalkable(tileCode) {
        return tileCode < "Ma"; 
    }

    function findPath(start, end) {
        const openSet = [start];
        const cameFrom = new Map();
        const gScore = new Map();
        const fScore = new Map();

        const posKey = (p) => `${p.x},${p.y}`;
        
        gScore.set(posKey(start), 0);
        fScore.set(posKey(start), Math.abs(start.x - end.x) + Math.abs(start.y - end.y));

        while (openSet.length > 0) {
            openSet.sort((a, b) => fScore.get(posKey(a)) - fScore.get(posKey(b)));
            let current = openSet.shift();

            if (current.x === end.x && current.y === end.y) {
                const path = [];
                while (current) {
                    path.push(current);
                    current = cameFrom.get(posKey(current));
                }
                return path.reverse();
            }

            const neighbors = [
                {x: current.x, y: current.y - 1}, {x: current.x, y: current.y + 1},
                {x: current.x - 1, y: current.y}, {x: current.x + 1, y: current.y}
            ];

            for (let neighbor of neighbors) {
                if (neighbor.x < 0 || neighbor.x >= TILE_W || neighbor.y < 0 || neighbor.y >= TILE_H) continue;
                if (!isWalkable(mapData[neighbor.y][neighbor.x])) continue;

                let tentativeG = gScore.get(posKey(current)) + 1 + (Math.random() * 0.2);

                if (!gScore.has(posKey(neighbor)) || tentativeG < gScore.get(posKey(neighbor))) {
                    cameFrom.set(posKey(neighbor), current);
                    gScore.set(posKey(neighbor), tentativeG);
                    fScore.set(posKey(neighbor), tentativeG + Math.abs(neighbor.x - end.x) + Math.abs(neighbor.y - end.y));
                    if (!openSet.find(p => p.x === neighbor.x && p.y === neighbor.y)) {
                        openSet.push(neighbor);
                    }
                }
            }
        }
        return null; 
    }

    function applyPathToMap(path) {
        for (let i = 0; i < path.length; i++) {
            let curr = path[i];
            let prev = path[i - 1];
            let next = path[i + 1];

            let connections = { n: false, s: false, e: false, w: false };

            if (prev) {
                if (prev.y < curr.y) connections.n = true;
                if (prev.y > curr.y) connections.s = true;
                if (prev.x < curr.x) connections.w = true;
                if (prev.x > curr.x) connections.e = true;
            }
            if (next) {
                if (next.y < curr.y) connections.n = true;
                if (next.y > curr.y) connections.s = true;
                if (next.x < curr.x) connections.w = true;
                if (next.x > curr.x) connections.e = true;
            }

            let existing = mapData[curr.y][curr.x];
            if (existing.startsWith('B')) {
                if (existing === 'Ba') { connections.n = true; connections.s = true; }
                if (existing === 'Bb') { connections.e = true; connections.w = true; }
            }

            let tile = 'Ba'; 
            const {n, s, e, w} = connections;

            if (n && s && e && w) tile = 'Bc';
            else if (n && s && w) tile = 'Bh';
            else if (n && s && e) tile = 'Bi';
            else if (n && s) tile = 'Ba';
            else if (e && w) tile = 'Bb';
            else if (n && w) tile = 'Bd';
            else if (n && e) tile = 'Be';
            else if (s && e) tile = 'Bf';
            else if (s && w) tile = 'Bg';
            else if (n) tile = 'Bm';
            else if (s) tile = 'Bn';
            else if (e) tile = 'Bk';
            else if (w) tile = 'Bl';

            mapData[curr.y][curr.x] = tile;
        }
        renderFullMap();
    }

    function isMountain(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
        return mapData[y][x].startsWith('S');
    }

    function getSmartMountainTile(x, y) {
        const N = isMountain(x, y - 1);
        const S = isMountain(x, y + 1);
        const W = isMountain(x - 1, y);
        const E = isMountain(x + 1, y);

        if (!N && S) return 'Sb'; 
        if (N && !S) return 'Sf'; 

        if (!W && E) return 'Sc'; 
        if (W && !E) return 'Se'; 

        if (N && S && W && E) return 'Sd'; 
        return 'Sb'; 
    }

    function applySmartMountain(x, y) {
        mapData[y][x] = 'Sd'; 

        const pointsToUpdate = [
            {x: x, y: y},
            {x: x, y: y - 1}, {x: x, y: y + 1},
            {x: x - 1, y: y}, {x: x + 1, y: y}
        ];

        pointsToUpdate.forEach(p => {
            if (isMountain(p.x, p.y)) {
                const newTile = getSmartMountainTile(p.x, p.y);
                if (mapData[p.y][p.x] !== newTile) {
                    mapData[p.y][p.x] = newTile;
                    drawTile(p.x, p.y);
                }
            }
        });
    }

    function undo() {

    function saveHistory() {

        mapHistory.push(snapshot);
        
        if (mapHistory.length > MAX_UNDO) {

    function pasteAt(tileX, tileY) {
        if (!clipboard) return;
        saveHistory();
        const rows = clipboard.split('\n');
        rows.forEach((rowStr, dy) => {

            if (tiles) {

                    const y = tileY + dy;
                    if (x < TILE_W && y < TILE_H) {

                });
            }
        });
        renderFullMap();
    }

    function renderFullMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (selection) {
            ctx.strokeStyle = '#0af';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]); 
            ctx.strokeRect(
                selection.x * TILE_SIZE, 
                selection.y * TILE_SIZE, 
                selection.w * TILE_SIZE, 
                selection.h * TILE_SIZE
            );
            ctx.setLineDash([]); 
        }

        drawSectorBorders(ctx, TILE_SIZE, SECTORS_WIDE, SECTORS_TALL, SECTOR_TILE_WIDTH, SECTOR_TILE_HEIGHT);
    }

                    const gx = originX + dx;
                    const gy = originY + dy;
                    
                    if (gx >= 0 && gx < TILE_W && gy >= 0 && gy < TILE_H) {
                        mapData[gy][gx] = code;
                    }
                });
            }
        });
        
        document.getElementById('stampStatus').innerText = "Pasted at (" + originX + "," + originY + ")";

                <button onclick="showMountainTool()" style="background:#555;">Mountain Ridge</button>
                <button onclick="showRoadTool()" style="background:#555;">Brick Road Builder</button>
                <button onclick="showForestTool()" style="background:#2d5a27;">Forest Creator</button>
                <button onclick="showLOSTool()" style="background:#555;;">Edit Lines Of Sight</button>
                
                <hr style="border:0; border-top:1px solid #444; width:100%;">
                
                <button onclick="bigbrush()" style="background:#444; font-size:0.9em;">⬅ Back to Standard Brush</button>
            </div>
        `;
        
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    let currentForestSet = 'all'; 
    let forestDensity = 15; 

    function showForestTool() {
        activeTool = 'forest';
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#2d5a27; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Forest Sprayer (2-Tile Trees)
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:14px;">
                <div style="margin-bottom:12px;">
                    <b>Tree Type:</b><br>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
                        <button onclick="setForestSet('green')" style="${currentForestSet==='green'?'background:#2ecc71;':''}">Green</button>
                        <button onclick="setForestSet('white')" style="${currentForestSet==='white'?'background:#ecf0f1;color:#333':''}">White</button>
                        <button onclick="setForestSet('red')" style="${currentForestSet==='red'?'background:#e74c3c;':''}">Red</button>
                        <button onclick="setForestSet('all')" style="${currentForestSet==='all'?'background:#f1c40f;color:#333':''}">Mixed</button>
                    </div>
                </div>
                
                <div style="margin-bottom:10px;">
                    <b>Spray Density:</b><br>
                    <input type="range" min="1" max="50" value="${forestDensity}" oninput="forestDensity=parseInt(this.value)">
                </div>
                
                <p style="font-size:0.8em; color:#aaa;">Requires 1x2 vertical grass space. Base (Ra/Rp) + Top (Rb/Rc/Rd).</p>
                <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function setForestSet(set) {
        currentForestSet = set;
        showForestTool();
    }

    function applyForestSpray(x, y) {
        if (Math.random() * 100 > forestDensity) return;
        if (y < 1) return;

        const isG = (tx, ty) => {
            const code = mapData[ty][tx];
            return code.startsWith('G') || code === 'Fa'; 
        };

        if (!isG(x, y) || !isG(x, y - 1)) return;

        let type = currentForestSet;
        if (type === 'all') {
            const roll = Math.random();
            if (roll < 0.6) type = 'green';
            else if (roll < 0.8) type = 'white';
            else type = 'red';
        }

        let topTile = 'Rb'; 
        let baseTile = 'Ra'; 

        if (type === 'white') topTile = 'Rc';
        if (type === 'red') {
            topTile = 'Rd';
            if (Math.random() < 0.15) baseTile = 'Rp';
        }

        mapData[y][x] = baseTile;      
        mapData[y - 1][x] = topTile;   
        drawTile(x, y);
        drawTile(x, y - 1);
    }

    function showRoadTool() {
        activeTool = 'road';
        const popup = document.getElementById('toolPopup');
        popup.innerHTML = `
            <div id="toolPopupHeader" style="cursor:move; background:#7f8c8d; padding:8px; border-radius:6px 6px 0 0; font-weight:bold;">
                Brick Road & Plaza Tool
                <span style="float:right;cursor:pointer;" onclick="document.getElementById('toolPopup').style.display='none'">✕</span>
            </div>
            <div style="padding:14px;">
                <p>Painting with this tool connects bricks (Ea-Ei).</p>
                <button onclick="activeTool='brush'; document.getElementById('toolPopup').style.display='none'">Done</button>
            </div>
        `;
        popup.style.display = "block";
        makeDraggable(popup, document.getElementById('toolPopupHeader'));
    }

    function isBrick(x, y) {
        if (x < 0 || x >= TILE_W || y < 0 || y >= TILE_H) return false;
        return mapData[y][x].startsWith('E');
    }

    function getSmartBrickTile(x, y) {
        const N = isBrick(x, y - 1);
        const S = isBrick(x, y + 1);
        const W = isBrick(x - 1, y);
        const E = isBrick(x + 1, y);

        if (!N && !W && S && E) return 'Ef'; 
        if (!N && !E && S && W) return 'Ei'; 
        if (!S && !W && N && E) return 'Eh'; 
        if (!S && !E && N && W) return 'Eg'; 

        if (!N && S) return 'Ed'; 
        if (!S && N) return 'Ee'; 
        if (!W && E) return 'Eb'; 
        if (!E && W) return 'Ec'; 

        return 'Ea'; 
    }

    function applySmartRoad(x, y) {
        mapData[y][x] = 'Ea'; 

        const pointsToUpdate = [
            {x: x, y: y},
            {x: x, y: y - 1}, {x: x, y: y + 1},
            {x: x - 1, y: y}, {x: x + 1, y: y}
        ];

        pointsToUpdate.forEach(p => {
            if (isBrick(p.x, p.y)) {
                mapData[p.y][p.x] = getSmartBrickTile(p.x, p.y);
                drawTile(p.x, p.y);
            }
        });
    }

    window.onload = function() {
        renderToolbar();
        initMap(); 
    };

</script>
</body>
</html>
