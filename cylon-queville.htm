<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queville Multiplayer Client</title>
    <script src="cylon-sdk.js"></script>
    <script src="cylon-gfx-itemid.js"></script>
    <script src="cylon-gfx.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-color, #000);
            color: var(--fg-color, #0f0);
            font-family: var(--font-face, monospace);
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        #queville-stage {
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        #queville-stage.thumb-left {
            flex-direction: row-reverse;
        }
        #desktop-wrapper {
            position: relative;
            flex: 0 0 auto;
            background-color: #000;
            overflow: hidden;
        }
        #tiles-layer, #icons-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #tiles-layer { z-index: 1; }
        #icons-layer { z-index: 10; }
        .icon-wrap { position: absolute; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .icon-img {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: fill !important;
            image-rendering: pixelated;
            filter: none !important;
        }
        .icon-label {
            display: none;
        }

        /* --- Side Control Panel (~30% width) --- */
        #queville-controls {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 6px;
            box-sizing: border-box;
        }

        .qpad-util-btn {
            background: var(--menu-bg, #181818);
            color: var(--menu-fg, #aaa);
            border: 1px solid var(--sel-bg, #444);
            border-radius: 4px;
            padding: 2px 7px;
            font-family: inherit;
            font-size: clamp(10px, 3vh, 12px);
            cursor: pointer;
            touch-action: none;
            flex: 0 0 auto;
        }
        .qpad-util-btn:active {
            background: var(--sel-bg, #444);
            color: var(--sel-fg, #0f0);
        }

        /* --- Logged-out Login Sidebar (inputs anchored at top) --- */
        #qhud-login {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: clamp(4px, 1.5vh, 8px);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }
        #qhud-login.flash {
            outline: 1px solid var(--fg-color, #0f0);
            border-radius: 4px;
        }
        .qhud-inven-slot.worn {
            background: var(--sel-bg, #333);
            color: var(--sel-fg, #0f0);
            border-color: var(--fg-color, #0f0);
            box-shadow: 0 0 6px var(--fg-color, #0f0), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* --- Logged-out Login Sidebar --- */
        .qlogin-input {
            width: 100%;
            box-sizing: border-box;
            padding: clamp(3px, 1.2vh, 6px) 6px;
            font-family: inherit;
            font-size: clamp(11px, 3.5vh, 14px);
            background: var(--input-bg, #000);
            color: var(--input-fg, #0f0);
            border: 1px solid var(--fg-color, #0f0);
            border-radius: 4px;
        }
        .qlogin-btn-row {
            display: flex;
            gap: 5px;
        }

        .qlogin-btn:focus,
        #qBtnGuest:focus {
            outline: 2px solid #ffeb3b;
            outline-offset: 1px;
        }

        .qlogin-btn {
            flex: 1 1 0;
            min-width: 0;
            padding: clamp(4px, 1.2vh, 6px) 4px;
            font-family: inherit;
            font-size: clamp(10px, 3.2vh, 13px);
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid var(--fg-color, #0f0);
            background: var(--menu-bg, #111);
            color: var(--fg-color, #0f0);
        }
        .qlogin-btn.primary {
            background: var(--sel-bg, #333);
            color: var(--sel-fg, #0f0);
        }
        .qlogin-btn:active {
            opacity: 0.8;
        }
        #qLoginErr {
            color: #ff5555;
            font-size: clamp(10px, 2.8vh, 12px);
            line-height: 1.2;
            text-align: center;
            min-height: 1.1em;
            word-wrap: break-word;
        }
        #qBtnGuest {
            display: block;
            width: 100%;
            padding: clamp(5px, 1.6vh, 8px) 6px;
            font-family: inherit;
            font-size: clamp(12px, 4vh, 16px);
            font-weight: bold;
            color: #ffeb3b;
            background: #0b3d0b;
            border: 2px solid #00e676;
            border-radius: 4px;
            cursor: pointer;
            text-shadow: 1px 1px 0 #000;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }
        #qBtnGuest:active {
            transform: scale(0.98);
        }
        .qlogin-title {
            font-size: clamp(14px, 5vh, 22px);
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffeb3b 0%, #00e676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(1px 1px 0 #003300);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- Logged-in HUD (Inventory + Keypad + Username) --- */
        #qhud-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            gap: clamp(4px, 1.6vh, 10px);
            box-sizing: border-box;
            touch-action: none;
        }
        #qhud-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 0 0 auto;
        }
        #qhud-username {
            font-weight: bold;
            font-size: clamp(11px, 3.6vh, 15px);
            color: var(--fg-color, #0f0);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
            text-align: center;
        }

        #qhud-inven {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            border: 1px solid var(--sel-bg, #333);
            border-radius: 4px;
            background: var(--bg-color, rgba(16, 16, 16, 0.6));
            padding: 5px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            --inven-cols: 4; /* Tinker between 4 and 5 */
        }
        
        #qhud-inven-grid {
            display: grid;
            grid-template-columns: repeat(var(--inven-cols), minmax(0, clamp(42px, 11vh, 64px)));
            justify-content: center;
            gap: 5px;
            width: 100%;
            flex: 0 0 auto;
        }

        .qhud-inven-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--menu-bg, #222);
            color: var(--menu-fg, #aaa);
            border: 1px solid var(--sel-bg, #333);
            border-bottom: 2px solid var(--sel-bg, #333);
            border-radius: 6px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 2px 3px rgba(0, 0, 0, 0.5);
            padding: 4px;
            margin: 0;
            box-sizing: border-box;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .qhud-inven-slot:hover:not(.empty),
        .qhud-inven-slot:focus-visible:not(.empty) {
            background: var(--sel-bg, #333);
            color: var(--sel-fg, #0f0);
            border-color: var(--fg-color, #0f0);
            outline: none;
        }

        .qhud-inven-slot:active:not(.empty) {
            background: var(--sel-bg, #111);
            color: var(--sel-fg, #0f0);
            border-color: var(--sel-fg, #0f0);
            transform: translateY(1px);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7);
        }

        .qhud-inven-slot.empty {
            cursor: default;
            opacity: 0.35;
            box-shadow: none;
        }

        .qhud-inven-slot img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            image-rendering: pixelated;
            pointer-events: none;
        }

        #qhud-tooltip {
            position: fixed;
            z-index: 2000;
            pointer-events: none;
            display: none;
            padding: 3px 7px;
            border-radius: 4px;
            background: var(--menu-bg, #111);
            color: var(--sel-fg, #0f0);
            border: 1px solid var(--fg-color, #0f0);
            font-family: var(--font-face, monospace);
            font-size: 12px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .qpad-cross {
            width: min(84%, 40vh, 180px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));
            gap: clamp(2px, 1vh, 5px);
            flex: 0 0 auto;
        }
        .qpad-btn {
            background: var(--key-bg, #222);
            color: var(--key-fg, #fff);
            border: 1px solid var(--case-fg, #444);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: clamp(13px, 4.4vh, 22px);
            font-weight: bold;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        .qpad-btn:active,
        .qpad-btn.active {
            background: var(--key-hl-bg, #666);
            color: var(--key-hl-fg, #fff);
            border-color: var(--key-fg, #888);
        }
        .qpad-up    { grid-column: 2; grid-row: 1; }
        .qpad-left  { grid-column: 1; grid-row: 2; }
        .qpad-enter {
            grid-column: 2;
            grid-row: 2;
            font-size: clamp(8px, 2.3vh, 12px);
            letter-spacing: 0;
        }
        .qpad-right { grid-column: 3; grid-row: 2; }
        .qpad-down  { grid-column: 2; grid-row: 3; }

        .qpad-side-btn {
            width: 68%;
            height: 68%;
            justify-self: center;
            align-self: center;
            font-size: clamp(10px, 3vh, 16px);
            padding: 0;
            margin: 0;
        }
        .qpad-side-left {
            grid-column: 1;
            grid-row: 3;
        }
        .qpad-side-right {
            grid-column: 3;
            grid-row: 3;
            display: none;
        }
        #queville-stage.thumb-left .qpad-side-left {
            display: none;
        }
        #queville-stage.thumb-left .qpad-side-right {
            display: flex;
        }
    </style>
</head>
<body>

<div id="queville-stage">
    <div id="desktop-wrapper">
        <div id="tiles-layer"></div>
        <div id="icons-layer"></div>
    </div>

    <div id="queville-controls">
        <!-- HUD View (empty inventory + keypad shown before and after login) -->
        <div id="qhud-game">
            <div id="qhud-inven">
                <div id="qhud-inven-grid"></div>
            </div>
            <div class="qpad-cross">
                <div class="qpad-btn qpad-up" data-key="up" data-pop-passthrough="true">▲</div>
                <div class="qpad-btn qpad-left" data-key="left" data-pop-passthrough="true">◀</div>
                <div class="qpad-btn qpad-enter" data-key="enter" data-pop-passthrough="true">ENTER</div>
                <div class="qpad-btn qpad-right" data-key="right" data-pop-passthrough="true">▶</div>
                <button type="button" tabindex="-1" class="qpad-btn qpad-side-btn qpad-side-left qpad-thumb-toggle" title="Move controls to left side">&lt;</button>
                <div class="qpad-btn qpad-down" data-key="down" data-pop-passthrough="true">▼</div>
                <button type="button" tabindex="-1" class="qpad-btn qpad-side-btn qpad-side-right qpad-thumb-toggle" title="Move controls to right side">&gt;</button>
            </div>
            <div id="qhud-header">
                <span id="qhud-username"></span>
            </div>
        </div>
    </div>

</div>

<script>
const SERVER_DRIVE = 'queville.gfx';
const SERVER_RENDER = 'https://cylon.onrender.com/qandyland.js';
const SERVER_LOCAL  = 'http://localhost:8080/qandyland.js';
const SERVER_MESSAGE = 'v.3c Alpha Test Release';

const DEFAULT_INVEN_SLOTS = 16;
const DEVTEAM_HAT_ID = 'Le';

async function resolveServerFromOrigin() {
    const dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    let hostOrigin = '';

    if (dos) {
        try {
            const saved = await dos.load('cylon:/a/cylonHostOrigin');
            if (saved) hostOrigin = saved.trim();
        } catch (e) {}
    }

    if (/^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(hostOrigin)) {
        return SERVER_LOCAL;
    }
    if (/^https:\/\//i.test(hostOrigin)) {
        return SERVER_RENDER;
    }

    return SERVER_RENDER;
}

function showConnectErrorPopup(errMsg) {
    if (typeof setPopForce === 'function') setPopForce('visible');
    const html =
        `<div style="padding:12px 16px; text-align:center; font-family:var(--font-face,monospace);">` +
        `<div style="color:#ff5555; margin-bottom:8px;">${escapeAttr(errMsg)}</div>` +
        `<button type="button" onclick="window.postMessage({type:'QANDY_RETRY_CONNECT'}, '*')" ` +
        `style="padding:4px 12px; font-family:inherit; cursor:pointer; background:var(--sel-bg,#333); color:var(--sel-fg,#0f0); border:1px solid var(--fg-color,#0f0); border-radius:3px;">Retry</button>` +
        `</div>`;
    if (typeof pop === 'function') pop(html, 'topcenter');
}

let selectedServerUrl = null;
let selectingServer = false;

function getItemLabel(id) {
    if (window.CylonGFX && typeof window.CylonGFX.getItemName === 'function') {
        return window.CylonGFX.getItemName(id);
    }
    if (typeof window.gfxItemID === 'function') return window.gfxItemID(id);
    if (window.parent && typeof window.parent.gfxItemID === 'function') return window.parent.gfxItemID(id);
    return id;
}

// Room to plug in item-specific actions (Eat, Wear, Use, etc.)
function getInventoryActions(itemId) {
    const label = getItemLabel(itemId);
    const actions = [];

    // Example hooks for future item categories:
    // if (isFoodItem(itemId)) {
    //     actions.push({ label: `Eat ${label}`, action: () => gfxClick(`SDVe${itemId}`) });
    // }
    // if (isArmorItem(itemId)) {
    //     actions.push({ label: `Wear ${label}`, action: () => gfxClick(`SDVw${itemId}`) });
    // }

    actions.push({
        label: `Drop ${label}`,
        action: () => gfxClick(`SDVd${itemId}`)
    });

    return actions;
}

function showInvenItemMenu(itemId, e, slotEl) {
    const actions = getInventoryActions(itemId);

    // Determine click coords, falling back to button center for keyboard activation
    let clientX = e && e.clientX;
    let clientY = e && e.clientY;
    if (!clientX && !clientY && slotEl) {
        const r = slotEl.getBoundingClientRect();
        clientX = r.left + r.width / 2;
        clientY = r.top + r.height / 2;
    }

    const popMgr = window.parent && window.parent.CylonPopManager;
    if (popMgr && typeof popMgr.showContextMenu === 'function') {
        popMgr.showContextMenu({ clientX, clientY, view: window }, actions);
    } else {
        // Fallback if run standalone without parent CylonPopManager
        const links = actions.map(a => `<a href="#" data-act="${escapeAttr(a.label)}">${escapeAttr(a.label)}</a>`).join('<br>');
        pop(`<div style="padding:6px;">${links}</div>`, 'center');
    }
}

function showHoverTooltip(text, anchorEl) {
    let tip = document.getElementById('qhud-tooltip');
    if (!tip) {
        tip = document.createElement('div');
        tip.id = 'qhud-tooltip';
        document.body.appendChild(tip);
    }
    tip.textContent = text;
    tip.style.display = 'block';

    const r = anchorEl.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    const left = Math.max(4, Math.min(window.innerWidth - tr.width - 4, r.left + (r.width - tr.width) / 2));
    const top = (r.top - tr.height - 6 >= 4) ? (r.top - tr.height - 6) : (r.bottom + 6);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
}

function hideHoverTooltip() {
    const tip = document.getElementById('qhud-tooltip');
    if (tip) tip.style.display = 'none';
}

function hasDevTeamHat() {
    return getWornAvatarParts().includes(DEVTEAM_HAT_ID);
}

async function runGfxAfterWalk(expectedZ, gfxCmd, objId) {
    const gfx = window.CylonGFX;
    if (!gfx) return;
    while (gfx.isSyncing) {
        await sleep(30);
    }
    if (window.gfxDo && window.gfxDo !== 'RF') {
        await gfx.networkTick();
    }
    if (window.playerZ !== expectedZ) return;
    await window.CylonCommand(`gfx ${gfxCmd} ${objId}`);
}

function walkAndRunGfx(targetZ, gfxCmd, objId) {
    if (!loggedInUser || !window.playerAvatar) return;
    const zNum = parseInt(targetZ, 10);
    window.CylonGFX.walkToZ(zNum, () => {
        runGfxAfterWalk(zNum, gfxCmd, objId);
    });
}

function getWornAvatarParts() {
    const raw = String(window.playerAvatar || '');
    const dashIdx = raw.indexOf('-');
    const base = dashIdx === -1 ? raw : raw.substring(0, dashIdx);
    const parts = [];
    for (let i = 0; i + 1 < base.length; i += 2) {
        parts.push(base.substring(i, i + 2));
    }
    return parts;
}

function getWearMatchCodes(itemId) {
    if (!itemId || itemId.length !== 2) return null;
    const c0 = itemId.charAt(0);
    if (c0 === 'L' || c0 === 'M' || c0 === 'N') return [itemId];
    return null;
}

function getWearSlotVerb(itemId, isWorn) {
    const c0 = itemId.charAt(0);
    if (isWorn) return 'Remove';
    if (c0 === 'M') return 'Wield';
    return 'Wear';
}

function isItemWorn(itemId) {
    const codes = getWearMatchCodes(itemId);
    if (!codes) return false;
    const parts = getWornAvatarParts();
    return parts.some(p => codes.includes(p));
}

function getInventoryActions(itemId) {
    const label = getItemLabel(itemId);
    const actions = [];

    if (getWearMatchCodes(itemId)) {
        const worn = isItemWorn(itemId);
        actions.push({
            label: `${getWearSlotVerb(itemId, worn)} ${label}`,
            action: () => gfxClick(`SDVu${itemId}`)
        });
    }

    actions.push({
        label: `Drop ${label}`,
        action: () => gfxClick(`SDVd${itemId}`)
    });

    return actions;
}

function encodeTileZ(z) {
    return window.CylonGFX.encodeZ(z, window.CylonGFX.gfxZBase || 10);
}

function decodeTileZ(zStr) {
    return window.CylonGFX.decodeZ(zStr, window.CylonGFX.gfxZBase || 10);
}

function flushNetworkNow() {
    if (window.CylonGFX && !window.CylonGFX.isSyncing) {
        window.CylonGFX.networkTick();
    }
}

let loggedInUser = null;

const LOGIN_ERRORS = {
    '03': 'Username must be letters and numbers only.',
    '04': 'Username must be at least 3 characters.',
    '05': 'Username must be under 16 characters.',
    '07': 'Password contains invalid characters.',
    '08': 'Password must be at least 4 characters.',
    '09': 'Invalid password.',
    '10': 'That username is already taken.',
    '13': 'Username does not exist.',
    '14': 'Player Server Error',
    '16': 'Username must start with an uppercase letter.',
    '17': 'Usernames cannot start with "guest".',
    '20': 'Player is already logged in (wait 10 seconds).',
    '21': 'Already logged in. Logout first.',
    '22': 'Account is banned.',
    '23': 'Already logged in on another server.',
    '24': 'Logged out due to inactivity.'
};

function escapeAttr(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setSidebarLoggedIn(isLoggedIn) {
    const userLabel = document.getElementById('qhud-username');
    if (userLabel) userLabel.textContent = isLoggedIn ? (loggedInUser || '') : '';
    if (!isLoggedIn) {
        window.playerInven = '';
        window.renderInventory('');
    }
}

function setSidebarLoggedIn(isLoggedIn) {
    const loginPane = document.getElementById('qhud-login');
    const gamePane = document.getElementById('qhud-game');
    const userLabel = document.getElementById('qhud-username');

    if (loginPane) loginPane.style.display = isLoggedIn ? 'none' : 'flex';
    if (gamePane) gamePane.style.display = isLoggedIn ? 'flex' : 'none';
    if (userLabel) userLabel.textContent = isLoggedIn ? (loggedInUser || '') : '';
}

const PREVIEW_SPAWN_TILES = 'U7U6U6U5U0U0U0U0U0U0U5U6U6U7U6U6U5U1A0A0A0A0A0A0U2U5U6U6U6U5U0A2D2G0D3G0G0G0A3U0U5U6U5U5U1A4G1B0G1G0G0G0A5U2U5U5U5U0A2G1G1B4B1B6G0R2G0A3U0U5U5U0A2G1G1G1G1B0G0R0F4A3U0U5U0U1A4G0G1G1B5B3G1F4F4A5U2U0U0A2G0G0G0B5B3G0G1F4G1G0A3U0U0A2G0G0G0B4B6G0G0G1G1G0A3U0U0A2G0G0G0G0B0G0G0G0G0G0A3U0';

async function renderPreviewMap() {
    let hostOrigin = '';
    const dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    if (dos) {
        try {
            const saved = await dos.load('cylon:/a/cylonHostOrigin');
            if (saved) hostOrigin = saved.trim();
        } catch (e) {}
    }
    if (hostOrigin && !hostOrigin.endsWith('/')) hostOrigin += '/';

    window.CylonGFX.gridWide = 14;
    window.CylonGFX.gridTall = 10;
    window.CylonGFX.gfxTileDir = hostOrigin + 't/';
    window.CylonGFX.mapTiles['Bc'] = PREVIEW_SPAWN_TILES;

    fitDesktopToScreen();

function getDriveSourceUrl(mountInfo) {
    if (!mountInfo || mountInfo.type === 'idb') return null;
    if (mountInfo.sourceUrl) return mountInfo.sourceUrl;

    let src = String(mountInfo.source || '').trim();
    if (!src || src === '(inline)' || /^(ram|rom|ls|idb):$/i.test(src)) {
        return null;
    }

    const prefixMatch = /^(ram|rom|ls):([\s\S]*)$/i.exec(src);
    if (prefixMatch) src = prefixMatch[2].trim();
    if (!src) return null;

    if (/^https?:\/\//i.test(src)) return src;

    if (src.toLowerCase().endsWith('.gfx')) {
        try {
            const baseHref = (window.parent && window.parent !== window)
                ? window.parent.location.href
                : window.location.href;
            if (/^https?:\/\//i.test(baseHref)) {
                return new URL(src, baseHref).href;
            }
        } catch (e) {}
    }
    return null;
}

function isDriveFromServer(mountInfo, serverUrl) {
    if (!mountInfo || mountInfo.type === 'idb') return false;
    const driveUrlStr = getDriveSourceUrl(mountInfo);
    if (!driveUrlStr) return false;

    try {
        const drvUrl = new URL(driveUrlStr);
        const srvUrl = new URL(serverUrl);
        if (drvUrl.host.toLowerCase() !== srvUrl.host.toLowerCase()) return false;

        const drvDir = drvUrl.pathname.substring(0, drvUrl.pathname.lastIndexOf('/') + 1);
        const srvDir = srvUrl.pathname.substring(0, srvUrl.pathname.lastIndexOf('/') + 1);
        const drvFile = drvUrl.pathname.substring(drvUrl.pathname.lastIndexOf('/') + 1).toLowerCase();

        return drvDir === srvDir && (drvFile === 'cylon-queville.gfx' || drvFile === 'queville.gfx');
    } catch (e) {
        return false;
    }
}

async function selectServer(serverUrl) {
    if (selectingServer) return;
    selectingServer = true;

    try {
        const dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
        if (!dos) {
            const errMsg = 'Error: CylonDOS is not available.';
            if (typeof print === 'function') print(errMsg + '\n');
            showConnectErrorPopup(errMsg);
            return;
        }

        let localDrive = 'queville';
        const mnts = await dos.mounts();
        const existing = mnts.find(m => m.name === 'queville' || m.name === 'queville.gfx')
                      || mnts.find(m => m.name === 'cylon-queville' || m.name === 'cylon-queville.gfx');

        if (existing) {
            localDrive = existing.name;
        } else {
            const gfxUrl = new URL('cylon-queville.gfx', serverUrl).href;
            const mounted = await window.CylonCommand(`mount "${gfxUrl}" ram queville`);
            if (!mounted) {
                const errMsg = `Error: Failed to mount ${gfxUrl}`;
                if (typeof print === 'function') print(errMsg + '\n');
                showConnectErrorPopup(errMsg);
                return;
            }
            localDrive = 'queville';
        }

        selectedServerUrl = serverUrl;
        if (typeof setPopForce === 'function') setPopForce('hidden');
        if (typeof hpop === 'function') hpop();

        let startSector = 'Bc';
        try {
            const sp = await dos.load(`${localDrive}:/a/gfxSpawn`);
            if (sp && sp.trim().length === 2) startSector = sp.trim();
        } catch (e) {}

        window.remoteQandylandUrl = serverUrl;
        window.desktopDrive = localDrive;
        window.cylonGfxSession = null;
        window.playerItem = 'Za';
        window.playerZ = 0;
        window.playerAvatar = '';
        window.playerInven = '';
        window.playerId = '';
        window.playerWalk = -1;
        window.playerDo = '';
        window.gfxDo = 'RF';
        window.movingItems = {};
        window.CylonGFX.mapTiles = {};
        window.CylonGFX.mapObjs = {};
        window.CylonGFX._loadedSector = null;
        window.CylonGFX.lastRenderedItems = null;
        window.CylonGFX.isLooking = false;

        window.gfxDrive = await window.CylonGFX.resolveServerDrive(serverUrl, SERVER_DRIVE);
        await window.CylonGFX.init(`${localDrive}:/w/${startSector}`);
        window.CylonGFX._loadedSector = startSector;
        await window.CylonGFX.ensureSectorCached(startSector);
        window.CylonGFX.renderSectorTiles(startSector);
        window.CylonGFX.renderSectorStaticObjects(startSector);
        fitDesktopToScreen();

        await showSplashPopup();
    } catch (err) {
        const errMsg = `Error: ${err && err.message ? err.message : String(err)}`;
        if (typeof print === 'function') print(errMsg + '\n');
        showConnectErrorPopup(errMsg);
    } finally {
        selectingServer = false;
    }
}

// --- Tile & Entity Click Handling ---
function handleTileClick(z, clientX, clientY) {
    if (!selectedServerUrl) {
        showServerMenuPopup('Please select a server first.');
        return;
    }
    if (!loggedInUser || (window.playerItem && window.playerItem.startsWith('Za'))) {
        showSplashPopup('Please login or play as guest.');
        return;
    }
    if (!window.playerAvatar) {
        checkAvatarRequired();
        return;
    }

    const zStr = encodeTileZ(z);
    const devMode = hasDevTeamHat();
    const menuItems = [];

    document.querySelectorAll(`.icon-wrap.static-obj[data-z="${z}"]`).forEach(el => {
        const objId = el.getAttribute('data-id');
        const objZStr = el.getAttribute('data-zstr') || zStr;
        const label = el.getAttribute('data-label') || getItemLabel(objId);
        menuItems.push({
            label: label,
            action: () => gfxClick(`OD${objId}${objZStr}`)
        });
        if (devMode) {
            menuItems.push({
                label: `Edit ${label}`,
                action: () => walkAndRunGfx(z, 'edit', objId)
            });
            menuItems.push({
                label: `Delete ${label}`,
                action: () => walkAndRunGfx(z, 'del', objId)
            });
        }
    });

    document.querySelectorAll(`.icon-wrap.dyn-sprite[data-z="${z}"]`).forEach(el => {
        const code = el.getAttribute('data-code') || '';
        if (code.length < 4) return;
        const id = code.substring(0, 2);
        const itemZStr = code.substring(2, 4);
        const uniqueId = code.length >= 8 ? code.substring(4, 8) : '';
        const label = el.getAttribute('data-label') || getItemLabel(id);
        menuItems.push({
            label: label,
            action: () => window.itemdown(`${id}${itemZStr}${uniqueId}`)
        });
    });

    if (z === window.playerZ && window.playerItem) {
        menuItems.push({
            label: 'Profile',
            action: () => showProfilePopup()
        });
        menuItems.push({
            label: 'Say Something',
            action: () => showSayPopup()
        });
        if (devMode) {
            const tData = (window.CylonGFX && window.CylonGFX.mapTiles && window.CylonGFX.mapTiles[window.map]) || '';
            const tileCode = tData.substring(z * 2, z * 2 + 2) || 'Za';
            const activeFill = window.CylonGFX && window.CylonGFX.fillTileCode;
            if (!activeFill || activeFill !== tileCode) {
                menuItems.push({
                    label: 'Tile Fill',
                    action: () => window.CylonCommand(`gfx fill ${tileCode}`)
                });
            }
            if (activeFill) {
                menuItems.push({
                    label: 'Tile Fill Off',
                    action: () => window.CylonCommand('gfx fill off')
                });
            }
        }
    }

    if (menuItems.length === 0) {
        window.zdown(z);
        return;
    }

    if (z !== window.playerZ) {
        menuItems.push({
            label: 'Walk Here',
            action: () => window.zdown(z)
        });
    }

    const popMgr = window.parent && window.parent.CylonPopManager;
    if (popMgr && typeof popMgr.showContextMenu === 'function') {
        if (clientX === undefined || clientY === undefined) {
            const wrapper = document.getElementById('desktop-wrapper');
            const rect = wrapper.getBoundingClientRect();
            const cols = window.CylonGFX.gridWide || 14;
            const rows = window.CylonGFX.gridTall || 10;
            clientX = rect.left + ((z % cols) + 0.5) * (rect.width / cols);
            clientY = rect.top + (Math.floor(z / cols) + 0.5) * (rect.height / rows);
        }
        popMgr.showContextMenu({ clientX, clientY, view: window }, menuItems);
    } else {
        const html = menuItems.map(m => {
            if (m.label === 'Walk Here') return `<a href="gfx:ZD${zStr}">Walk Here</a>`;
            return m.label;
        }).join('<br>');
        pop(html, 'center');
    }
}

function gfxClick(bytecode) {
    if (bytecode.startsWith('SRV')) {
        const idx = parseInt(bytecode.substring(3), 10);
        const url = QUEVILLE_SERVERS[idx];
        if (url) selectServer(url);
        return;
    }

    if (bytecode === 'GUEST') {
        if (!selectedServerUrl) {
            showServerMenuPopup('Please select a server first.');
            return;
        }
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(
                { type: 'QANDY_APP_CLICKED' },
                (window.location.origin && window.location.origin !== 'null' ? window.location.origin : '*')
            );
        }
        window.CylonGFX.handleGfxCommand('guest', '');
        return;
    }

    if (bytecode === 'AVM') { showAvatarHeadPopup('M'); return; }
    if (bytecode === 'AVF') { showAvatarHeadPopup('F'); return; }
    if (bytecode === 'AVB') { showAvatarSexPopup(); return; }

    const type = bytecode.substring(0, 2);
    const data = bytecode.substring(2);

    switch (type) {
        case 'LO':
            window.CylonGFX.handleGfxCommand('logout', '');
            break;
        case 'ZD':
            window.zdown(decodeTileZ(data));
            break;
        case 'IN':
            window.invdown(data);
            break;
        case 'ID':
            window.itemdown(data);
            break;
        case 'OD':
            window.objdown(data);
            break;
        case 'OC':
            if (typeof setPopForce === 'function') setPopForce('hidden');
            if (typeof hpop === 'function') hpop();
            if (window.gfxDo === 'RF') window.gfxDo = '';
            window.gfxDo += 'OC' + data;
            flushNetworkNow();
            break;
        case 'SD':
            if (typeof hpop === 'function') hpop();
            if (window.gfxDo === 'RF') window.gfxDo = '';
            window.gfxDo += data;
            flushNetworkNow();
            break;
        case 'VA':
            avatarWizardStep = 'submitting';
            avatarSubmitTicks = 0;
            if (typeof setPopForce === 'function') setPopForce('hidden');
            if (typeof hpop === 'function') hpop();
            if (window.gfxDo === 'RF') window.gfxDo = '';
            window.gfxDo += 'VA' + (data.endsWith('--') ? data : data + '--');
            flushNetworkNow();
            break;
        default:
            console.warn('Unknown GFX event:', bytecode);
    }
}

// --- Client Event Handlers ---
window.zdown = function(z) {
    if (!loggedInUser || !window.playerAvatar) return;
    if (typeof setPopForce === 'function') setPopForce('hidden');
    if (typeof hpop === 'function') hpop();

    if (z !== window.playerZ) {
        window.CylonGFX.walkToZ(parseInt(z, 10), '');
    }
};

window.objdown = function(code) {
    if (!loggedInUser || !window.playerAvatar) return;
    if (typeof hpop === 'function') hpop();

    const itemId = code.substring(0, 2);
    const itemZStr = code.substring(2, 4);
    const itemZ = decodeTileZ(itemZStr);

    let cmd = 'OD' + itemId + itemZStr;
    if (itemId === 'Xt') {
        const uniqueId = code.length >= 8 ? code.substring(4, 8) : code.substring(4);
        cmd = 'Xt' + uniqueId;
    }

    if (window.playerZ === itemZ) {
        window.playerWalk = -1;
        window.playerDo = '';
        if (window.gfxDo === 'RF') window.gfxDo = '';
        window.gfxDo += cmd;
        flushNetworkNow();
    } else {
        window.CylonGFX.walkToZ(itemZ, cmd);
    }
};

window.itemdown = function(code) {
    if (!loggedInUser || !window.playerAvatar) return;
    if (typeof setPopForce === 'function') setPopForce('hidden');
    if (typeof hpop === 'function') hpop();

    const itemId = code.substring(0, 2);
    const itemZStr = code.substring(2, 4);
    const itemZ = decodeTileZ(itemZStr);
    const uniqueId = code.length >= 8 ? code.substring(4, 8) : '';

    if (itemId === window.playerItem && (!uniqueId || uniqueId === window.playerId)) {
        window.invdown('');
        return;
    }

    if (itemId >= 'Sa' && itemId <= 'Sd') {
        if (window.gfxDo === 'RF') window.gfxDo = '';
        window.gfxDo += (window.playerItem === 'Za' || !uniqueId)
            ? ('ID' + itemId + itemZStr)
            : ('Xt' + uniqueId);
        flushNetworkNow();
        return;
    }

    const cmd = 'ID' + itemId + itemZStr;
    if (window.playerZ === itemZ) {
        window.playerWalk = -1;
        window.playerDo = '';
        if (window.gfxDo === 'RF') window.gfxDo = '';
        window.gfxDo += cmd;
        flushNetworkNow();
    } else {
        window.CylonGFX.walkToZ(itemZ, cmd);
    }
};

window.invdown = function(code) {
    if (!loggedInUser || !window.playerAvatar) return;
    if (typeof setPopForce === 'function') setPopForce('hidden');

    if (!code) {
        if (window.playerItem) {
            const zStr = encodeTileZ(window.playerZ);
            if (window.gfxDo === 'RF') window.gfxDo = '';
            window.gfxDo += 'ID' + window.playerItem.substring(0, 2) + zStr;
            flushNetworkNow();
        }
        return;
    }

    if (code.charAt(0) === '-') {
        const item = code.substring(1, 3);
        const desc = getItemLabel(item);
        const zStr = encodeTileZ(window.playerZ);
        const iconDir = window.CylonGFX.gfxIconDir || 'i/';
        let html = `<div align="center">`;
        html += `<strong>${desc}</strong><p>`;
        html += `<img src="${iconDir}${item}.png" width="32" height="32" style="image-rendering:pixelated;"><p>`;
        html += `<a href="gfx:SDVd${item}">Drop</a> &nbsp; `;
        html += `<a href="gfx:ID${window.playerItem.substring(0, 2)}${zStr}">Back</a>`;
        html += `</div>`;
        pop(html, 'center');
        return;
    }

    window.renderInventory(code);

    let col = 0;
    let outputItems = '';
    const wRegisters = {};
    let wzValue = null;
    const iconDir = window.CylonGFX.gfxIconDir || 'i/';

    while (col < code.length) {
        const verb = code.substring(col, col + 2);
        col += 2;
        if (!verb || verb.length < 2) break;

        if (verb < 'Pa') {
            outputItems += `<a href="gfx:IN-${verb}${code}">`;
            outputItems += `<img src="${iconDir}${verb}.png" width="32" height="32" alt="${verb}" style="image-rendering:pixelated;"></a> &nbsp; `;
        } else {
            const valStr = code.substring(col, col + 2);
            col += 2;
            if (verb === 'Wz') wzValue = parseInt(valStr, 10) || 0;
            if (verb.charAt(0) === 'W') wRegisters[verb] = valStr;
        }
    }

    let output = '<div align="center">';
    if (wzValue !== null) {
        const greenW = Math.max(0, Math.min(100, wzValue));
        const redW = 100 - greenW;
        output += `<div style="margin-bottom:8px;"><img src="${iconDir}Zn.png" width="${greenW}" height="6"><img src="${iconDir}Zo.png" width="${redW}" height="6"></div>`;
    }
    if (outputItems) output += `<div style="margin-bottom:8px;">${outputItems}</div>`;

    const wKeys = Object.keys(wRegisters).sort();
    if (wKeys.length) {
        output += '<div style="text-align:left;">';
        for (const k of wKeys) {
            output += `${k} ${wRegisters[k]} ${getItemLabel(k)}<br>`;
        }
        output += '</div>';
    }

    if (loggedInUser && loggedInUser.startsWith('guest')) {
        output += `<div style="margin-top:8px; font-size:11px; opacity:0.8;">Playing as ${escapeAttr(loggedInUser)}.<br>Run <code>gfx new &lt;user&gt; &lt;pass&gt;</code> to save.</div>`;
    }

    if (!outputItems && !wKeys.length && wzValue === null) {
        output += '(Inventory empty)';
    }

    output += `<div style="margin-top:8px;"><a href="gfx:LO">Logout</a></div>`;
    output += '</div>';

    pop(output, 'center');
};

function removeObjectFromDOM(objId, objZStr) {
    if (!objId || objId.length < 2 || !objZStr || objZStr.length < 2) return;
    const objZ = decodeTileZ(objZStr);
    const iconsLayer = document.getElementById('icons-layer');
    if (!iconsLayer) return;

    iconsLayer.querySelectorAll('.icon-wrap').forEach(el => {
        const elZ = parseInt(el.getAttribute('data-z'), 10);
        const elZStr = el.getAttribute('data-zstr');
        if (elZ !== objZ && elZStr !== objZStr) return;

        const elId = el.getAttribute('data-id') || (el.getAttribute('data-code') || '').substring(0, 2);
        if (elId === objId) {
            el.remove();
        }
    });
}

window.serverdown = function(code) {
    avatarWizardStep = null;
    avatarSubmitTicks = 0;
    const dialogParts = [];
    let pendingLogoutSplash = null;
    let col = 0;
    while (col < code.length) {
        const verb = code.substring(col, col + 2);
        col += 2;
        if (verb === 'LI' || verb === 'LG' || verb === 'LC') {
            const endIdx = code.indexOf('--', col);
            const name = endIdx < 0 ? code.substring(col) : code.substring(col, endIdx);
            col = endIdx < 0 ? code.length : endIdx + 2;

            if (verb === 'LC') {
                pendingNewUser = name;
                if (typeof print === 'function') print(`Account saved as ${name}. Please log in.\n`);
                try {
                    const splashMsgEl = window.parent && window.parent.document
                        ? window.parent.document.getElementById('qSplashMsg')
                        : null;
                    if (splashMsgEl) {
                        splashMsgEl.textContent = `Account created as ${name}! Click LOGIN.`;
                        const cEl = window.parent.document.getElementById('confirm');
                        if (cEl) cEl.value = '';
                    }
                } catch (e) {}
                continue;
            }

            loggedInUser = name || (verb === 'LG' ? ('guest' + (window.playerId || '')) : 'Player');
            setSidebarLoggedIn(true);

            if (!window.playerInven) {
                window.renderInventory();
            }

            if (typeof setPopForce === 'function') setPopForce('hidden');
            if (typeof hpop === 'function') hpop();

            if (typeof print === 'function') {
                print(`Logged in as ${loggedInUser}.\n`);
            }
        } else if (verb === 'LO') {
            const endIdx = code.indexOf('--', col);
            col = endIdx < 0 ? code.length : endIdx + 2;

            loggedInUser = null;
            if (window.CylonGFX) {
                window.CylonGFX.resetSession();
            }
            const iconsLayer = document.getElementById('icons-layer');
            if (iconsLayer) {
                iconsLayer.querySelectorAll('.dyn-sprite, .chat-bubble, #gfx-sys-cursor').forEach(el => el.remove());
            }
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(
                    { type: 'QANDY_SET_MODE', mode: 'app' },
                    (window.location.origin && window.location.origin !== 'null' ? window.location.origin : '*')
                );
            }
            if (typeof setPopForce === 'function') setPopForce('hidden');
            if (typeof hpop === 'function') hpop();

            setSidebarLoggedIn(false);

            if (pendingNewUser) {
                const savedUser = pendingNewUser;
                pendingNewUser = null;
                if (typeof print === 'function') print('Logged out. Log in with your new account.\n');
                pendingLogoutSplash = { msg: 'Account saved! Log in to continue.', user: savedUser };
            } else {
                if (typeof print === 'function') print('Logged out.\n');
                pendingLogoutSplash = { msg: 'Logged out.', user: '' };
            }
        } else if (verb === 'LE') {
            const errCode = code.substring(col, col + 2);
            col += 2;
            const msg = LOGIN_ERRORS[errCode] || ('Login error (' + errCode + ').');
            if (typeof print === 'function') print(`Error: ${msg}\n`);

            let joinErrEl = null;
            let splashMsgEl = null;
            try {
                if (window.parent && window.parent.document) {
                    joinErrEl = window.parent.document.getElementById('qJoinErr');
                    splashMsgEl = window.parent.document.getElementById('qSplashMsg');
                }
            } catch (e) {}

            if (joinErrEl) {
                joinErrEl.textContent = msg;
            } else if (pendingLogoutSplash) {
                pendingLogoutSplash.msg = msg;
            } else if (splashMsgEl) {
                if (window.CylonGFX) window.CylonGFX.resetSession();
                setSidebarLoggedIn(false);
                splashMsgEl.textContent = msg;
            } else if (!loggedInUser) {
                if (window.CylonGFX) window.CylonGFX.resetSession();
                setSidebarLoggedIn(false);
                showSplashPopup(msg);
            }
        } else if (verb === 'Vh') {
            const endIdx = code.indexOf('--', col);
            const rawText = endIdx < 0 ? code.substring(col) : code.substring(col, endIdx);
            col = endIdx < 0 ? code.length : endIdx + 2;
            const text = rawText.replace(/_/g, ' ');
            dialogParts.push(escapeAttr(text) + '<br>');
        } else if (verb === 'Xh') {
            const objId = code.substring(col, col + 2);
            const objZ = code.substring(col + 2, col + 4);
            const opt = code.substring(col + 4, col + 6);
            col += 6;
            const endIdx = code.indexOf('--', col);
            const rawLabel = endIdx < 0 ? code.substring(col) : code.substring(col, endIdx);
            col = endIdx < 0 ? code.length : endIdx + 2;
            const label = rawLabel.replace(/_/g, ' ');
            const target = escapeAttr('OC' + objId + objZ + opt);
            dialogParts.push(`<a href="gfx:${target}" style="color:var(--html-link,#00aaff); text-decoration:underline; cursor:pointer;">${escapeAttr(label)}</a>`);
        } else if (verb === 'Vi') {
            const endIdx = code.indexOf('--', col);
            const inv = endIdx < 0 ? code.substring(col) : code.substring(col, endIdx);
            col = endIdx < 0 ? code.length : endIdx + 2;
            window.playerInven = inv;
            if (typeof window.renderInventory === 'function') {
                window.renderInventory(inv);
            }
        } else if (verb === 'Va') {
            const endIdx = code.indexOf('--', col);
            col = endIdx < 0 ? code.length : endIdx + 2;
        } else if (verb === 'Vr') {
            const objId = code.substring(col, col + 2);
            const objZStr = code.substring(col + 2, col + 4);
            col += 4;
            removeObjectFromDOM(objId, objZStr);
        } else if (verb === 'Vg') {
            showJoinModalPopup();
        }
    }

    if (pendingLogoutSplash) {
        showSplashPopup(pendingLogoutSplash.msg, pendingLogoutSplash.user);
    }

    if (dialogParts.length > 0) {
        const bodyHtml = dialogParts.join('').replace(/<br>$/, '');
        const html = `<div style="padding:10px 14px; text-align:center; font-family:var(--font-face,monospace); line-height:1.5;">${bodyHtml}</div>`;
        if (typeof setPopForce === 'function') setPopForce('hidden');
        if (typeof pop === 'function') pop(html, getMapPopupPos());
    }
};

// --- Keyboard Input (supports physical keys + Cylon virtual keyboard) ---
window.keydown = function(key, e) {
    const keyStr = (typeof e === 'object' && e && e.key) ? e.key : String(key || '');
    const lower = keyStr.toLowerCase();

    const popMgr = window.parent && window.parent.CylonPopManager;
    const menuOpen = popMgr && (
        typeof popMgr.isMenuOpenForWindow === 'function'
            ? popMgr.isMenuOpenForWindow(window)
            : popMgr.isMenuOpen
    );
    if (menuOpen) {
        if (popMgr.handleMenuKey(keyStr)) {
            if (e) e.preventDefault();
            return;
        }
        if (lower === 'arrowleft' || lower === 'left' ||
            lower === 'arrowright' || lower === 'right') {
            if (e) e.preventDefault();
        }
        return;
    }

    if (!loggedInUser || (window.playerItem && window.playerItem.startsWith('Za'))) {
        return;
    }

    if (!window.playerAvatar) {
        if (e) e.preventDefault();
        checkAvatarRequired();
        return;
    }

    if (lower === 'escape' || lower === 'esc') {
        if (e) e.preventDefault();
        if (typeof hpop === 'function') hpop();
        if (window.CylonGFX.isLooking) {
            window.CylonGFX.isLooking = false;
            if (window.CylonGFX.lookCanvas) window.CylonGFX.lookCanvas.style.display = 'none';
            window.gfxDo = 'RF';
            flushNetworkNow();
        }
        return;
    }

    if (lower === 'enter') {
        if (e) e.preventDefault();
        if (popMgr && typeof popMgr.isPopupVisible === 'function' && popMgr.isPopupVisible() &&
            (!window.parent || window.parent.PopForce !== 'visible')) {
            if (typeof hpop === 'function') hpop();
            return;
        }
        handleTileClick(window.playerZ);
        return;
    }

    let dx = 0, dy = 0;
    if (keyStr === 'ArrowUp' || lower === 'up') dy = -1;
    else if (keyStr === 'ArrowDown' || lower === 'down') dy = 1;
    else if (keyStr === 'ArrowLeft' || lower === 'left') dx = -1;
    else if (keyStr === 'ArrowRight' || lower === 'right') dx = 1;

    if (dx !== 0 || dy !== 0) {
        if (e) e.preventDefault();
        if (typeof hpop === 'function') hpop();
        window.playerWalk = -1;
        window.playerDo = '';
        window.CylonGFX.moveCursor(dx, dy);
    }

    if (
        window.CylonGFX &&
        window.CylonGFX.fillTileCode &&
        !window.CylonGFX.isLooking &&
        !(e && (e.ctrlKey || e.metaKey || e.altKey)) &&
        keyStr.length === 1
    ) {
        const cur = window.CylonGFX.fillTileCode.padEnd(2, 'a').slice(0, 2);
        let c1 = cur[0];
        let c2 = cur[1];

        if (/^[A-Z]$/.test(keyStr)) {
            c1 = keyStr;
        } else if (/^[a-z0-9_()[\]{}^,:;+\-=@]$/.test(keyStr)) { // adjust allowed symbols as needed
            c2 = keyStr;
        } else {
            return;
        }
        if (e) e.preventDefault();
        window.CylonGFX.handleGfxCommand('tile', c1 + c2);
        window.CylonGFX.fillTileCode = c1 + c2;
        if (typeof print === 'function') {
            print(`Brush: ${window.CylonGFX.fillTileCode}\n`);
        }
    }
};

function triggerCylonPress(keyId) {
    if (window.parent && window.parent !== window && typeof window.parent.press === 'function') {
        window.parent.press({ id: keyId, toApp: true });
        return;
    }
    const fallbackMap = {
        up: 'ArrowUp',
        down: 'ArrowDown',
        left: 'ArrowLeft',
        right: 'ArrowRight',
        enter: 'Enter'
    };
    if (typeof window.keydown === 'function' && fallbackMap[keyId]) {
        window.keydown(fallbackMap[keyId], null);
    }
}

function initQuevilleControls() {
    const stage = document.getElementById('queville-stage');

    if (stage && localStorage.getItem('queville_thumb_side') === 'left') {
        stage.classList.add('thumb-left');
    }

    document.querySelectorAll('.qpad-thumb-toggle').forEach((toggleBtn) => {
        if (!stage) return;
        toggleBtn.addEventListener('pointerdown', (e) => e.preventDefault());
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isLeft = stage.classList.toggle('thumb-left');
            localStorage.setItem('queville_thumb_side', isLeft ? 'left' : 'right');
        });
    });

    document.querySelectorAll('#qhud-game .qpad-btn[data-key]').forEach((btn) => {
        const keyId = btn.getAttribute('data-key');
        const repeatable = (keyId !== 'enter');
        let delayTimer = null;
        let repeatTimer = null;
        let activePointerId = null;

        const stopPress = (e) => {
            if (activePointerId !== null && e && e.pointerId !== undefined && e.pointerId !== activePointerId) {
                return;
            }
            activePointerId = null;
            clearTimeout(delayTimer);
            clearInterval(repeatTimer);
            delayTimer = null;
            repeatTimer = null;
            btn.classList.remove('active');
        };

        btn.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            e.preventDefault();
            e.stopPropagation();

            stopPress();
            activePointerId = e.pointerId;
            try { btn.setPointerCapture(e.pointerId); } catch (err) {}
            btn.classList.add('active');

            triggerCylonPress(keyId);

            if (repeatable) {
                const cycleMs = Math.max(80, (window.CylonGFX && window.CylonGFX.gfxCycle) || 200);
                delayTimer = setTimeout(() => {
                    repeatTimer = setInterval(() => triggerCylonPress(keyId), cycleMs);
                }, 260);
            }
        });

        btn.addEventListener('pointerup', stopPress);
        btn.addEventListener('pointercancel', stopPress);
        btn.addEventListener('lostpointercapture', stopPress);
        window.addEventListener('blur', () => stopPress());
    });
}

window.renderInventory = function(invenStr) {
    const grid = document.getElementById('qhud-inven-grid');
    if (!grid) return;

    const code = (typeof invenStr === 'string') ? invenStr : (window.playerInven || '');
    const iconDir = (window.CylonGFX && window.CylonGFX.gfxIconDir) ? window.CylonGFX.gfxIconDir : 'i/';
    const wornParts = getWornAvatarParts();
    const usedWornIdx = new Set();

    hideHoverTooltip();
    grid.innerHTML = '';

    if (!code) {
        for (let i = 0; i < DEFAULT_INVEN_SLOTS; i++) {
            const emptySlot = document.createElement('div');
            emptySlot.className = 'qhud-inven-slot empty';
            grid.appendChild(emptySlot);
        }
        return;
    }

    let col = 0;
    while (col < code.length) {
        const verb = code.substring(col, col + 2);
        col += 2;
        if (verb.length < 2) break;

        if (verb === 'Za') {
            const emptySlot = document.createElement('div');
            emptySlot.className = 'qhud-inven-slot empty';
            grid.appendChild(emptySlot);
            continue;
        }

        if (verb >= 'Pa') {
            col += 2;
            continue;
        }

        const label = getItemLabel(verb);
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'qhud-inven-slot';
        slot.setAttribute('aria-label', label);

        const matchCodes = getWearMatchCodes(verb);
        if (matchCodes) {
            const matchIdx = wornParts.findIndex((p, idx) => !usedWornIdx.has(idx) && matchCodes.includes(p));
            if (matchIdx !== -1) {
                usedWornIdx.add(matchIdx);
                slot.classList.add('worn');
            }
        }

        const img = document.createElement('img');
        img.src = `${iconDir}${verb}.png`;
        img.alt = label;
        img.onerror = function() { this.style.visibility = 'hidden'; };

        slot.appendChild(img);
        slot.addEventListener('pointerenter', (e) => {
            if (e.pointerType === 'mouse') showHoverTooltip(label, slot);
        });
        slot.addEventListener('pointerleave', hideHoverTooltip);
        slot.addEventListener('click', (e) => {
            e.stopPropagation();
            hideHoverTooltip();
            showInvenItemMenu(verb, e, slot);
        });

        grid.appendChild(slot);
    }
};

function toLogoDataUri(raw) {
    if (!raw) return '';
    const trimmed = String(raw).trim();
    if (!trimmed) return '';
    if (/^data:image\//i.test(trimmed)) return trimmed;

    const b64 = trimmed.replace(/\s+/g, '');
    let mime = 'image/png';
    if (b64.startsWith('R0lGOD')) mime = 'image/gif';
    else if (b64.startsWith('/9j/')) mime = 'image/jpeg';
    else if (b64.startsWith('PHN2Zy') || b64.startsWith('PD94bW')) mime = 'image/svg+xml';
    else if (b64.startsWith('UklGR')) mime = 'image/webp';
    return `data:${mime};base64,${b64}`;
}

async function loadLogoImageInfo() {
    const dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    if (!dos) return null;

    let raw = null;
    try { raw = await dos.load('cylon:/cylon-queville.b64'); } catch (e) {}
    if (!raw) {
        try { raw = await dos.load('cylon-queville.b64'); } catch (e) {}
    }

    const src = toLogoDataUri(raw);
    if (!src) return null;

    return await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ src, width: img.naturalWidth, height: img.naturalHeight });
        img.onerror = () => resolve(null);
        img.src = src;
    });
}

        `if(!u||!p){if(msg)msg.textContent='Enter username and password.';return;}` +
        `if(msg)msg.textContent='Logging in...';` +
        `window.proxyInputInPopup=false;window.proxyInputMask=false;` +
        `if(window.setOSMode)window.setOSMode('app');` +
        `if(window.hideFullKeyboard)window.hideFullKeyboard();` +
        `var f=document.querySelector('.page-frame.active');` +
        `var target=(f&&f.contentWindow)?f.contentWindow:window;` +
        `target.postMessage({type:'QANDY_GFX_CMD',cmd:'login',data:{user:u,pass:p}},` +
        `(window.location.origin&&window.location.origin!=='null'?window.location.origin:'*'));` +
        `})()`;

    const createScript =
        `(function(){` +
        `var u=(document.getElementById('username').value||'').trim();` +
        `var p=document.getElementById('password').value||'';` +
        `var c=document.getElementById('confirm').value||'';` +
        `var msg=document.getElementById('qSplashMsg');` +
        `if(!u||!p||!c){if(msg)msg.textContent='Enter username, password, and confirm.';return;}` +
        `if(p!==c){if(msg)msg.textContent='Passwords do not match.';return;}` +
        `if(msg)msg.textContent='Creating account...';` +
        `window.proxyInputInPopup=false;window.proxyInputMask=false;` +
        `if(window.setOSMode)window.setOSMode('app');` +
        `if(window.hideFullKeyboard)window.hideFullKeyboard();` +
        `var f=document.querySelector('.page-frame.active');` +
        `var target=(f&&f.contentWindow)?f.contentWindow:window;` +
        `target.postMessage({type:'QANDY_GFX_CMD',cmd:'new',data:{user:u,pass:p}},` +
        `(window.location.origin&&window.location.origin!=='null'?window.location.origin:'*'));` +
        `})()`;

    const inputStyle =
        `width:130px; box-sizing:border-box; padding:3px 5px; font-family:inherit; ` +
        `background:var(--input-bg,#000); color:var(--input-fg,#0f0); border:1px solid var(--fg-color,#0f0); border-radius:3px;`;

    const btnStyle =
        `padding:4px 10px; font-family:inherit; font-weight:bold; cursor:pointer; ` +
        `background:var(--sel-bg,#333); color:var(--sel-fg,#0f0); border:1px solid var(--fg-color,#0f0); border-radius:3px;`;

    const html =
        `<div style="padding:10px 16px; text-align:center; font-family:var(--font-face,monospace); line-height:1.4;">` +
            `<div>An epic tale of Romance and Adventure...</div>` +
            logoHtml +
            `<div style="margin:4px 0;"><a href="gfx:GUEST">Play Now as a Guest Player!</a></div>` +
            `<div id="qSplashMsg" style="color:#ff5555; font-weight:bold; font-size:12px; min-height:1.2em; margin:6px 0 8px;">${safeMsg}</div>` +
            `<div style="display:inline-grid; grid-template-columns:auto auto auto; align-items:center; gap:5px 6px; text-align:left;">` +
                `<label for="username" style="text-align:right;">Username:</label>` +
                `<input id="username" type="text" maxlength="15" value="${safeUser}" autocomplete="off" ` +
                    `onkeydown="if(event.key==='Enter'){event.preventDefault();if(document.getElementById('password').value){${loginScript}}}" ` +
                    `style="${inputStyle}">` +
                `<span></span>` +

                `<label for="password" style="text-align:right;">Password:</label>` +
                `<input id="password" type="password" maxlength="32" autocomplete="off" ` +
                    `onkeydown="if(event.key==='Enter'){event.preventDefault();${loginScript}}" ` +
                    `style="${inputStyle}">` +
                `<span></span>` +

                `<div style="grid-column:1 / -1; text-align:center; padding:3px 0;">` +
                    `<button type="button" id="qSplashLoginBtn" onclick="${loginScript}" style="${btnStyle}">LOGIN</button>` +
                `</div>` +

                `<label for="confirm" style="text-align:right;">Confirm:</label>` +
                `<input id="confirm" type="password" maxlength="32" autocomplete="off" ` +
                    `onkeydown="if(event.key==='Enter'){event.preventDefault();${createScript}}" ` +
                    `style="${inputStyle}">` +
                `<button type="button" id="qSplashCreateBtn" onclick="${createScript}" style="${btnStyle}">CREATE</button>` +
            `</div>` +
        `</div>`;

    const wrapper = document.getElementById('desktop-wrapper');
    let pos = 'topcenter';
    if (wrapper) {
        const rect = wrapper.getBoundingClientRect();
        if (rect.width > 0) {
            pos = {
                x: Math.round(rect.left + rect.width / 2),
                y: 'topcenter',
                center: true
            };
        }
    }

    if (typeof pop === 'function') pop(html, pos);
}

function fitDesktopToScreen() {
    if (!window.CylonGFX) return;
    const wrapper = document.getElementById('desktop-wrapper');
    if (!wrapper) return;
    const cols = window.CylonGFX.gridWide || 14;
    const rows = window.CylonGFX.gridTall || 10;

    let w, h;
    if (window.CylonGFX.gfxGridStretch) {
        const aspect = cols / rows;

        const maxMapW = window.innerWidth * 0.72;
        h = window.innerHeight * 0.98;
        w = h * aspect;
        if (w > maxMapW) {
            w = maxMapW;
            h = w / aspect;
        }
        w = Math.floor(w);
        h = Math.floor(h);
    } else {
        const tileSize = window.CylonGFX.gfxTileSize || 32;
        w = cols * tileSize;
        h = rows * tileSize;
    }

    wrapper.style.width = w + 'px';
    wrapper.style.height = h + 'px';
}
</script>
