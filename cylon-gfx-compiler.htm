<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylon GFX Compiler</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx-itemid.js"></script>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: var(--bg-color, #000);
        color: var(--fg-color, #0f0);
        font-family: var(--font-face, monospace);
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Top Toolbar */
    .toolbar {
        background-color: var(--bg-color, #111);
        color: var(--menu-fg, #aaa);
        border-bottom: 2px solid var(--fg-color, #0f0);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        user-select: none;
        flex-shrink: 0;
    }

    .toolbar-title {
        font-weight: bold;
        color: var(--fg-color, #0f0);
        font-size: 15px;
        margin-right: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    button {
        padding: 6px 12px;
        cursor: pointer;
        background: var(--sel-bg, #333);
        color: var(--sel-fg, #0f0);
        border: 1px solid var(--fg-color, #0f0);
        font-weight: bold;
        font-family: inherit;
        font-size: 13px;
        border-radius: 3px;
    }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Views */
    #tree-view, #editor-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 100%;
    }
    #editor-view { display: none; }

    /* File Manager Tree Styles */
    .fm-header {
        display: grid;
        grid-template-columns: minmax(180px, 4fr) 80px 140px;
        gap: 10px;
        padding: 6px 12px;
        background-color: var(--menu-bg, #111);
        color: var(--menu-fg, #aaa);
        border-bottom: 1px solid var(--sel-bg, #333);
        font-weight: bold;
        font-size: 13px;
        user-select: none;
        flex-shrink: 0;
    }

    #fm-root {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
    }

    .fm-row {
        display: grid;
        grid-template-columns: minmax(180px, 4fr) 80px 140px;
        gap: 10px;
        padding: 6px 12px;
        align-items: center;
        border-bottom: 1px dashed var(--sel-bg, #333);
        cursor: pointer;
        transition: background 0.1s;
    }
    .fm-row:hover {
        background-color: var(--sel-bg, #222);
        color: var(--sel-fg, #0f0);
    }

    .fm-col-name {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
    }

    .fm-toggle {
        font-weight: bold;
        width: 26px;
        flex-shrink: 0;
        user-select: none;
        color: var(--fg-color, #0f0);
    }

    .fm-icon {
        width: 20px;
        height: 20px;
        image-rendering: pixelated;
        flex-shrink: 0;
    }

    .fm-label {
        color: var(--html-link, var(--fg-color, #0f0));
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .fm-row:hover .fm-label {
        color: var(--html-hover, var(--sel-fg, #0f0));
        text-decoration: underline;
    }
    .fm-dir-label {
        color: var(--fg-color, #0f0);
        font-weight: bold;
    }

    .fm-meta {
        font-size: 13px;
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .fm-children {
        display: none;
        margin-left: 16px;
        border-left: 1px dashed var(--sel-bg, #333);
        padding-left: 4px;
    }
    .expanded > .fm-children {
        display: block;
    }

    .loading-text {
        padding: 6px 12px;
        opacity: 0.6;
        font-size: 13px;
        font-style: italic;
    }

    /* Merged Editor & Decompiler Styles */
    #main-editor {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        gap: 12px;
    }

    #decompiler-view {
        background: var(--case-bg, #080808);
        border: 1px solid var(--case-fg, var(--sel-bg, #333));
        min-height: 50%;
        padding: 10px;
        border-radius: 4px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
    }

    textarea#punchcodeInput {
        width: 100%;
        height: 110px;
        background: var(--input-bg, #000);
        color: var(--input-fg, var(--fg-color, #0f0));
        border: 1px solid var(--fg-color, #0f0);
        padding: 10px;
        font-family: monospace;
        font-size: 16px;
        resize: none;
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .punchcode-space { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; }
    .punchcode-text { display: inline-flex; align-items: center; justify-content: center; background-color: var(--sel-bg, #006600); color: var(--sel-fg, #fff); font-family: monospace; font-size: 16px; font-weight: bold; border-radius: 4px; width: 32px; height: 32px; vertical-align: middle; margin: 1px; }
    .punchcode-img { width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin: 1px; background-size: cover; }
    .punchcode-img img { width: 32px; height: 32px; display: block; image-rendering: pixelated; }

    #tooltip {
        position: fixed;
        background: var(--menu-bg, #111);
        color: var(--menu-fg, #aaa);
        padding: 6px 10px;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        border: 1px solid var(--fg-color, #0f0);
        display: none;
        z-index: 1000;
        border-radius: 4px;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }
</style>
</head>
<body>

<!-- TREE / FILE MANAGER VIEW -->
<div id="tree-view">
    <div class="toolbar">
        <div class="toolbar-title">GFX COMPILER: <span id="active-drive-label">(No Drive)</span></div>
        <button onclick="showDriveMenu()">DRIVE</button>
        <button onclick="refreshTree()">REFRESH</button>
    </div>
    <div class="fm-header">
        <div>Name</div>
        <div>Size</div>
        <div>Modified</div>
    </div>
    <div id="fm-root">
        <div class="loading-text">Select a .gfx drive to browse...</div>
    </div>
</div>

<!-- PUNCH CODE EDITOR VIEW -->
<div id="editor-view">
    <div class="toolbar">
        <div class="toolbar-title" id="target-file">None Selected</div>
        <button id="back-btn" onclick="showTreeView()">FILES</button>
        <button id="cancel-btn" onclick="cancelEdit()">CANCEL</button>
        <button id="save-btn" onclick="saveLogic()" disabled>SAVE TO DISK</button>
    </div>
    <div id="main-editor">
        <div id="decompiler-view"></div>
        <textarea id="punchcodeInput" placeholder="Enter Punch Code or text here..." oninput="onCodeChange()" onchange="onCodeChange()"></textarea>
    </div>
</div>

<div id="tooltip"></div>

<script>
window.activeDrive = null;
let hostOrigin = '';
let driveIconDir = 'i/';
let driveTileDir = 't/';

// Tracks expanded folder paths so refreshes preserve tree state
const expandedPaths = new Set();

// Editor state
let currentTargetPath = null;
let originalCode = '';

function getDos() {
    return (window.parent && window.parent.CylonDOS) ? window.parent.CylonDOS : window.CylonDOS;
}

// Pull core + extended theme variables from parent OS and cylon:/a/
async function applyExtendedTheme() {
    if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
        window.CylonSDK.applyColors(window.parent ? window.parent.CylonColors : null);
    }
    const dos = getDos();
    if (!dos) return;

    const root = document.documentElement;
    const extraVars = {
        themeInputFG: '--input-fg',
        themeInputBG: '--input-bg',
        themeCaseBG: '--case-bg',
        themeCaseFG: '--case-fg',
        htmlLink: '--html-link',
        htmlVisited: '--html-visited',
        htmlHover: '--html-hover',
        htmlActive: '--html-active'
    };

    for (const [fileKey, cssVar] of Object.entries(extraVars)) {
        try {
            if (await dos.exists('cylon:/a/' + fileKey)) {
                const val = (await dos.load('cylon:/a/' + fileKey)).trim();
                if (val) root.style.setProperty(cssVar, val);
            }
        } catch (e) {}
    }

    try {
        if (window.parent && window.parent.cylonHostOrigin) {
            hostOrigin = window.parent.cylonHostOrigin;
        } else if (await dos.exists('cylon:/a/cylonHostOrigin')) {
            hostOrigin = (await dos.load('cylon:/a/cylonHostOrigin')).trim();
        }
        if (hostOrigin && !hostOrigin.endsWith('/')) hostOrigin += '/';
    } catch (e) {}
}

window.onload = async function() {
    await applyExtendedTheme();

    // Tap anywhere if no drive is selected yet (in case menu was dismissed)
    document.getElementById('fm-root').addEventListener('pointerup', () => {
        if (!window.activeDrive) showDriveMenu();
    });

    const openedTarget = await checkEditTarget();
    if (!openedTarget && !window.activeDrive) {
        await showDriveMenu();
    }
};

// Re-check for incoming edit targets or refresh tree when switching tabs
window.addEventListener('message', async (e) => {
    if (window.location.origin !== "null" && e.origin !== window.location.origin) return;
    if (e.source !== window && e.source !== window.parent) return;

    if (e.data && e.data.type === 'QANDY_PAGE_ACTIVATED') {
        const openedTarget = await checkEditTarget();
        if (!openedTarget) {
            if (!window.activeDrive) {
                await showDriveMenu();
            } else if (document.getElementById('tree-view').style.display !== 'none') {
                await renderRootTree();
            }
        }
    } else if (e.data && e.data.type === 'QANDY_UPDATE_COLORS') {
        await applyExtendedTheme();
    }
});

async function checkEditTarget() {
    const dos = getDos();
    if (!dos) return false;

    try {
        if (!(await dos.exists('cylon:/a/gfxEditTarget'))) return false;
        let targetPath = await dos.load('cylon:/a/gfxEditTarget');
        targetPath = targetPath ? targetPath.trim() : '';
        if (!targetPath) return false;

        // Consume target so subsequent clicks on the same file still trigger
        await dos.save('cylon:/a/gfxEditTarget', '');

        const colonIdx = targetPath.indexOf(':');
        if (colonIdx > 0) {
            const driveName = targetPath.substring(0, colonIdx);
            if (window.activeDrive !== driveName) {
                await selectDrive(driveName, { skipRender: false });
            }
        }

        await openFileInEditor(targetPath);
        return true;
    } catch (e) {
        console.warn('Could not read gfxEditTarget', e);
        return false;
    }
}

async function showDriveMenu() {
    const dos = getDos();
    if (!dos || !window.parent || !window.parent.CylonPopManager) return;

    const mounts = await dos.mounts();
    const gfxDrives = mounts.filter(m => {
        const src = (m.source || '').toLowerCase();
        const name = (m.name || '').toLowerCase();
        return src.endsWith('.gfx') || name.endsWith('.gfx') || name === 'desktop';
    });

    const items = [];
    if (gfxDrives.length === 0) {
        items.push({
            label: '(No .gfx drives mounted)',
            action: () => {
                if (window.parent && window.parent.printDOS) {
                    window.parent.printDOS('[.2]Mount a .gfx drive first, e.g.: mount cylon-desktop.gfx ram[.]\n');
                }
            }
        });
    } else {
        gfxDrives.forEach(m => {
            items.push({
                label: `${m.name} [${m.type}]`,
                action: () => selectDrive(m.name)
            });
        });
    }

    window.parent.CylonPopManager.showContextMenu('topleft', items);
}

async function selectDrive(driveName, opts) {
    if (!driveName) return;
    window.activeDrive = driveName;
    document.getElementById('active-drive-label').textContent = driveName + ':/';

    // Default /w/ to expanded on newly chosen drive
    expandedPaths.clear();
    expandedPaths.add(`${driveName}:/w`);

    // Resolve drive-specific asset paths (with fallback to hostOrigin)
    const dos = getDos();
    driveIconDir = 'i/';
    driveTileDir = 't/';
    if (dos) {
        try {
            if (await dos.exists(`${driveName}:/a/gfxIconDir`)) {
                const v = (await dos.load(`${driveName}:/a/gfxIconDir`)).trim();
                if (v) driveIconDir = v;
            }
            if (await dos.exists(`${driveName}:/a/gfxTileDir`)) {
                const v = (await dos.load(`${driveName}:/a/gfxTileDir`)).trim();
                if (v) driveTileDir = v;
            }
        } catch (e) {}
    }

    if (hostOrigin) {
        if (!driveIconDir.match(/^https?:\/\//i) && !driveIconDir.startsWith('data:')) {
            driveIconDir = hostOrigin + driveIconDir.replace(/^\/+/, '');
        }
        if (!driveTileDir.match(/^https?:\/\//i) && !driveTileDir.startsWith('data:')) {
            driveTileDir = hostOrigin + driveTileDir.replace(/^\/+/, '');
        }
    }
    if (!driveIconDir.endsWith('/')) driveIconDir += '/';
    if (!driveTileDir.endsWith('/')) driveTileDir += '/';

    if (!(opts && opts.skipRender)) {
        showTreeView();
        await renderRootTree();
    }
}

async function refreshTree() {
    if (!window.activeDrive) {
        await showDriveMenu();
        return;
    }
    await renderRootTree();
}

function formatDate(ts) {
    if (!ts || ts.length !== 14) return ts || '--';
    return `${ts.substring(0,4)}-${ts.substring(4,6)}-${ts.substring(6,8)} ${ts.substring(8,10)}:${ts.substring(10,12)}`;
}

function getFileVisualInfo(name, fullPath) {
    // Check if inside a sector folder under /w/<sector>/<file>
    const clean = fullPath.replace(/^[^:]+:\//, '');
    const parts = clean.split('/').filter(Boolean);
    const inSector = (parts.length === 3 && parts[0] === 'w' && name !== 'm' && name.length >= 4);

    if (inSector) {
        const iconId = name.substring(0, 2);
        const zCode = name.substring(2, 4);
        const dataCode = name.length >= 6 ? name.substring(4, 6) : '';
        const itemLabel = (typeof gfxItemID === 'function') ? gfxItemID(iconId) : iconId;
        const displayLabel = `${name} — ${itemLabel} (Z:${zCode}${dataCode ? ', D:' + dataCode : ''})`;
        return { iconSrc: `${driveIconDir}${iconId}.png`, label: displayLabel };
    }

    const lower = name.toLowerCase();
    let code = 'Fi';
    if (lower === 'm') code = 'Ga';
    else if (lower.endsWith('.htm') || lower.endsWith('.html')) code = 'Aa';
    else if (lower.endsWith('.js')) code = 'Lj';
    else if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.gif')) code = 'Im';
    else if (name.length === 1 || lower.endsWith('.txt') || lower.endsWith('.cfg')) code = 'Tx';

    return { iconSrc: `${driveIconDir}${code}.png`, label: name };
}

async function renderRootTree() {
    const rootEl = document.getElementById('fm-root');
    if (!window.activeDrive) {
        rootEl.innerHTML = '<div class="loading-text">Select a .gfx drive to browse...</div>';
        return;
    }

    rootEl.innerHTML = '';
    const drive = window.activeDrive;

    // Order requested: /a/ at top, /p/ second, /w/ third
    const rootDirs = [
        { name: 'a', label: '/a/ (Alpha Config)', path: `${drive}:/a` },
        { name: 'p', label: '/p/ (Players / Data)', path: `${drive}:/p` },
        { name: 'w', label: '/w/ (World Scripts & Sectors)', path: `${drive}:/w` }
    ];

    for (const dirInfo of rootDirs) {
        const node = await createDirNode(dirInfo.label, dirInfo.path, '');
        rootEl.appendChild(node);
    }
}

async function createDirNode(displayName, fullPath, modifiedStr) {
    const wrapper = document.createElement('div');
    wrapper.className = 'fm-item-wrapper';

    const row = document.createElement('div');
    row.className = 'fm-row';

    const colName = document.createElement('div');
    colName.className = 'fm-col-name';

    const toggleSpan = document.createElement('span');
    toggleSpan.className = 'fm-toggle';

    const img = document.createElement('img');
    img.src = `${driveIconDir}Au.png`;
    img.className = 'fm-icon';
    img.onerror = function() { this.style.visibility = 'hidden'; };

    const labelSpan = document.createElement('span');
    labelSpan.className = 'fm-dir-label';
    labelSpan.textContent = displayName;
    labelSpan.title = fullPath;

    colName.appendChild(toggleSpan);
    colName.appendChild(img);
    colName.appendChild(labelSpan);

    const colSize = document.createElement('div');
    colSize.className = 'fm-meta';
    colSize.textContent = '<DIR>';

    const colDate = document.createElement('div');
    colDate.className = 'fm-meta';
    colDate.textContent = modifiedStr || '--';

    row.appendChild(colName);
    row.appendChild(colSize);
    row.appendChild(colDate);
    wrapper.appendChild(row);

    const childrenContainer = document.createElement('div');
    childrenContainer.className = 'fm-children';
    wrapper.appendChild(childrenContainer);

    let loaded = false;

    async function setExpanded(expand) {
        if (expand) {
            expandedPaths.add(fullPath);
            wrapper.classList.add('expanded');
            toggleSpan.textContent = '[-]';
            if (!loaded) {
                loaded = true;
                childrenContainer.innerHTML = '<div class="loading-text">Loading...</div>';
                await populateDirectory(fullPath, childrenContainer);
            }
        } else {
            expandedPaths.delete(fullPath);
            wrapper.classList.remove('expanded');
            toggleSpan.textContent = '[+]';
        }
    }

    row.onclick = async (e) => {
        e.stopPropagation();
        await setExpanded(!expandedPaths.has(fullPath));
    };

    const isExpanded = expandedPaths.has(fullPath);
    toggleSpan.textContent = isExpanded ? '[-]' : '[+]';
    if (isExpanded) {
        await setExpanded(true);
    }

    return wrapper;
}

function createFileRow(name, fullPath, sizeStr, dateStr) {
    const row = document.createElement('div');
    row.className = 'fm-row';

    const visual = getFileVisualInfo(name, fullPath);

    const colName = document.createElement('div');
    colName.className = 'fm-col-name';

    const spacer = document.createElement('span');
    spacer.className = 'fm-toggle';
    spacer.textContent = '   ';

    const img = document.createElement('img');
    img.src = visual.iconSrc;
    img.className = 'fm-icon';
    img.onerror = function() {
        this.onerror = null;
        this.src = `${driveIconDir}Tx.png`;
    };

    const labelSpan = document.createElement('span');
    labelSpan.className = 'fm-label';
    labelSpan.textContent = visual.label;
    labelSpan.title = fullPath;

    colName.appendChild(spacer);
    colName.appendChild(img);
    colName.appendChild(labelSpan);

    const colSize = document.createElement('div');
    colSize.className = 'fm-meta';
    colSize.textContent = sizeStr;

    const colDate = document.createElement('div');
    colDate.className = 'fm-meta';
    colDate.textContent = dateStr;

    row.appendChild(colName);
    row.appendChild(colSize);
    row.appendChild(colDate);

    row.onclick = (e) => {
        e.stopPropagation();
        openFileInEditor(fullPath);
    };

    return row;
}

async function populateDirectory(dirPath, container) {
    const dos = getDos();
    if (!dos) return;

    try {
        if (!(await dos.exists(dirPath))) {
            container.innerHTML = '<div class="loading-text">(empty)</div>';
            return;
        }

        const entries = await dos.dir(dirPath);
        container.innerHTML = '';

        const dirs = entries
            .filter(e => e.type === 'directory')
            .sort((a, b) => a.name.localeCompare(b.name));

        const files = entries
            .filter(e => e.type === 'file' && !e.name.endsWith('_dir.sys!'))
            .sort((a, b) => a.name.localeCompare(b.name));

        if (dirs.length === 0 && files.length === 0) {
            container.innerHTML = '<div class="loading-text">(empty)</div>';
            return;
        }

        // List files first (e.g. a, b, c, e, t in /w/, or m + objects in sectors), then subdirs
        for (const f of files) {
            const fileName = f.name.substring(f.name.lastIndexOf('/') + 1);
            const fullPath = dirPath + (dirPath.endsWith('/') ? '' : '/') + fileName;
            container.appendChild(createFileRow(fileName, fullPath, dos.formatSize(f.size), formatDate(f.timestamp)));
        }

        for (const d of dirs) {
            const cleanName = d.name.replace(/[<>]/g, '');
            const folderName = cleanName.substring(cleanName.lastIndexOf('/') + 1);
            const fullPath = dirPath + (dirPath.endsWith('/') ? '' : '/') + folderName;
            container.appendChild(await createDirNode(folderName + '/', fullPath, formatDate(d.timestamp)));
        }
    } catch (err) {
        container.innerHTML = `<div class="loading-text" style="color:var(--text-fg3, #f44);">Error reading ${dirPath}</div>`;
    }
}

// ============================================================================
// MERGED PUNCH CODE / TEXT FILE EDITOR
// ============================================================================

function formatTargetHeadline(targetPath) {
    const clean = targetPath.replace(/^[^:]+:\//, '');
    const parts = clean.split('/').filter(Boolean);

    // Format Sector <sector> <Z> "<Item>" only for object/item files inside /w/<sector>/
    if (parts.length === 3 && parts[0] === 'w') {
        const sector = parts[1];
        const filename = parts[2];
        if (filename !== 'm' && filename.length >= 4) {
            const iconId = filename.substring(0, 2);
            const zCode = filename.substring(2, 4);
            const itemLabel = (typeof gfxItemID === 'function') ? gfxItemID(iconId) : iconId;
            return `Sector ${sector} ${zCode} "${itemLabel}" (${filename})`;
        }
    }
    return targetPath;
}

async function openFileInEditor(targetPath) {
    const dos = getDos();
    if (!dos) return;

    currentTargetPath = targetPath;
    document.getElementById('target-file').textContent = formatTargetHeadline(targetPath);

    let content = '';
    try {
        const loaded = await dos.load(targetPath);
        if (loaded !== null) content = loaded;
    } catch (e) {
        content = '';
    }

    // Expand escaped newlines if file was written with \n placeholders
    content = content.replace(/\\n/g, '\n');

    originalCode = content;
    document.getElementById('punchcodeInput').value = content;
    document.getElementById('save-btn').disabled = true;

    document.getElementById('tree-view').style.display = 'none';
    document.getElementById('editor-view').style.display = 'flex';

    decompilepunchcode(content);
}

function showTreeView() {
    document.getElementById('editor-view').style.display = 'none';
    document.getElementById('tree-view').style.display = 'flex';
    document.getElementById('tooltip').style.display = 'none';
    renderRootTree();
}

function cancelEdit() {
    currentTargetPath = null;
    originalCode = '';
    document.getElementById('punchcodeInput').value = '';
    document.getElementById('save-btn').disabled = true;
    document.getElementById('decompiler-view').innerHTML = '';
    showTreeView();
}

function onCodeChange() {
    const currentCode = document.getElementById('punchcodeInput').value;
    document.getElementById('save-btn').disabled = (currentCode === originalCode);
    decompilepunchcode(currentCode);
}

async function saveLogic() {
    if (!currentTargetPath) return;
    const dos = getDos();
    if (!dos) return;

    const currentCode = document.getElementById('punchcodeInput').value;

    try {
        await dos.save(currentTargetPath, currentCode);
        originalCode = currentCode;
        document.getElementById('save-btn').disabled = true;

        if (window.popHtm) {
            window.popHtm(
                `<div style="padding:12px 18px; background:var(--menu-bg,#111); border:1px solid var(--fg-color,#0f0); color:var(--fg-color,#0f0); text-align:center;"><b>Saved!</b></div>`,
                'center'
            );
            setTimeout(() => { if (window.hpop) window.hpop(); }, 900);
        }
    } catch (err) {
        if (window.parent && window.parent.printDOS) {
            window.parent.printDOS(`Error saving ${currentTargetPath}: [.4]${err.message || err}[.]\n`);
        }
    }
}

// ============================================================================
// VISUAL DECOMPILER ENGINE
// ============================================================================

function getCodeDescription(code) {
    if (code === "Za") return "nothing (null)";
    const itemText = typeof gfxItemID === "function" ? gfxItemID(code) : "Unknown";
    if (itemText !== "Item " + code && itemText !== "Unknown") return itemText;
    return `code "${code}"`;
}

function decompilepunchcode(initialCode) {
    const container = document.getElementById('decompiler-view');
    container.innerHTML = "";
    if (!initialCode) return;

    function bindHover(element, desc, startIdx, endIdx) {
        element.style.cursor = "pointer";
        element.addEventListener('mousemove', (e) => {
            const ta = document.getElementById('punchcodeInput');
            if (document.activeElement === ta) {
                ta.setSelectionRange(startIdx, endIdx);
            }
            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            tooltip.innerText = desc;
            tooltip.style.left = Math.min(window.innerWidth - 180, e.clientX + 14) + 'px';
            tooltip.style.top = Math.min(window.innerHeight - 40, e.clientY + 14) + 'px';
        });
        element.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });
    }

    let col = 0;
    let ifnot = false;
    let ifnotStartIdx = null;
    const srcString = initialCode;

    while (col < srcString.length) {
        const startIdx = col;
        const char = srcString.charAt(col);

        if (char === ' ' || char === '\t') {
            const spacer = document.createElement('div');
            spacer.className = 'punchcode-space';
            container.appendChild(spacer);
            col++;
            continue;
        } else if (char === '\n' || char === '\r') {
            const br = document.createElement('div');
            br.style.flexBasis = '100%';
            br.style.height = '0';
            container.appendChild(br);
            if (char === '\r' && srcString.charAt(col + 1) === '\n') col++;
            col++;
            continue;
        }

        const len = Math.min(2, srcString.length - col);
        const item = srcString.substring(col, col + len);
        const endIdx = col + len;
        col = endIdx;

        const rawDesc = getCodeDescription(item);

        if (item === "Xn") {
            ifnot = true;
            ifnotStartIdx = startIdx;
            continue;
        }

        const blockEl = document.createElement('div');
        blockEl.className = 'punchcode-img';
        blockEl.style.backgroundImage = `url('${driveTileDir}Za.png')`;

        const img = document.createElement('img');
        img.onerror = function() { this.style.opacity = '0.25'; };

        if (item === "Xc") {
            img.src = `${driveIconDir}Xc.png`;
            bindHover(blockEl, rawDesc, startIdx, endIdx);
        } else if (item.startsWith("##") || item.startsWith("%%") || item.startsWith("$$")) {
            blockEl.className = 'punchcode-text';
            blockEl.textContent = item;
            bindHover(blockEl, "Parameter Marker", startIdx, endIdx);
        } else {
            img.src = ifnot ? `${driveIconDir}${item}n.png` : `${driveIconDir}${item}.png`;
            const tooltipDesc = ifnot ? ("If Not: " + rawDesc) : rawDesc;
            const finalStart = ifnot ? ifnotStartIdx : startIdx;
            bindHover(blockEl, tooltipDesc || item, finalStart, endIdx);
        }

        if (blockEl.className === 'punchcode-img') blockEl.appendChild(img);
        container.appendChild(blockEl);

        while (col < srcString.length && (
            srcString.substring(col, col + 2) === "%%" ||
            srcString.substring(col, col + 2) === "$$" ||
            srcString.substring(col, col + 2) === "##"
        )) {
            const prefix = srcString.substring(col, col + 2);
            col += 2;
            const paramText = srcString.substring(col, col + 2);
            col += 2;

            const paramBlock = document.createElement('div');
            let paramDesc = "";

            if (prefix === "##") {
                paramBlock.className = 'punchcode-text';
                paramBlock.textContent = paramText;
                paramDesc = "Number: " + paramText;
            } else {
                paramBlock.className = 'punchcode-img';
                paramBlock.style.backgroundImage = `url('${driveTileDir}Za.png')`;
                const pImg = document.createElement('img');
                pImg.src = `${driveIconDir}${paramText}.png`;
                pImg.onerror = function() { this.style.opacity = '0.25'; };
                paramBlock.appendChild(pImg);
                paramDesc = (prefix === "%%" ? "Param: " : "Item: ") + getCodeDescription(paramText);
            }
            container.appendChild(paramBlock);
            bindHover(paramBlock, paramDesc, col - 4, col);
        }

        ifnot = false;
    }
}
