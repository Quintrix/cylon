<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylon GFX Compiler</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx-itemid.js"></script>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background-color: var(--bg-color, #000);
        color: var(--fg-color, #0f0);
        font-family: var(--font-face, monospace);
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Top Toolbar */
    .toolbar {
        background-color: var(--bg-color, #111);
        color: var(--menu-fg, #aaa);
        border-bottom: 2px solid var(--fg-color, #0f0);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        user-select: none;
        flex-shrink: 0;
    }

    .toolbar-title {
        font-weight: bold;
        color: var(--fg-color, #0f0);
        font-size: 15px;
        margin-right: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    button {
        padding: 6px 12px;
        cursor: pointer;
        background: var(--sel-bg, #333);
        color: var(--sel-fg, #0f0);
        border: 1px solid var(--fg-color, #0f0);
        font-weight: bold;
        font-family: inherit;
        font-size: 13px;
        border-radius: 3px;
    }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* New QPC Tag Bar */
    #new-tag-bar {
        display: none;
        background-color: var(--menu-bg, #111);
        border-bottom: 1px solid var(--fg-color, #0f0);
        padding: 8px 12px;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    #new-tag-bar input[type="text"] {
        background: var(--input-bg, #000);
        color: var(--input-fg, var(--fg-color, #0f0));
        border: 1px solid var(--fg-color, #0f0);
        padding: 5px 8px;
        font-family: monospace;
        font-size: 14px;
        min-width: 180px;
        flex: 1;
        max-width: 280px;
    }
    #new-tag-error {
        color: var(--text-fg3, #ff4444);
        font-size: 12px;
        flex-basis: 100%;
        display: none;
    }

    /* Views */
    #tree-view, #editor-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: 100%;
    }
    #editor-view { display: none; }

    /* File Manager Tree Styles */
    .fm-header {
        display: grid;
        grid-template-columns: minmax(180px, 4fr) 80px 140px;
        gap: 10px;
        padding: 6px 12px;
        background-color: var(--menu-bg, #111);
        color: var(--menu-fg, #aaa);
        border-bottom: 1px solid var(--sel-bg, #333);
        font-weight: bold;
        font-size: 13px;
        user-select: none;
        flex-shrink: 0;
    }

    #fm-root {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 24px;
    }

    .fm-row {
        display: grid;
        grid-template-columns: minmax(180px, 4fr) 80px 140px;
        gap: 10px;
        padding: 6px 12px;
        align-items: center;
        border-bottom: 1px dashed var(--sel-bg, #333);
        cursor: pointer;
        transition: background 0.1s;
    }
    .fm-row:hover {
        background-color: var(--sel-bg, #222);
        color: var(--sel-fg, #0f0);
    }

    .fm-col-name {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
    }

    .fm-toggle {
        font-weight: bold;
        width: 26px;
        flex-shrink: 0;
        user-select: none;
        color: var(--fg-color, #0f0);
    }

    .fm-icon {
        width: 20px;
        height: 20px;
        image-rendering: pixelated;
        flex-shrink: 0;
    }

    .fm-label {
        color: var(--html-link, var(--fg-color, #0f0));
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .fm-label-invalid {
        color: var(--text-fg3, #ff4444);
    }
    .fm-row:hover .fm-label {
        color: var(--html-hover, var(--sel-fg, #0f0));
        text-decoration: underline;
    }
    .fm-dir-label {
        color: var(--fg-color, #0f0);
        font-weight: bold;
    }

    .fm-meta {
        font-size: 13px;
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .fm-children {
        display: none;
        margin-left: 16px;
        border-left: 1px dashed var(--sel-bg, #333);
        padding-left: 4px;
    }
    .expanded > .fm-children {
        display: block;
    }

    .loading-text {
        padding: 6px 12px;
        opacity: 0.6;
        font-size: 13px;
        font-style: italic;
    }

    /* Merged Editor & Decompiler Styles */
    #main-editor {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        gap: 12px;
    }

    #editor-notice {
        display: none;
        padding: 6px 10px;
        border: 1px solid var(--text-fg2, #ff0);
        background: var(--menu-bg, #111);
        color: var(--text-fg2, #ff0);
        font-size: 13px;
        border-radius: 3px;
        flex-shrink: 0;
    }

    #decompiler-view {
        background: var(--case-bg, #080808);
        border: 1px solid var(--case-fg, var(--sel-bg, #333));
        min-height: 50%;
        padding: 10px;
        border-radius: 4px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
    }

    textarea#punchcodeInput {
        width: 100%;
        height: 110px;
        background: var(--input-bg, #000);
        color: var(--input-fg, var(--fg-color, #0f0));
        border: 1px solid var(--fg-color, #0f0);
        padding: 10px;
        font-family: monospace;
        font-size: 16px;
        resize: none;
        box-sizing: border-box;
        flex-shrink: 0;
    }

    .punchcode-space { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; }
    .punchcode-text { display: inline-flex; align-items: center; justify-content: center; background-color: var(--sel-bg, #006600); color: var(--sel-fg, #fff); font-family: monospace; font-size: 16px; font-weight: bold; border-radius: 4px; width: 32px; height: 32px; vertical-align: middle; margin: 1px; }
    .punchcode-img { width: 32px; height: 32px; display: inline-block; vertical-align: middle; margin: 1px; background-size: cover; box-sizing: border-box; }
    .punchcode-img img { width: 32px; height: 32px; display: block; image-rendering: pixelated; }
    .punchcode-not-fallback { outline: 1px solid var(--text-fg3, #ff4444); outline-offset: -1px; }

    /* Half-width (16px = 2 chars per 32px punch code) text & numerals */
    .punchcode-half-group {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        vertical-align: middle;
        margin: 1px;
        max-width: 100%;
    }
    .punchcode-half {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 32px;
        background-color: var(--sel-bg, #006600);
        color: var(--sel-fg, #fff);
        font-family: monospace;
        font-size: 15px;
        font-weight: bold;
        border-right: 1px solid rgba(0, 0, 0, 0.25);
        box-sizing: border-box;
        user-select: none;
    }
    .punchcode-half:first-child { border-radius: 4px 0 0 4px; }
    .punchcode-half:last-child  { border-radius: 0 4px 4px 0; border-right: none; }
    .punchcode-half:only-child  { border-radius: 4px; border-right: none; }
    .punchcode-half.is-space {
        background-color: var(--case-bg, #080808);
        border: 1px dashed var(--sel-bg, #333);
    }
    .punchcode-half.is-end {
        background-color: var(--menu-bg, #222);
        color: var(--fg-color, #0f0);
    }
    .punchcode-half.is-unterminated {
        background-color: var(--text-fg3, #770000);
        color: #fff;
    }

    /* Server Plug S^...^S container */
    .punchcode-plug {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        border: 1px dashed var(--text-fg2, #ff0);
        border-radius: 4px;
        padding: 1px 3px;
        margin: 1px 2px;
        background: rgba(255, 255, 0, 0.04);
    }

    /* QPC Macro Visual Blocks */
    .punchcode-macro {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        border: 1px dashed var(--fg-color, #0f0);
        border-radius: 4px;
        padding: 2px 4px;
        margin: 1px 3px;
        background: rgba(0, 255, 0, 0.05);
        cursor: pointer;
    }
    .punchcode-tag-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--sel-bg, #333);
        color: var(--sel-fg, #0f0);
        border: 1px solid var(--fg-color, #0f0);
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
        padding: 0 6px;
        height: 28px;
        border-radius: 3px;
        margin: 1px 4px 1px 1px;
        cursor: pointer;
    }
    .punchcode-tag-missing {
        border-color: var(--text-fg2, #ff0);
        color: var(--text-fg2, #ff0);
    }
    .punchcode-tag-invalid {
        border-color: var(--text-fg3, #f44);
        color: var(--text-fg3, #f44);
    }

    #tooltip {
        position: fixed;
        background: var(--menu-bg, #111);
        color: var(--menu-fg, #aaa);
        padding: 6px 10px;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        border: 1px solid var(--fg-color, #0f0);
        display: none;
        z-index: 1000;
        border-radius: 4px;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }
</style>
</head>
<body>

<!-- TREE / FILE MANAGER VIEW -->
<div id="tree-view">
    <div class="toolbar">
        <div class="toolbar-title">GFX COMPILER: <span id="active-drive-label">(No Drive)</span></div>
        <button onclick="showDriveMenu()">DRIVE</button>
        <button id="new-tag-btn" onclick="toggleNewTagBar()" disabled>+ TAG</button>
        <button onclick="refreshTree()">REFRESH</button>
    </div>
    <div id="new-tag-bar">
        <input type="text" id="new-tag-input" placeholder="tag name (a-z, 0-9, 3+ chars)" maxlength="32">
        <button onclick="createNewTag()">CREATE</button>
        <button onclick="toggleNewTagBar(false)">CANCEL</button>
        <div id="new-tag-error"></div>
    </div>
    <div class="fm-header">
        <div>Name</div>
        <div>Size</div>
        <div>Modified</div>
    </div>
    <div id="fm-root">
        <div class="loading-text">Select a .gfx drive to browse...</div>
    </div>
</div>

<!-- PUNCH CODE EDITOR VIEW -->
<div id="editor-view">
    <div class="toolbar">
        <div class="toolbar-title" id="target-file">None Selected</div>
        <button id="back-btn" onclick="showTreeView()">FILES</button>
        <button id="cancel-btn" onclick="cancelEdit()">CANCEL</button>
        <button id="save-btn" onclick="saveLogic()" disabled>SAVE TO DISK</button>
    </div>
    <div id="main-editor">
        <div id="editor-notice"></div>
        <div id="decompiler-view"></div>
        <textarea id="punchcodeInput" placeholder="Enter Punch Code or [tag] here..." oninput="onCodeChange()" onchange="onCodeChange()"></textarea>
    </div>
</div>

<div id="tooltip"></div>

<script>
window.activeDrive = null;
let hostOrigin = '';
let driveIconDir = 'i/';
let driveTileDir = 't/';
let driveCharDir = 'c/';
let driveItemOverrides = {};

// Editor state
let currentTargetPath = null;
let originalCode = '';
let remoteTarget = null;

// Strict QPC tag rule: >= 3 chars, lowercase letters and numerals only
const VALID_QPC_TAG_RE = /^[a-z0-9]{3,}$/;

// In-memory cache of loaded /q/<tag> punch code for the active drive
const qpcCache = new Map();

// Tracks expanded folder paths so refreshes preserve tree state
const expandedPaths = new Set();

function getDos() {
    return (window.parent && window.parent.CylonDOS) ? window.parent.CylonDOS : window.CylonDOS;
}

async function applyExtendedTheme() {
    if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
        window.CylonSDK.applyColors(window.parent ? window.parent.CylonColors : null);
    }
    const dos = getDos();
    if (!dos) return;

    const root = document.documentElement;
    const extraVars = {
        themeInputFG: '--input-fg',
        themeInputBG: '--input-bg',
        themeCaseBG: '--case-bg',
        themeCaseFG: '--case-fg',
        htmlLink: '--html-link',
        htmlVisited: '--html-visited',
        htmlHover: '--html-hover',
        htmlActive: '--html-active'
    };

    for (const [fileKey, cssVar] of Object.entries(extraVars)) {
        try {
            if (await dos.exists('cylon:/a/' + fileKey)) {
                const val = (await dos.load('cylon:/a/' + fileKey)).trim();
                if (val) root.style.setProperty(cssVar, val);
            }
        } catch (e) {}
    }

    try {
        if (window.parent && window.parent.cylonHostOrigin) {
            hostOrigin = window.parent.cylonHostOrigin;
        } else if (await dos.exists('cylon:/a/cylonHostOrigin')) {
            hostOrigin = (await dos.load('cylon:/a/cylonHostOrigin')).trim();
        }
        if (hostOrigin && !hostOrigin.endsWith('/')) hostOrigin += '/';
    } catch (e) {}
}

window.onload = async function() {
    await applyExtendedTheme();

    document.getElementById('fm-root').addEventListener('pointerup', () => {
        if (!window.activeDrive) showDriveMenu();
    });

    const openedTarget = await checkEditTarget();
    if (!openedTarget && !window.activeDrive) {
        await showDriveMenu();
    }
};

window.addEventListener('message', async (e) => {
    if (window.location.origin !== "null" && e.origin !== window.location.origin) return;
    if (e.source !== window && e.source !== window.parent) return;

    if (e.data && e.data.type === 'QANDY_PAGE_ACTIVATED') {
        const openedTarget = await checkEditTarget();
        if (!openedTarget) {
            if (!window.activeDrive) {
                await showDriveMenu();
            } else if (document.getElementById('tree-view').style.display !== 'none') {
                await preloadQpcTags();
                await renderRootTree();
            }
        }
    } else if (e.data && e.data.type === 'QANDY_UPDATE_COLORS') {
        await applyExtendedTheme();
    }
});

async function checkEditTarget() {
    const dos = getDos();
    if (!dos) return false;

    try {
        if (!(await dos.exists('cylon:/a/gfxEditTarget'))) return false;
        let targetRaw = await dos.load('cylon:/a/gfxEditTarget');
        targetRaw = targetRaw ? targetRaw.trim() : '';
        if (!targetRaw) return false;

        await dos.save('cylon:/a/gfxEditTarget', '');

        if (targetRaw.startsWith('{')) {
            let parsed = null;
            try { parsed = JSON.parse(targetRaw); } catch (e) { parsed = null; }
            if (parsed && parsed.mode === 'remote') {
                const cachePath = parsed.path || '';
                const colonIdx = cachePath.indexOf(':');
                if (colonIdx > 0) {
                    const driveName = cachePath.substring(0, colonIdx);
                    if (window.activeDrive !== driveName) {
                        await selectDrive(driveName, { skipRender: true });
                    }
                }
                await openRemoteTargetInEditor(parsed);
                return true;
            }
        }

        const colonIdx = targetRaw.indexOf(':');
        if (colonIdx > 0) {
            const driveName = targetRaw.substring(0, colonIdx);
            if (window.activeDrive !== driveName) {
                await selectDrive(driveName, { skipRender: false });
            }
        }

        await openFileInEditor(targetRaw);
        return true;
    } catch (e) {
        console.warn('Could not read gfxEditTarget', e);
        return false;
    }
}

async function showDriveMenu() {
    const dos = getDos();
    if (!dos || !window.parent || !window.parent.CylonPopManager) return;

    const mounts = await dos.mounts();
    const gfxDrives = mounts.filter(m => {
        const src = (m.source || '').toLowerCase();
        const name = (m.name || '').toLowerCase();
        return src.endsWith('.gfx') || name.endsWith('.gfx') || name === 'desktop';
    });

    const items = [];
    if (gfxDrives.length === 0) {
        items.push({
            label: '(No .gfx drives mounted)',
            action: () => {
                if (window.parent && window.parent.printDOS) {
                    window.parent.printDOS('[.2]Mount a .gfx drive first, e.g.: mount cylon-desktop.gfx ram[.]\n');
                }
            }
        });
    } else {
        gfxDrives.forEach(m => {
            items.push({
                label: `${m.name} [${m.type}]`,
                action: () => selectDrive(m.name)
            });
        });
    }

    window.parent.CylonPopManager.showContextMenu('topleft', items);
}

function resolveItemName(code) {
    if (driveItemOverrides && Object.prototype.hasOwnProperty.call(driveItemOverrides, code)) {
        const custom = String(driveItemOverrides[code] || '').trim();
        if (custom) return custom;
    }
    return (typeof gfxItemID === 'function') ? gfxItemID(code) : 'Unknown';
}

async function preloadQpcTags() {
    qpcCache.clear();
    const dos = getDos();
    if (!dos || !window.activeDrive) return;

    const qDir = `${window.activeDrive}:/q`;
    try {
        if (!(await dos.exists(qDir))) return;
        const entries = await dos.dir(qDir);
        for (const entry of entries) {
            if (entry.type !== 'file') continue;
            const tagName = entry.name.substring(entry.name.lastIndexOf('/') + 1);
            if (!VALID_QPC_TAG_RE.test(tagName)) continue;

            const content = await dos.load(`${qDir}/${tagName}`);
            qpcCache.set(tagName, content || '');
        }
    } catch (e) {
        console.warn('Could not preload /q/ tags', e);
    }
}

async function selectDrive(driveName, opts) {
    if (!driveName) return;
    window.activeDrive = driveName;
    document.getElementById('active-drive-label').textContent = driveName + ':/';
    document.getElementById('new-tag-btn').disabled = false;
    toggleNewTagBar(false);

    expandedPaths.clear();
    expandedPaths.add(`${driveName}:/q`);
    expandedPaths.add(`${driveName}:/w`);

    const dos = getDos();
    driveIconDir = 'i/';
    driveTileDir = 't/';
    driveCharDir = 'c/';
    if (dos) {
        try {
            if (await dos.exists(`${driveName}:/a/gfxIconDir`)) {
                const v = (await dos.load(`${driveName}:/a/gfxIconDir`)).trim();
                if (v) driveIconDir = v;
            }
            if (await dos.exists(`${driveName}:/a/gfxTileDir`)) {
                const v = (await dos.load(`${driveName}:/a/gfxTileDir`)).trim();
                if (v) driveTileDir = v;
            }
            if (await dos.exists(`${driveName}:/a/gfxCharDir`)) {
                const v = (await dos.load(`${driveName}:/a/gfxCharDir`)).trim();
                if (v) driveCharDir = v;
            }
        } catch (e) {}
    }

    if (hostOrigin) {
        if (!driveIconDir.match(/^https?:\/\//i) && !driveIconDir.startsWith('data:')) {
            driveIconDir = hostOrigin + driveIconDir.replace(/^\/+/, '');
        }
        if (!driveTileDir.match(/^https?:\/\//i) && !driveTileDir.startsWith('data:')) {
            driveTileDir = hostOrigin + driveTileDir.replace(/^\/+/, '');
        }
        if (!driveCharDir.match(/^https?:\/\//i) && !driveCharDir.startsWith('data:')) {
            driveCharDir = hostOrigin + driveCharDir.replace(/^\/+/, '');
        }
    }
    if (!driveIconDir.endsWith('/')) driveIconDir += '/';
    if (!driveTileDir.endsWith('/')) driveTileDir += '/';
    if (!driveCharDir.endsWith('/')) driveCharDir += '/';

    driveItemOverrides = {};
    if (dos) {
        try {
            if (await dos.exists(`${driveName}:/a/gfxItemID`)) {
                const raw = await dos.load(`${driveName}:/a/gfxItemID`);
                if (raw && raw.trim()) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                        driveItemOverrides = parsed;
                    }
                }
            }
        } catch (e) {}
    }

    await preloadQpcTags();

    if (!(opts && opts.skipRender)) {
        showTreeView();
        await renderRootTree();
    }
}

async function refreshTree() {
    if (!window.activeDrive) {
        await showDriveMenu();
        return;
    }
    await preloadQpcTags();
    await renderRootTree();
}

function toggleNewTagBar(forceState) {
    const bar = document.getElementById('new-tag-bar');
    const errEl = document.getElementById('new-tag-error');
    const input = document.getElementById('new-tag-input');
    const show = typeof forceState === 'boolean' ? forceState : (bar.style.display !== 'flex');

    errEl.style.display = 'none';
    errEl.textContent = '';

    if (show && window.activeDrive) {
        bar.style.display = 'flex';
        input.value = '';
    } else {
        bar.style.display = 'none';
    }
}

async function createNewTag() {
    if (!window.activeDrive) return;
    const dos = getDos();
    if (!dos) return;

    const input = document.getElementById('new-tag-input');
    const errEl = document.getElementById('new-tag-error');
    const tagName = (input.value || '').trim();

    if (!VALID_QPC_TAG_RE.test(tagName)) {
        errEl.textContent = 'Invalid tag name: use 3+ lowercase letters or numerals (a-z, 0-9).';
        errEl.style.display = 'block';
        return;
    }

    const qDir = `${window.activeDrive}:/q`;
    const tagPath = `${qDir}/${tagName}`;

    try {
        if (!(await dos.exists(qDir))) {
            await dos.mkdir(qDir);
        }
        if (!(await dos.exists(tagPath))) {
            await dos.save(tagPath, '');
            qpcCache.set(tagName, '');
        }
        expandedPaths.add(qDir);
        toggleNewTagBar(false);
        await openFileInEditor(tagPath);
    } catch (err) {
        errEl.textContent = 'Error creating tag: ' + (err.message || err);
        errEl.style.display = 'block';
    }
}

function formatDate(ts) {
    if (!ts || ts.length !== 14) return ts || '--';
    return `${ts.substring(0,4)}-${ts.substring(4,6)}-${ts.substring(6,8)} ${ts.substring(8,10)}:${ts.substring(10,12)}`;
}

function isPathInQDir(fullPath) {
    const clean = fullPath.replace(/^[^:]+:\//, '');
    const parts = clean.split('/').filter(Boolean);
    return (parts.length === 2 && parts[0] === 'q');
}

function getFileVisualInfo(name, fullPath) {
    const clean = fullPath.replace(/^[^:]+:\//, '');
    const parts = clean.split('/').filter(Boolean);
    const inSector = (parts.length === 3 && parts[0] === 'w' && name !== 'm' && name.length >= 4);

    if (inSector) {
        const iconId = name.substring(0, 2);
        const zCode = name.substring(2, 4);
        const dataCode = name.length >= 6 ? name.substring(4, 6) : '';
        const itemLabel = resolveItemName(iconId);
        const displayLabel = `${name} — ${itemLabel} (Z:${zCode}${dataCode ? ', D:' + dataCode : ''})`;
        return { iconSrc: `${driveIconDir}${iconId}.png`, label: displayLabel, invalid: false };
    }

    if (parts.length === 2 && parts[0] === 'q') {
        if (!VALID_QPC_TAG_RE.test(name)) {
            return {
                iconSrc: `${driveIconDir}Tx.png`,
                label: `${name} (ignored: invalid QPC tag name)`,
                invalid: true
            };
        }
        return { iconSrc: `${driveIconDir}Tx.png`, label: `[${name}]`, invalid: false };
    }

    const lower = name.toLowerCase();
    let code = 'Fi';
    if (lower === 'm') code = 'Ga';
    else if (lower.endsWith('.htm') || lower.endsWith('.html')) code = 'Aa';
    else if (lower.endsWith('.js')) code = 'Lj';
    else if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.gif')) code = 'Im';
    else if (name.length === 1 || lower.endsWith('.txt') || lower.endsWith('.cfg')) code = 'Tx';

    return { iconSrc: `${driveIconDir}${code}.png`, label: name, invalid: false };
}

async function renderRootTree() {
    const rootEl = document.getElementById('fm-root');
    if (!window.activeDrive) {
        rootEl.innerHTML = '<div class="loading-text">Select a .gfx drive to browse...</div>';
        return;
    }

    rootEl.innerHTML = '';
    const drive = window.activeDrive;

    const rootDirs = [
        { name: 'a', label: '/a/ (Alpha Config)', path: `${drive}:/a` },
        { name: 'p', label: '/p/ (Players / Data)', path: `${drive}:/p` },
        { name: 'q', label: '/q/ (Qandy Punch Code)', path: `${drive}:/q` },
        { name: 'w', label: '/w/ (World Scripts & Sectors)', path: `${drive}:/w` }
    ];

    for (const dirInfo of rootDirs) {
        const node = await createDirNode(dirInfo.label, dirInfo.path, '');
        rootEl.appendChild(node);
    }
}

async function createDirNode(displayName, fullPath, modifiedStr) {
    const wrapper = document.createElement('div');
    wrapper.className = 'fm-item-wrapper';

    const row = document.createElement('div');
    row.className = 'fm-row';

    const colName = document.createElement('div');
    colName.className = 'fm-col-name';

    const toggleSpan = document.createElement('span');
    toggleSpan.className = 'fm-toggle';

    const img = document.createElement('img');
    img.src = `${driveIconDir}Au.png`;
    img.className = 'fm-icon';
    img.onerror = function() { this.style.visibility = 'hidden'; };

    const labelSpan = document.createElement('span');
    labelSpan.className = 'fm-dir-label';
    labelSpan.textContent = displayName;
    labelSpan.title = fullPath;

    colName.appendChild(toggleSpan);
    colName.appendChild(img);
    colName.appendChild(labelSpan);

    const colSize = document.createElement('div');
    colSize.className = 'fm-meta';
    colSize.textContent = '<DIR>';

    const colDate = document.createElement('div');
    colDate.className = 'fm-meta';
    colDate.textContent = modifiedStr || '--';

    row.appendChild(colName);
    row.appendChild(colSize);
    row.appendChild(colDate);
    wrapper.appendChild(row);

    const childrenContainer = document.createElement('div');
    childrenContainer.className = 'fm-children';
    wrapper.appendChild(childrenContainer);

    let loaded = false;

    async function setExpanded(expand) {
        if (expand) {
            expandedPaths.add(fullPath);
            wrapper.classList.add('expanded');
            toggleSpan.textContent = '[-]';
            if (!loaded) {
                loaded = true;
                childrenContainer.innerHTML = '<div class="loading-text">Loading...</div>';
                await populateDirectory(fullPath, childrenContainer);
            }
        } else {
            expandedPaths.delete(fullPath);
            wrapper.classList.remove('expanded');
            toggleSpan.textContent = '[+]';
        }
    }

    row.onclick = async (e) => {
        e.stopPropagation();
        await setExpanded(!expandedPaths.has(fullPath));
    };

    const isExpanded = expandedPaths.has(fullPath);
    toggleSpan.textContent = isExpanded ? '[-]' : '[+]';
    if (isExpanded) {
        await setExpanded(true);
    }

    return wrapper;
}

function createFileRow(name, fullPath, sizeStr, dateStr) {
    const row = document.createElement('div');
    row.className = 'fm-row';

    const visual = getFileVisualInfo(name, fullPath);

    const colName = document.createElement('div');
    colName.className = 'fm-col-name';

    const spacer = document.createElement('span');
    spacer.className = 'fm-toggle';
    spacer.textContent = '   ';

    const img = document.createElement('img');
    img.src = visual.iconSrc;
    img.className = 'fm-icon';
    img.onerror = function() {
        this.onerror = null;
        this.src = `${driveIconDir}Tx.png`;
    };

    const labelSpan = document.createElement('span');
    labelSpan.className = visual.invalid ? 'fm-label fm-label-invalid' : 'fm-label';
    labelSpan.textContent = visual.label;
    labelSpan.title = fullPath;

    colName.appendChild(spacer);
    colName.appendChild(img);
    colName.appendChild(labelSpan);

    const colSize = document.createElement('div');
    colSize.className = 'fm-meta';
    colSize.textContent = sizeStr;

async function populateDirectory(dirPath, container) {
    const dos = getDos();
    if (!dos) return;

    try {
        if (!(await dos.exists(dirPath))) {
            container.innerHTML = '<div class="loading-text">(empty)</div>';
            return;
        }

        const entries = await dos.dir(dirPath);
        container.innerHTML = '';

        const dirs = entries
            .filter(e => e.type === 'directory')
            .sort((a, b) => a.name.localeCompare(b.name));

        const files = entries
            .filter(e => e.type === 'file' && !e.name.endsWith('_dir.sys!'))
            .sort((a, b) => a.name.localeCompare(b.name));

        if (dirs.length === 0 && files.length === 0) {
            container.innerHTML = '<div class="loading-text">(empty)</div>';
            return;
        }

        for (const f of files) {
            const fileName = f.name.substring(f.name.lastIndexOf('/') + 1);
            const fullPath = dirPath + (dirPath.endsWith('/') ? '' : '/') + fileName;
            container.appendChild(createFileRow(fileName, fullPath, dos.formatSize(f.size), formatDate(f.timestamp)));
        }

        for (const d of dirs) {
            const cleanName = d.name.replace(/[<>]/g, '');
            const folderName = cleanName.substring(cleanName.lastIndexOf('/') + 1);
            const fullPath = dirPath + (dirPath.endsWith('/') ? '' : '/') + folderName;
            container.appendChild(await createDirNode(folderName + '/', fullPath, formatDate(d.timestamp)));
        }
    } catch (err) {
        container.innerHTML = `<div class="loading-text" style="color:var(--text-fg3, #f44);">Error reading ${dirPath}</div>`;
    }
}

function formatTargetHeadline(targetPath) {
    const clean = targetPath.replace(/^[^:]+:\//, '');
    const parts = clean.split('/').filter(Boolean);

    if (parts.length === 3 && parts[0] === 'w') {
        const sector = parts[1];
        const filename = parts[2];
        if (filename !== 'm' && filename.length >= 4) {
            const iconId = filename.substring(0, 2);
            const zCode = filename.substring(2, 4);
            const itemLabel = resolveItemName(iconId);
            return `Sector ${sector} ${zCode} "${itemLabel}" (${filename})`;
        }
    }
    if (parts.length === 2 && parts[0] === 'q') {
        return `QPC Tag [${parts[1]}] (${targetPath})`;
    }
    return targetPath;
}

async function openRemoteTargetInEditor(target) {
    await preloadQpcTags();

    remoteTarget = target;
    currentTargetPath = target.path || (`${target.sector}/${target.filename}`);
    document.getElementById('target-file').textContent =
        formatTargetHeadline(currentTargetPath) + ' [REMOTE]';

    const noticeEl = document.getElementById('editor-notice');
    noticeEl.textContent = `Remote target on ${target.remoteDrive} (${target.sector}/${target.filename})`;
    noticeEl.style.display = 'block';

    let content = (target.code != null) ? String(target.code) : '';
    content = content.replace(/\\n/g, '\n');

    originalCode = content;
    document.getElementById('punchcodeInput').value = content;
    document.getElementById('save-btn').disabled = true;

    document.getElementById('tree-view').style.display = 'none';
    document.getElementById('editor-view').style.display = 'flex';

    decompilepunchcode(content);
}

async function openFileInEditor(targetPath) {
    remoteTarget = null;
    const dos = getDos();
    if (!dos) return;

    await preloadQpcTags();

    currentTargetPath = targetPath;
    document.getElementById('target-file').textContent = formatTargetHeadline(targetPath);

    const noticeEl = document.getElementById('editor-notice');
    if (isPathInQDir(targetPath)) {
        const tagName = targetPath.substring(targetPath.lastIndexOf('/') + 1);
        if (!VALID_QPC_TAG_RE.test(tagName)) {
            noticeEl.textContent = `Security Warning: "${tagName}" is invalid for QPC (must be 3+ lowercase a-z or 0-9). UNIVAC will not load this file.`;
            noticeEl.style.display = 'block';
        } else {
            noticeEl.style.display = 'none';
        }
    } else {
        noticeEl.style.display = 'none';
    }

    let content = '';
    try {
        const loaded = await dos.load(targetPath);
        if (loaded !== null) content = loaded;
    } catch (e) {
        content = '';
    }

    content = content.replace(/\\n/g, '\n');

    originalCode = content;
    document.getElementById('punchcodeInput').value = content;
    document.getElementById('save-btn').disabled = true;

    document.getElementById('tree-view').style.display = 'none';
    document.getElementById('editor-view').style.display = 'flex';

    decompilepunchcode(content);
}

async function saveLogic() {
    if (!currentTargetPath) return;
    const dos = getDos();
    const currentCode = document.getElementById('punchcodeInput').value;

    if (remoteTarget) {
        try {
            const targetRef = (remoteTarget.sector && remoteTarget.filename)
                ? `${remoteTarget.sector}/${remoteTarget.filename}`
                : remoteTarget.itemId;
            const codeArg = (currentCode === '') ? 'null' : currentCode;
            let driveParam = remoteTarget.remoteDrive || '';
            if (driveParam && !driveParam.endsWith('.gfx')) driveParam += '.gfx';

            const formData = new URLSearchParams();
            formData.append('c', `GFX:code ${targetRef} ${codeArg}`);
            formData.append('d', driveParam);
            if (remoteTarget.session) formData.append('s', remoteTarget.session);

            const res = await fetch(remoteTarget.remoteUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const json = await res.json();
            if (!json.ok) throw new Error(json.output || 'Remote save failed');

            if (dos && remoteTarget.path) {
                try { await dos.save(remoteTarget.path, currentCode); } catch (e) {}
            }

            originalCode = currentCode;
            document.getElementById('save-btn').disabled = true;

            if (window.popHtm) {
                window.popHtm(
                    `<div style="padding:12px 18px; background:var(--menu-bg,#111); border:1px solid var(--fg-color,#0f0); color:var(--fg-color,#0f0); text-align:center;"><b>Saved to Server!</b></div>`,
                    'center'
                );
                setTimeout(() => { if (window.hpop) window.hpop(); }, 900);
            }
        } catch (err) {
            const msg = err && err.message ? err.message : String(err);
            if (window.parent && window.parent.printDOS) {
                window.parent.printDOS(`Error saving remote ${currentTargetPath}: [.4]${msg}[.]\n`);
            }
            const noticeEl = document.getElementById('editor-notice');
            noticeEl.textContent = msg.replace(/\[\.[0-9]?\]/g, '');
            noticeEl.style.display = 'block';
        }
        return;
    }

    if (!dos) return;

    try {
        await dos.save(currentTargetPath, currentCode);
        originalCode = currentCode;
        document.getElementById('save-btn').disabled = true;

        if (isPathInQDir(currentTargetPath)) {
            const tagName = currentTargetPath.substring(currentTargetPath.lastIndexOf('/') + 1);
            if (VALID_QPC_TAG_RE.test(tagName)) {
                qpcCache.set(tagName, currentCode);
            }
        }

        if (window.popHtm) {
            window.popHtm(
                `<div style="padding:12px 18px; background:var(--menu-bg,#111); border:1px solid var(--fg-color,#0f0); color:var(--fg-color,#0f0); text-align:center;"><b>Saved!</b></div>`,
                'center'
            );
            setTimeout(() => { if (window.hpop) window.hpop(); }, 900);
        }
    } catch (err) {
        if (window.parent && window.parent.printDOS) {
            window.parent.printDOS(`Error saving ${currentTargetPath}: [.4]${err.message || err}[.]\n`);
        }
    }
}

// ============================================================================
// MINI-VAC SEQUENTIAL DECOMPILER ENGINE (with [tag] QPC Macro Resolution)
// ============================================================================

function getCodeDescription(code) {
    if (code === "Za") return "nothing (null)";
    const itemText = resolveItemName(code);
    if (itemText !== "Item " + code && itemText !== "Unknown") return itemText;
    return `code "${code}"`;
}

function resolveNotBranch(desc, isNot) {
    if (!desc) return desc;
    const hasBranch = /\[[^\[\]\/]+\/[^\[\]\/]+\]/.test(desc);
    const resolved = desc.replace(/\[([^\[\]\/]+)\/([^\[\]\/]+)\]/g, (_, normalText, notText) => {
        return isNot ? notText : normalText;
    });
    return (isNot && !hasBranch) ? ("If Not: " + resolved) : resolved;
}

function decompilepunchcode(initialCode) {
    const container = document.getElementById('decompiler-view');
    container.innerHTML = "";
    if (!initialCode) return;

    const editingQpc = currentTargetPath ? isPathInQDir(currentTargetPath) : false;

    function bindHover(element, desc, startIdx, endIdx) {
        element.style.cursor = "pointer";
        element.addEventListener('mousemove', (e) => {
            e.stopPropagation();
            const ta = document.getElementById('punchcodeInput');
            if (document.activeElement === ta && startIdx != null && endIdx != null) {
                ta.setSelectionRange(startIdx, endIdx);
            }
            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            tooltip.innerText = desc;
            tooltip.style.left = Math.min(window.innerWidth - 180, e.clientX + 14) + 'px';
            tooltip.style.top = Math.min(window.innerHeight - 40, e.clientY + 14) + 'px';
        });
        element.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });
    }

    function renderSequence(srcString, targetEl, opts) {
        const allowTags = !!(opts && opts.allowTags);
        const mapIndices = !(opts && opts.fixedRange);
        const fixedStart = opts && opts.fixedRange ? opts.fixedRange[0] : null;
        const fixedEnd = opts && opts.fixedRange ? opts.fixedRange[1] : null;

        let col = 0;
        let ifnot = false;
        let ifnotStartIdx = null;

        function spanStart(idx) { return mapIndices ? idx : fixedStart; }
        function spanEnd(idx)   { return mapIndices ? idx : fixedEnd; }

        function appendSpace() {
            const spacer = document.createElement('div');
            spacer.className = 'punchcode-space';
            targetEl.appendChild(spacer);
        }

        function appendLineBreak() {
            const br = document.createElement('div');
            br.style.flexBasis = '100%';
            br.style.height = '0';
            targetEl.appendChild(br);
        }

        function consumeLayoutBetweenTokens() {
            while (col < srcString.length) {
                const ch = srcString.charAt(col);
                if (ch === ' ' || ch === '\t') {
                    appendSpace();
                    col++;
                } else if (ch === '\n' || ch === '\r') {
                    appendLineBreak();
                    if (ch === '\r' && srcString.charAt(col + 1) === '\n') col++;
                    col++;
                } else {
                    break;
                }
            }
        }

        function renderHalfText(textVal, startIdx, endIdx, desc, extraClass, mountEl) {
            const wrap = document.createElement('div');
            wrap.className = 'punchcode-half-group';
            for (let i = 0; i < textVal.length; i++) {
                const ch = textVal.charAt(i);
                const cell = document.createElement('div');
                cell.className = 'punchcode-half' +
                    (ch === ' ' ? ' is-space' : '') +
                    (extraClass ? (' ' + extraClass) : '');
                cell.textContent = (ch === ' ') ? '\u00A0' : ch;
                const s = mapIndices ? (startIdx + i) : fixedStart;
                const e = mapIndices ? (startIdx + i + 1) : fixedEnd;
                bindHover(cell, desc, s, e);
                wrap.appendChild(cell);
            }
            (mountEl || targetEl).appendChild(wrap);
            return wrap;
        }

        function renderSpriteBox(code, imgDir, desc, startIdx, endIdx, isNot) {
            const box = document.createElement('div');
            box.className = 'punchcode-img';
            box.style.backgroundImage = `url('${driveTileDir}Za.png')`;

            const img = document.createElement('img');
            const normalSrc = `${imgDir}${code}.png`;
            if (isNot) {
                img.src = `${imgDir}Xn${code}.png`;
                img.onerror = function() {
                    if (this.dataset.fellBack) {
                        this.style.opacity = '0.25';
                        return;
                    }
                    this.dataset.fellBack = '1';
                    this.src = normalSrc;
                    box.classList.add('punchcode-not-fallback');
                };
            } else {
                img.src = normalSrc;
                img.onerror = function() { this.style.opacity = '0.25'; };
            }

            box.appendChild(img);
            bindHover(box, desc, startIdx, endIdx);
            targetEl.appendChild(box);
            return box;
        }

        // Read next 2-char token (for opcode operands) without crossing '--', '^S', or '['
        function readOperand2() {
            consumeLayoutBetweenTokens();
            if (col >= srcString.length) return null;
            if (srcString.startsWith('--', col) || srcString.startsWith('^S', col) || srcString.charAt(col) === '[') {
                return null;
            }
            const start = col;
            const len = Math.min(2, srcString.length - col);
            const tok = srcString.substring(col, col + len);
            col += len;
            return { tok, start, end: col };
        }

        function renderOperand(op, kind) {
            if (!op) return;
            const { tok, start, end } = op;

            if (tok.length < 2) {
                renderHalfText(tok, start, end, `Incomplete operand "${tok}"`, 'is-unterminated');
                return;
            }
            if (tok === '%%' || tok === '$$' || tok === '##') {
                const param = readOperand2();
                if (!param) {
                    renderHalfText(tok, start, end, 'Parameter Marker', '');
                    return;
                }
                if (tok === '##') {
                    renderHalfText(param.tok, start, param.end, `Number: ${param.tok}`, '');
                } else if (kind === 'tile') {
                    renderSpriteBox(param.tok, driveTileDir, `Tile: ${param.tok}`, spanStart(start), spanEnd(param.end), false);
                } else {
                    renderSpriteBox(param.tok, driveIconDir, (tok === '%%' ? 'Param: ' : 'Item: ') + getCodeDescription(param.tok), spanStart(start), spanEnd(param.end), false);
                }
                return;
            }

            const s = spanStart(start);
            const e = spanEnd(end);

            if (kind === 'tile') {
                renderSpriteBox(tok, driveTileDir, `Tile: ${tok}`, s, e, false);
                return;
            }

            if (kind === 'sector') {
                if (tok.charAt(0) === 'W') {
                    renderSpriteBox(tok, driveIconDir, `Register: ${getCodeDescription(tok)}`, s, e, false);
                } else {
                    renderHalfText(tok, start, end, `Sector: ${tok}`, '');
                }
                return;
            }

            if (kind === 'z') {
                if (tok.charAt(0) === 'W') {
                    renderSpriteBox(tok, driveIconDir, `Register: ${getCodeDescription(tok)}`, s, e, false);
                } else {
                    renderHalfText(tok, start, end, `Z-Location: ${tok}`, '');
                }
                return;
            }

            if (kind === 'zOrItem') {
                if (tok.charAt(0) === 'W') {
                    renderSpriteBox(tok, driveIconDir, `Register: ${getCodeDescription(tok)}`, s, e, false);
                } else if (/^\d{2}$/.test(tok)) {
                    renderHalfText(tok, start, end, `Z-Location: ${tok}`, '');
                } else {
                    const known = resolveItemName(tok);
                    if (known !== 'Unknown' && known !== 'Item ' + tok) {
                        renderSpriteBox(tok, driveIconDir, `Target Item: ${known}`, s, e, false);
                    } else {
                        renderHalfText(tok, start, end, `Z-Location: ${tok}`, '');
                    }
                }
                return;
            }

            // Default: 'value' / 'item' / 'reg'
            if (/^\d{2}$/.test(tok) || /^\d/.test(tok)) {
                renderHalfText(tok, start, end, `Number: ${tok}`, '');
                return;
            }

            if (kind === 'opt' && resolveItemName(tok) === 'Unknown') {
                renderHalfText(tok, start, end, `Option: ${tok}`, '');
                return;
            }

            renderSpriteBox(tok, driveIconDir, getCodeDescription(tok), s, e, false);
        }

        // Read '--'-terminated raw text in half-width boxes (Vh, Vb)
        function readTextUntilDash() {
            const strStart = col;
            const termIdx = srcString.indexOf('--', strStart);
            const strEnd = (termIdx !== -1) ? termIdx : srcString.length;
            const textVal = srcString.substring(strStart, strEnd);

            if (textVal.length > 0) {
                renderHalfText(textVal, strStart, strEnd, `Text: "${textVal}"`, '');
            }

            if (termIdx !== -1) {
                renderHalfText('--', termIdx, termIdx + 2, `End text: "${textVal}"`, 'is-end');
                col = termIdx + 2;
            } else {
                renderHalfText('?', strEnd, strEnd, 'Missing "--" terminator', 'is-unterminated');
                col = strEnd;
            }
        }

        while (col < srcString.length) {
            const ch = srcString.charAt(col);

            if (ch === ' ' || ch === '\t') {
                appendSpace();
                col++;
                continue;
            }
            if (ch === '\n' || ch === '\r') {
                appendLineBreak();
                if (ch === '\r' && srcString.charAt(col + 1) === '\n') col++;
                col++;
                continue;
            }

            // QPC [tag] Macro Expansion
            if (ch === '[') {
                const closeIdx = srcString.indexOf(']', col + 1);
                if (closeIdx !== -1) {
                    const tagStart = col;
                    const tagName = srcString.substring(col + 1, closeIdx);
                    const tagEnd = closeIdx + 1;
                    col = tagEnd;

                    if (!VALID_QPC_TAG_RE.test(tagName)) {
                        const badBadge = document.createElement('div');
                        badBadge.className = 'punchcode-tag-badge punchcode-tag-invalid';
                        badBadge.textContent = `[${tagName}]`;
                        bindHover(badBadge, `Invalid QPC tag "[${tagName}]" (must be 3+ lowercase a-z / 0-9)`, spanStart(tagStart), spanEnd(tagEnd));
                        targetEl.appendChild(badBadge);
                        ifnot = false;
                        continue;
                    }

                    if (!allowTags) {
                        const nestedBadge = document.createElement('div');
                        nestedBadge.className = 'punchcode-tag-badge punchcode-tag-missing';
                        nestedBadge.textContent = `[${tagName}]`;
                        bindHover(nestedBadge, `Nested tag "[${tagName}]" (UNIVAC expands tags single-pass only)`, spanStart(tagStart), spanEnd(tagEnd));
                        targetEl.appendChild(nestedBadge);
                        ifnot = false;
                        continue;
                    }

                    if (!qpcCache.has(tagName)) {
                        const missBadge = document.createElement('div');
                        missBadge.className = 'punchcode-tag-badge punchcode-tag-missing';
                        missBadge.textContent = `[${tagName}]`;
                        bindHover(missBadge, `Missing QPC tag: /q/${tagName} not found`, spanStart(tagStart), spanEnd(tagEnd));
                        targetEl.appendChild(missBadge);
                        ifnot = false;
                        continue;
                    }

                    const macroCode = qpcCache.get(tagName) || '';
                    const macroGroup = document.createElement('div');
                    macroGroup.className = 'punchcode-macro';

                    const badge = document.createElement('div');
                    badge.className = 'punchcode-tag-badge';
                    badge.textContent = `[${tagName}]`;
                    bindHover(badge, `QPC Macro /q/${tagName}: ${macroCode || '(empty)'}`, spanStart(tagStart), spanEnd(tagEnd));
                    macroGroup.appendChild(badge);

                    renderSequence(macroCode, macroGroup, {
                        allowTags: false,
                        fixedRange: [spanStart(tagStart), spanEnd(tagEnd)]
                    });

                    targetEl.appendChild(macroGroup);
                    ifnot = false;
                    continue;
                }
            }

            // Read 2-char opcode word
            const wordStart = col;
            const wordLen = Math.min(2, srcString.length - col);
            const word = srcString.substring(col, col + wordLen);
            col += wordLen;

            if (wordLen < 2) {
                renderHalfText(word, wordStart, col, `Incomplete code "${word}"`, 'is-unterminated');
                ifnot = false;
                continue;
            }

            // Literal template markers (%%, $$, ##)
            if (word === '%%' || word === '$$' || word === '##') {
                const param = readOperand2();
                if (!param) {
                    renderHalfText(word, wordStart, col, 'Parameter Marker', '');
                } else if (word === '##') {
                    renderHalfText(param.tok, wordStart, param.end, `Number: ${param.tok}`, '');
                } else {
                    renderSpriteBox(param.tok, driveIconDir, (word === '%%' ? 'Param: ' : 'Item: ') + getCodeDescription(param.tok), spanStart(wordStart), spanEnd(param.end), false);
                }
                ifnot = false;
                continue;
            }

            // Pure 2-digit numeral outside an opcode operand
            if (/^\d{2}$/.test(word)) {
                renderHalfText(word, wordStart, col, `Number: ${word}`, '');
                ifnot = false;
                continue;
            }

            // Prefix NOT gate: sets ifnot for the next opcode
            if (word === 'Xn') {
                ifnot = true;
                ifnotStartIdx = wordStart;
                continue;
            }

            const opStart = (ifnot && ifnotStartIdx != null) ? ifnotStartIdx : wordStart;
            const opEnd = col;
            const rawDesc = getCodeDescription(word);
            const opDesc = resolveNotBranch(rawDesc, ifnot);

            switch (word) {
                case 'Xc':
                    renderSpriteBox('Xc', driveIconDir, rawDesc, spanStart(wordStart), spanEnd(opEnd), false);
                    ifnot = false;
                    break;

                case 'Xx':
                case 'Xg':
                case 'Vc':
                case 'Vg':
                case 'Vi':
                case 'Vl':
                case 'Vn':
                case 'Vs':
                case 'Ve':
                case 'Vw':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    break;

                // 1-operand opcodes
                case 'Xi':
                case 'Vd':
                case 'Vm':
                case 'Vr':
                case 'Vu':
                case 'Vp':
                case 'Vx':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'item');
                    break;

                case 'Vy':
                case 'Vz':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'z');
                    break;

                case 'Xh':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'opt');
                    break;

                // 2-operand opcodes
                case 'Xs':
                case 'Xd':
                case 'Xm':
                case 'Xl':
                case 'Xe':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'value');
                    renderOperand(readOperand2(), 'value');
                    break;

                case 'Xr':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'item');
                    renderOperand(readOperand2(), 'item');
                    break;

                // Teleport: Vt <sector> <zOrItem>
                case 'Vt':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'sector');
                    renderOperand(readOperand2(), 'zOrItem');
                    break;

                // Tag: Xt <4-char playerId>
                case 'Xt': {
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    const p1 = readOperand2();
                    const p2 = readOperand2();
                    if (p1 && p2) {
                        const pid = p1.tok + p2.tok;
                        renderHalfText(pid, p1.start, p2.end, `Player ID: ${pid}`, '');
                    } else if (p1) {
                        renderHalfText(p1.tok, p1.start, p1.end, `Incomplete Player ID: ${p1.tok}`, 'is-unterminated');
                    }
                    break;
                }

                // Modify tile: Xz <sector> <z> <tile>
                case 'Xz':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'sector');
                    renderOperand(readOperand2(), 'z');
                    renderOperand(readOperand2(), 'tile');
                    break;

                // Text string until '--'
                case 'Vh':
                case 'Vb':
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    readTextUntilDash();
                    break;

                // Avatar string until '--'
                case 'Va': {
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    const termIdx = srcString.indexOf('--', col);
                    const limit = (termIdx !== -1) ? termIdx : srcString.length;
                    while (col < limit) {
                        consumeLayoutBetweenTokens();
                        if (col >= limit) break;
                        const pStart = col;
                        const partLen = Math.min(2, limit - col);
                        const part = srcString.substring(col, col + partLen);
                        col += partLen;
                        if (partLen < 2) {
                            renderHalfText(part, pStart, col, `Incomplete avatar part "${part}"`, 'is-unterminated');
                        } else {
                            const box = document.createElement('div');
                            box.className = 'punchcode-img';
                            box.style.backgroundImage = `url('${driveTileDir}Za.png')`;
                            const aImg = document.createElement('img');
                            aImg.src = `${driveCharDir}${part}.png`;
                            aImg.onerror = function() {
                                box.replaceWith(renderHalfText(part, pStart, pStart + 2, `Avatar Part: ${part}`, ''));
                            };
                            box.appendChild(aImg);
                            bindHover(box, `Avatar Part: ${part}`, spanStart(pStart), spanEnd(col));
                            targetEl.appendChild(box);
                        }
                    }
                    if (termIdx !== -1) {
                        renderHalfText('--', termIdx, termIdx + 2, 'End avatar string', 'is-end');
                        col = termIdx + 2;
                    } else {
                        renderHalfText('?', col, col, 'Missing "--" terminator', 'is-unterminated');
                    }
                    break;
                }

                // Claim player item + inventory until '--'
                case 'Xa': {
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    renderOperand(readOperand2(), 'item');
                    const termIdx = srcString.indexOf('--', col);
                    const limit = (termIdx !== -1) ? termIdx : srcString.length;
                    while (col < limit) {
                        consumeLayoutBetweenTokens();
                        if (col >= limit) break;
                        const iStart = col;
                        const iLen = Math.min(2, limit - col);
                        const tok = srcString.substring(col, col + iLen);
                        col += iLen;
                        if (iLen < 2) {
                            renderHalfText(tok, iStart, col, `Incomplete inventory item "${tok}"`, 'is-unterminated');
                        } else if (/^\d{2}$/.test(tok) || /^\d/.test(tok)) {
                            renderHalfText(tok, iStart, col, `Number: ${tok}`, '');
                        } else {
                            renderSpriteBox(tok, driveIconDir, getCodeDescription(tok), spanStart(iStart), spanEnd(col), false);
                        }
                    }
                    if (termIdx !== -1) {
                        renderHalfText('--', termIdx, termIdx + 2, 'End inventory list', 'is-end');
                        col = termIdx + 2;
                    } else {
                        renderHalfText('?', col, col, 'Missing "--" terminator', 'is-unterminated');
                    }
                    break;
                }

                // Server plug wrapper: S^ ... ^S
                case 'S^': {
                    const endIdx = srcString.indexOf('^S', col);
                    const innerEnd = (endIdx !== -1) ? endIdx : srcString.length;
                    const inner = srcString.substring(col, innerEnd);

                    const plugWrap = document.createElement('div');
                    plugWrap.className = 'punchcode-plug';
                    renderHalfText('S^', wordStart, opEnd, 'Server Plug Start', 'is-end', plugWrap);

                    if (inner.length > 0) {
                        renderSequence(inner, plugWrap, {
                            allowTags: false,
                            fixedRange: [spanStart(col), spanEnd(innerEnd)]
                        });
                    }

                    if (endIdx !== -1) {
                        renderHalfText('^S', endIdx, endIdx + 2, 'Server Plug End', 'is-end', plugWrap);
                        col = endIdx + 2;
                    } else {
                        renderHalfText('?', innerEnd, innerEnd, 'Missing "^S" terminator', 'is-unterminated', plugWrap);
                        col = innerEnd;
                    }

                    targetEl.appendChild(plugWrap);
                    ifnot = false;
                    break;
                }

                default: {
                    renderSpriteBox(word, driveIconDir, opDesc, spanStart(opStart), spanEnd(opEnd), ifnot);
                    ifnot = false;
                    break;
                }
            }
        }

        // Dangling Xn at the very end while user is still typing
        if (ifnot && ifnotStartIdx != null) {
            renderSpriteBox('Xn', driveIconDir, 'NOT (waiting for next code)', spanStart(ifnotStartIdx), spanEnd(ifnotStartIdx + 2), false);
        }
    }

    renderSequence(initialCode, container, { allowTags: !editingQpc });
}
</script>
</body>
</html>
