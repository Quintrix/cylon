<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PUNCH CODE COMPILER</title>
<script src="cylon-sdk.js"></script>
<style>
body { background: #222; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#toolbar { background: #333; padding: 10px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #444; }
#main { display: flex; flex: 1; overflow: hidden; }
#viewport { padding: 20px; background: #111; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #444; flex-shrink: 0; position: relative; }
canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: crosshair; border: 2px solid #444; touch-action: none; }

    #panel { flex: 1; background: #222; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
    .stack-header { font-weight: bold; color: #0af; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    
    .tool-box { background: #2c3e50; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #34495e; }
    .tool-box label { font-size: 0.7em; color: #95a5a6; display: block; margin-bottom: 5px; }
    
    input[type="text"], select { background: #111; color: #fff; border: 1px solid #555; padding: 4px; text-align: center; font-family: monospace; font-weight: bold;}
    
    #tileBrushRow { display: flex; align-items: center; gap: 10px; }
    #brushPreview { width: 32px; height: 32px; border: 1px solid #0af; background: #000; }

    .object-entry { background: #333; padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; border: 1px solid #444; font-family: monospace; font-size: 0.85em; }
    .object-entry:hover { border-color: #0af; }
    .object-entry b { color: #f1c40f; }

    textarea { width: 100%; height: 60px; background: #111; color: #2ecc71; border: 1px solid #555; padding: 10px; font-family: monospace; font-size: 1em; resize: none; box-sizing: border-box; }
    
    button { padding: 6px 12px; cursor: pointer; background: #068; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 0.75em; }
    button:hover { background: #07a; }
    button.reject { background: #7f8c8d; }
    button.remove { background: #c0392b; }
    
    #decompiler {
      background: #000; padding: 8px; font-family: monospace; color: #ddd;
      font-size: 0.8em; margin-top: 5px; border: 1px solid #333; min-height: 20px; }

    .punchcodeImages img, 
    .punchcode-text {
        width: 32px;
        height: 32px;
        vertical-align: middle;
        margin: 1px;
    }

    .punchcode-space {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: transparent;
        color: #CCFFFF;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        box-sizing: border-box;    
        overflow: hidden;
    }        

    .punchcode-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #006600;
        color: #FFFFFF;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        border-radius: 4px;
        box-sizing: border-box;    
        overflow: hidden;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .punchcode-num {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        margin: 1px;
        flex-shrink: 0;
        position: relative;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .punchcode-img {
        width: 32px;
        height: 32px;
        display: inline-block;
        vertical-align: middle;
        margin: 1px;
        flex-shrink: 0;
        position: relative;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }
    
    .punchcode-img img {
        width: 32px;
        height: 32px;
        display: block;
    }

    #tooltip { 
        position: absolute; 
        background: rgba(240, 230, 140, 0.9);
        color: #000; 
        padding: 6px 10px;
        font-size: 16px;
        font-weight: bold;
        pointer-events: none; 
        border: 1px solid #444; 
        display: none;
        width: 100%; 
        z-index: 100; 
        font-family: monospace; 
        border-radius: 4px;
    }
    </style>
<script src="gfx-itemid.js"></script>
</head>
<body>
<div id="main">
<div id="viewport">
<!-- Canvas dynamically scales based on mounted drive settings -->
<canvas id="sectorCanvas" width="448" height="320"></canvas>
<div id="tooltip">Z:00</div>
    <div class="tool-box" id="brushBox">
        <div id="tileBrushRow">
            <input type="text" id="tileInput" size=2 maxlength="2" value="Ga" oninput="updateBrushPreview()">
            <div id="brushPreview"></div>
        </div>
    </div>
</div>

<div id="panel">

    <div class="tool-box" id="toolbar">
      <div style="font-weight: bold; color: #0af;"> &nbsp; COMPILER:</div>
      <select id="driveSelect" onfocus="populateDrives()"><option value="">(No Drive)</option></select>
      <button onclick="loadFromDrive()" style="background:#27ae60;">LOAD</button>
      <button onclick="saveToDrive()" style="background:#8e44ad;">SAVE</button>
      <button onclick="importLegacyGfx()" style="background:#444;">IMPORT LEGACY</button>
      
      <div style="width: 20px;"></div>
      <select id="sectorNav" onchange="changeSector()"></select>
      <button id="cityToggleBtn" onclick="toggleCity()">ENTER CITY</button>
    </div>
    
    <div id="stackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af;">OBJECT STACK: <span id="sectorLabel">A1</span>
          <input type="text" id="newID" size=2 maxlength="2" placeholder="ID">
          <input type="text" id="newZ" size=2 maxlength="2" placeholder="Z">
          <input type="text" id="newDATA" size=2 maxlength="2" value="00">
          <button onclick="addObject()">+ ADD</button>
          <button onclick="editObject()">EDIT</button> 
          <div id="listItems"></div>
        </div>
       </div>                
    </div>

    <div id="globalStackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af; margin-bottom: 10px;">GLOBAL STACK:</div>
        <div id="global-a"><div class="object-entry" onclick="openGlobalEditor('a')">[<b>a</b>] Alpha (Boot Script) <span id="global-lbl-a" style="color: #888;"></span></div></div>
        <div id="global-b"><div class="object-entry" onclick="openGlobalEditor('b')">[<b>b</b>] Before (Pre-Tick) <span id="global-lbl-b" style="color: #888;"></span></div></div>
        <div id="global-c"><div class="object-entry" onclick="openGlobalEditor('c')">[<b>c</b>] After (Post-Tick) <span id="global-lbl-c" style="color: #888;"></span></div></div>
        <div id="global-f"><div class="object-entry" onclick="openGlobalEditor('f')">[<b>f</b>] Fire (Item Zj) <span id="global-lbl-f" style="color: #888;"></span></div></div>
        <div id="global-t"><div class="object-entry" onclick="openGlobalEditor('t')">[<b>t</b>] Tag (PVP) <span id="global-lbl-t" style="color: #888;"></span></div></div>
      </div>
    </div>

    <div id="qpcStackView">
      <div class="tool-box" style="background: #1a252f;">
        <div style="font-weight: bold; color: #0af; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            QPC SCRIPTS:
            <div>
                <button style="background: #0af;" onclick="importQpcLegacy()">IMPORT .QPC</button>
                <button style="background: #0af;" onclick="exportQpcLegacy()">EXPORT .QPC</button>
            </div>
        </div>
        <div style="margin-bottom: 10px; display: flex; gap: 5px;">
            <input type="text" id="newQpcName" placeholder="tape name" style="flex: 2; ">
            <button style="background: #0af;" onclick="addQpc()">+ ADD TAPE</button>
        </div>
        <div id="qpcListItems"></div>
      </div>
    </div>
    
    <div class="tool-box" id="logicBox" style="display: none;">
    <div class="stack-header">
        <div><span id="logicLabel">LOGIC</span>: <span id="editingObjID"></span>
            <button onclick="LightMode()">Light</button>
            <button onclick="DarkMode()">Dark</button>
            &nbsp;
            <button onclick="setPunchcodeBg('Ga')">Grass</button>
            <button onclick="setPunchcodeBg('Ib')">Dungeon</button>
            <button onclick="setPunchcodeBg('Ca')">Dirt</button>
            <button onclick="setPunchcodeBg('Ua')">Water</button>
            <input type="text" id="bgInput" size="2" maxlength="2" value="Ca" oninput="setCustomPunchcodeBg()">
        </div>
    </div>

    <div id="pcinput"><textarea id="punchcodeInput" oninput="updateDecompiler()"></textarea></div>
    <div id="punchcodeImages" class="punchcodeImages"></div>
    
    <div id="decompiler"></div>
        <div class="btn-row" style="display:flex; gap:5px; margin-top:10px;">
            <button class="reject" onclick="rejectLogic()">CLEAR</button>
            <button class="remove" onclick="removeObject()">DELETE</button>
        </div>
    </div>
    
</div>
</div>
<script>
// --- STATE ---
let currentSector = "Aa";
let mapSectors = {};
let editingIndex = -1;
let editingGlobalKey = null;
let globalLogic = { a: "", b: "", c: "", f: "", t: "" };
let punchcodeTextColor = "#FFFFFF";

// QPC Script Macros State
let qpcData = {};
let editingQpcKey = null;

// Map Bounds State
let mapBounds = { maxX: 7, maxY: 7 }; // default Hh
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LOWER = "abcdefghijklmnopqrstuvwxyz";
const CITY_SYMBOLS = "0123456789%()+,-:;=@[]^_{}";

// Mutable Tile Dimensions
let COLS = 14;
let ROWS = 10;
let TOTAL_TILES = COLS * ROWS; 

const tileCache = {}, itemCache = {};
const canvas = document.getElementById('sectorCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const punchcodeItemImageCache = {};
const nav = document.getElementById('sectorNav');

function getMapBounds() {
    return mapBounds;
}

// Helper: Synchronize canvas layout
function updateCanvasDimensions() {
    TOTAL_TILES = COLS * ROWS;
    canvas.width = COLS * 32;
    canvas.height = ROWS * 32;
}

// Helper: Rebuild the Dropdown list based on map bounds
function updateNavDropdown() {
    nav.innerHTML = '';
    var bounds = getMapBounds();

    // Append Standard Map Layer Options
    for(let x = 0; x <= bounds.maxX; x++) {
        for(let y = 0; y <= bounds.maxY; y++) {
            let opt = document.createElement('option');
            let sec = UPPER[x] + LOWER[y];
            opt.value = opt.textContent = sec;
            nav.appendChild(opt);
        }
    }

    // Append City Maps Layer Options
    for(let x = 0; x <= bounds.maxX; x++) {
        for(let y = 0; y <= bounds.maxY; y++) {
            let opt = document.createElement('option');
            let sec = UPPER[x] + CITY_SYMBOLS[y];
            opt.value = opt.textContent = sec;
            nav.appendChild(opt);
        }
    }

    // Force fallback if the map shrinks and player is out-of-bounds
    if (nav.querySelector(`option[value="${currentSector}"]`)) {
        nav.value = currentSector;
    } else {
        currentSector = "Aa";
        nav.value = "Aa";
        document.getElementById('sectorLabel').innerText = currentSector;
        updateCityButton();
        render();
    }
}

function initBlank() {
    globalLogic = { a: "", b: "", c: "", f: "", t: "" };
    mapSectors = {};
    qpcData = {};
    
    COLS = 14;
    ROWS = 10;
    mapBounds = { maxX: 7, maxY: 7 };

    updateCanvasDimensions();

    // Initialize ALL potential sectors
    for(let x = 0; x < 26; x++) {
        for(let y = 0; y < 26; y++) {
            let sec = UPPER[x] + LOWER[y];
            mapSectors[sec] = { tiles: "Ga".repeat(TOTAL_TILES), exits: "", objects: [] };

            let citySec = UPPER[x] + CITY_SYMBOLS[y];
            mapSectors[citySec] = { tiles: "Ga".repeat(TOTAL_TILES), exits: "", objects: [] };
        }
    }
    currentSector = "Aa";
    updateNavDropdown();
    updateBrushPreview();
    updateGlobalLabels();
    updateQpcList();
    updateCityButton();
    render();
}

async function populateDrives() {
    if (!window.parent || !window.parent.CylonDOS) return;
    let select = document.getElementById('driveSelect');
    let currentVal = select.value;
    select.innerHTML = '<option value="">(Select Drive)</option>';
    let mounts = await window.parent.CylonDOS.mounts();
    mounts.forEach(m => {
        if (m.name !== 'ram' && m.name !== 'host') {
            let opt = document.createElement('option');
            opt.value = m.name;
            opt.textContent = m.name + ":/";
            if (m.name === currentVal) opt.selected = true;
            select.appendChild(opt);
        }
    });
}

// ---------------------------------------------------------
// VIRTUAL FILE SYSTEM INTEGRATION
// ---------------------------------------------------------

async function loadFromDrive() {
    let dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : null;
    let drive = document.getElementById('driveSelect').value;
    if (!dos || !drive) return alert("Please select a valid drive to load from.");
    
    initBlank(); 
    
    try {
        let wStr = await dos.load(drive + ':/a/gfxGridWide');
        let hStr = await dos.load(drive + ':/a/gfxGridTall');
        let lbStr = await dos.load(drive + ':/a/gfxLowerBound');
        
        if (wStr) COLS = parseInt(wStr, 10);
        if (hStr) ROWS = parseInt(hStr, 10);
        updateCanvasDimensions();
        
        if (lbStr && lbStr.length === 2) {
            mapBounds.maxX = Math.max(0, UPPER.indexOf(lbStr[0]));
            mapBounds.maxY = Math.max(0, LOWER.indexOf(lbStr[1]));
        }

        let gFiles = ['a', 'b', 'c', 'f', 't'];
        for (let g of gFiles) {
            let data = await dos.load(drive + ':/w/' + g).catch(e=>null);
            if (data) globalLogic[g] = data;
        }

        let qpcText = await dos.load(drive + ':/world.qpc').catch(e=>null);
        if (qpcText) parseQpcData(qpcText);

        let wDirs = await dos.dir(drive + ':/w').catch(e=>[]);
        for (let s of wDirs) {
            if (s.type === 'directory') {
                let secId = s.name.split('/').pop();
                if (secId.length !== 2) continue;
                
                // Load terrain just for display purposes
                let mData = await dos.load(drive + ':/w/' + secId + '/m').catch(e=>null);
                if (mData) {
                    if (mData.length < TOTAL_TILES * 2) mData += "Ga".repeat(TOTAL_TILES - (mData.length/2));
                    mapSectors[secId].tiles = mData.substring(0, TOTAL_TILES * 2);
                }

                let files = await dos.dir(drive + ':/w/' + secId).catch(e=>[]);
                for (let f of files) {
                    let fname = f.name.split('/').pop();
                    if (fname === 'm' || fname === 'e' || fname === 't' || f.type !== 'file') continue;
                    
                    if (fname.length >= 4) {
                        let logic = await dos.load(drive + ':/w/' + secId + '/' + fname).catch(e=>null);
                        let obj = {
                            id: fname.substring(0, 2),
                            z: fname.substring(2, 4),
                            data: fname.length >= 6 ? fname.substring(4, 6) : "",
                            logic: logic || ""
                        };
                        mapSectors[secId].objects.push(obj);
                    }
                }
            }
        }

        updateNavDropdown();
        changeSector();
        alert("Compiler loaded logic from " + drive + ":/");
    } catch(e) {
        console.error(e);
        alert("Failed to load: " + e.message);
    }
}

async function saveToDrive() {
    let dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : null;
    let drive = document.getElementById('driveSelect').value;
    if (!dos || !drive) return alert("Please select a valid drive to save to.");
    
    saveCurrentEditor(); 

    try {
        let gFiles = ['a', 'b', 'c', 'f', 't'];
        for (let g of gFiles) {
            if (globalLogic[g]) {
                await dos.save(drive + ':/w/' + g, globalLogic[g]);
            } else {
                await dos.delete(drive + ':/w/' + g).catch(e=>{});
            }
        }

        let qpcOut = "";
        for (const [name, code] of Object.entries(qpcData)) {
            qpcOut += `[${name}]${(code||"").replace(/\\/g, "\\\\").replace(/\n/g, "\\n")}\n`;
        }
        if (qpcOut) await dos.save(drive + ':/world.qpc', qpcOut);

        // Save Objects
        // Clean out existing objects from /w/SEC directories to avoid ghost files
        for (let secId in mapSectors) {
            let sec = mapSectors[secId];
            let exists = await dos.exists(drive + ':/w/' + secId).catch(e=>false);
            if (exists) {
                let files = await dos.dir(drive + ':/w/' + secId).catch(e=>[]);
                for (let f of files) {
                    let fname = f.name.split('/').pop();
                    if (fname !== 'm' && fname !== 'e' && fname !== 't' && fname.length >= 4) {
                        await dos.delete(drive + ':/w/' + secId + '/' + fname).catch(e=>{});
                    }
                }
                
                for (let obj of sec.objects) {
                    let fname = obj.id + obj.z + (obj.data || "");
                    await dos.save(drive + ':/w/' + secId + '/' + fname, obj.logic || "\\n");
                }
            }
        }

        alert("Punch Codes successfully synced to " + drive + ":/");
    } catch (e) {
        console.error(e);
        alert("Save failed: " + e.message);
    }
}

// ---------------------------------------------------------
// LEGACY IMPORT LOGIC (Parses old .gfx flat strings to memory)
// ---------------------------------------------------------
async function importLegacyGfx() {
    try {
        const text = await navigator.clipboard.readText();
        if(!text) return;
        parseGfxData(text);
        alert("Legacy map loaded into memory. Click SAVE to sync it to the selected drive.");
    } catch (e) { console.error("Import failed", e); }
}

function parseGfxData(text) {
    initBlank(); 

    const unescapeWhitespace = (str) => (str || "")
        .replace(/_NL_/g, "\n")
        .replace(/\\n/g, "\n")
        .replace(/\\r/g, "\r")
        .replace(/\\\\/g, "\\");

    const lines = text.split('\n');

    lines.forEach(line => {
        const eqIdx = line.indexOf('=');
        if (eqIdx === -1) return;
        const label = line.substring(0, eqIdx);
        if (label === 'd') {
            const match = unescapeWhitespace(line.substring(eqIdx + 1)).match(/^(\d+)x(\d+)$/i);
            if (match) { COLS = parseInt(match[1],10); ROWS = parseInt(match[2],10); }
        }
        if (label === 'a') {
            const code = unescapeWhitespace(line.substring(eqIdx + 1));
            globalLogic.a = code;
            const match = code.match(/(?:Xs\s*)?W4\s*([A-Z][a-z])/);
            if (match) {
                mapBounds.maxX = Math.max(0, UPPER.indexOf(match[1].charAt(0)));
                mapBounds.maxY = Math.max(0, LOWER.indexOf(match[1].charAt(1)));
            }
        }
    });

    updateCanvasDimensions();
    TOTAL_TILES = COLS * ROWS;

    lines.forEach(line => {
        const eqIdx = line.indexOf('=');
        if (eqIdx === -1) return;
        const label = line.substring(0, eqIdx);
        const content = line.substring(eqIdx + 1);

        if (label === 'b' || label === 'c' || label === 'f' || label === 't') {
            globalLogic[label] = unescapeWhitespace(content);
            return;
        }

        if (label.length !== 2) return; 

        let [map, items] = content.split('.');
        let objs = [];
        if(items) items.split('~').forEach(c => {
            if(!c) return;
            let [m, rawl] = c.split('|');
            let l = unescapeWhitespace(rawl);
            if (m) {
                if (m.length >= 6) {
                    objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: m.substring(4,6), logic: l || "" });
                } else if (m.length >= 4) {
                    objs.push({ id: m.substring(0,2), z: m.substring(2,4), data: "", logic: l || "" });
                }
            }
        });
        
        const tilesLength = TOTAL_TILES * 2;
        let tStr = map.substring(0, tilesLength);
        if (tStr.length < tilesLength) tStr += "Ga".repeat((tilesLength - tStr.length)/2);
        
        mapSectors[label] = { tiles: tStr, exits: map.substring(tilesLength), objects: objs };
    });
    
    updateGlobalLabels();
    render();
}

// ---------------------------------------------------------
// UI AND LOGIC
// ---------------------------------------------------------
function updateCityButton() {
    const btn = document.getElementById('cityToggleBtn');
    if (!btn) return;
    const isCity = CITY_SYMBOLS.includes(currentSector[1]);
    btn.innerText = isCity ? "EXIT CITY" : "ENTER CITY";
    btn.style.background = isCity ? "#8e44ad" : ""; 
}

function toggleCity() {
    let isCity = CITY_SYMBOLS.includes(currentSector[1]);
    let xChar = currentSector[0];
    let yIdx = isCity ? CITY_SYMBOLS.indexOf(currentSector[1]) : LOWER.indexOf(currentSector[1]);

    if (yIdx !== -1) {
        nav.value = isCity ? (xChar + LOWER[yIdx]) : (xChar + CITY_SYMBOLS[yIdx]);
        changeSector();
    }
}

// --- MOUSE AND TOUCH INTERACTION ---
canvas.addEventListener('contextmenu', e => e.preventDefault());

let longPressTimer = null;
let isLongPress = false;
let startPointerX = 0;
let startPointerY = 0;

function handlePointerDown(clientX, clientY, isRightClick) {
    if (document.activeElement) { document.activeElement.blur(); }

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((clientX - rect.left) / 32);
    const y = Math.floor((clientY - rect.top) / 32);
    const tileIndex = y * COLS + x;

    if (tileIndex < 0 || tileIndex >= TOTAL_TILES) return;

    startPointerX = clientX;
    startPointerY = clientY;

    const sec = mapSectors[currentSector];
    const originalTiles = sec.tiles;
    const sampled = sec.tiles.substring(tileIndex * 2, tileIndex * 2 + 2);

    if (isRightClick) {
        document.getElementById('tileInput').value = sampled;
        updateBrushPreview();
        render();
        return;
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        handlePointerDown(e.clientX, e.clientY, false);
    } else if (e.button === 2) {
        handlePointerDown(e.clientX, e.clientY, true);
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / 32);
    const y = Math.floor((e.clientY - rect.top) / 32);
    const tileIndex = y * COLS + x;

    if (tileIndex >= 0 && tileIndex < TOTAL_TILES) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX - rect.left + 25) + 'px';
        tooltip.style.top = (e.clientY - rect.top - 15) + 'px';
        tooltip.innerText = `${tileIndex.toString(16).toUpperCase().padStart(2, '0')}`;
    } else {
        tooltip.style.display = 'none';
    }
});

canvas.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
});

// --- CORE LOGIC ---
function updateBrushPreview() {
    const code = document.getElementById('tileInput').value;
    const preview = document.getElementById('brushPreview');
    preview.style.background = `#000 url('t/${code}.png') no-repeat center`;
    preview.style.backgroundSize = "cover";
}

function getImg(src, cache) {
    if (cache[src] && cache[src].complete) return cache[src];
    const img = new Image();
    img.src = src;
    img.onload = () => { cache[src] = img; render(); };
    cache[src] = img;
    return img;
}

function render() {
    const sec = mapSectors[currentSector];
    if(!sec) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let i=0; i<TOTAL_TILES; i++) {
        let code = sec.tiles.substring(i*2, i*2+2);
        let img = getImg(`t/${code}.png`, tileCache);
        if(img.complete) ctx.drawImage(img, (i%COLS)*32, Math.floor(i/COLS)*32, 32, 32);
    }

    sec.objects.forEach(obj => {
        let img = getImg(`i/${obj.id}.png`, itemCache);
        let z = parseInt(obj.z, 16); 
        let targetX = (z % COLS) * 32;
        let targetY = Math.floor(z / COLS) * 32;

        if(img.complete) {
            if (obj.id.startsWith('T') || obj.id.startsWith('U')) {
                let drawX = targetX + 32 - img.width;
                let drawY = targetY + 32 - img.height;
                ctx.drawImage(img, drawX, drawY, img.width, img.height);
            } else {
                ctx.drawImage(img, targetX, targetY, 32, 32);
            }
        }
    });
    updateObjectList();
}

function editObject() {
    if (editingIndex === -1) {
        alert("Please select an object from the list below to edit first.");

function addQpc() {

    if (qpcData[nameStr] !== undefined) {

        saveCurrentEditor();
        closeEditor();
        return;
    }

    editingIndex = -1;
    editingGlobalKey = null;
    editingQpcKey = name;

    updateQpcList();

    const punchInput = document.getElementById('punchcodeInput');

        punchInput.value = qpcData[name] || "";

async function importQpcLegacy() {
    try {
        const text = await navigator.clipboard.readText();
        if (!text) return;
        parseQpcData(text);
        alert("QPC Legacy Scripts Imported!");
    } catch(e) { console.error("Import QPC failed", e); }
}

function parseQpcData(text) {
    const unescapeWhitespace = (str) => (str || "").replace(/\\n/g, "\n").replace(/\\r/g, "\r").replace(/\\\\/g, "\\");
    const lines = text.split(/\r?\n/);
    for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        const match = line.match(/^\[(.*?)\](.*)$/);
        if (match) {
            qpcData[match[1]] = unescapeWhitespace(match[2]);
        }
    }
    updateQpcList();
}

function exportQpcLegacy() {
    saveCurrentEditor();
    let out = "";
    const escapeWhitespace = (str) => (str || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/\r/g, "\\r");

    for (const [name, code] of Object.entries(qpcData)) {
        out += `[${name}]${escapeWhitespace(code)}\n`;
    }

    navigator.clipboard.writeText(out.trim());
    alert("QPC EXPORTED TO CLIPBOARD!");
}

        div.className = 'object-entry';
        const typeLabel = obj.data ? `d:${obj.data}` : `dynamic`;
        div.innerHTML = `[<b>${obj.id}</b> z:${obj.z} <span style="color: #888;">(${typeLabel})</span>] ${gfxItemID(obj.id)}`;
        div.onclick = () => openEditor(idx);
        list.appendChild(div);

        if (idx === editingIndex && logicBox) {

            logicBox.style.display = 'block';
        }
    });

        document.getElementById('global-' + editingGlobalKey).appendChild(logicBox);

        logicBox.style.display = 'none';

function addObject() {
    const idStr = document.getElementById('newID').value.trim();
    const zStr = document.getElementById('newZ').value.trim();
    const dataStr = document.getElementById('newDATA').value.trim();

    if (idStr.length !== 2 || zStr.length !== 2) {
        alert("ID and Z must be exactly 2 characters (e.g., ID: 'Bd', Z: '0A')");
        return;
    }

    if (editingIndex !== -1 || editingGlobalKey !== null || editingQpcKey !== null) {
        saveCurrentEditor();
        closeEditor();
    }

    const newObject = {
        id: idStr,
        z: zStr.toUpperCase(),
        data: (dataStr.length === 2) ? dataStr : "",

function saveCurrentEditor() {
    const punchInput = document.getElementById('punchcodeInput');
    if (!punchInput) return;
    let val = punchInput.value;

    if (editingIndex !== -1) {
        try { mapSectors[currentSector].objects[editingIndex].logic = val; } catch (e) { }
    } else if (editingGlobalKey !== null) {
        globalLogic[editingGlobalKey] = val;
    } else if (editingQpcKey !== null) {
        qpcData[editingQpcKey] = val;
    }
}

function openGlobalEditor(key) {
    if (editingGlobalKey === key) {
        saveCurrentEditor();
        closeEditor();
        return;
    }

    saveCurrentEditor();
    editingIndex = -1;
    editingGlobalKey = key;
    editingQpcKey = null;

    updateObjectList();
    updateQpcList();

    const logicBox = document.getElementById('logicBox');
    if (logicBox) {
        document.getElementById('global-' + key).appendChild(logicBox);
        logicBox.style.display = 'block';
    }

    let title = "";
    if (key === 'a') title = "ALPHA (ON CONNECT)";
    if (key === 'b') title = "BEFORE (PRE-TICK)";
    if (key === 'c') title = "AFTER (POST-TICK)";
    if (key === 'f') title = "FIRE ITEM";
    if (key === 't') title = "TAG (PVP)";

    document.getElementById('logicLabel').innerText = "GLOBAL PUNCH CODE";
    document.getElementById('editingObjID').innerText = title;

    const punchInput = document.getElementById('punchcodeInput');
    if (punchInput) {
        punchInput.value = globalLogic[key] || "";
    }

    updateDecompiler();
    updateGlobalLabels();
}

function openEditor(idx) {
    if (editingIndex === idx) {
        saveCurrentEditor();
        closeEditor();
        return;
    }

    saveCurrentEditor();
    editingIndex = idx;
    editingGlobalKey = null;
    editingQpcKey = null;

    updateGlobalLabels();

    const obj = mapSectors[currentSector].objects[idx];

    document.getElementById('newID').value = obj.id;
    document.getElementById('newZ').value = obj.z;
    document.getElementById('newDATA').value = obj.data || "";

    const labelEl = document.getElementById('logicLabel');
    if (obj.data && obj.data.length === 2) {
        labelEl.innerText = "PUNCH CODE";
    } else {
        labelEl.innerText = "ITEM INVENTORY";
    }

    document.getElementById('editingObjID').innerText = obj.id + "@" + obj.z;
    document.getElementById('punchcodeInput').value = obj.logic;

    updateDecompiler();
    updateObjectList();
    updateQpcList();

function closeEditor() {

    editingGlobalKey = null;
    editingQpcKey = null;

    const logicBox = document.getElementById('logicBox');
    document.getElementById('panel').appendChild(logicBox);
    logicBox.style.display = 'none';

    document.getElementById('newID').value = "";
    document.getElementById('newZ').value = "";
    document.getElementById('newDATA').value = "00";

    document.getElementById('editingObjID').innerText = "";
    document.getElementById('punchcodeInput').value = "";

    if (editingIndex !== -1) {

// ----------------------------------------------------------------------
// Decompiler Display Logic 
// ----------------------------------------------------------------------
function isWRegister(code) {
    return code.length === 2 && code.charAt(0) === 'W' && (
        (code.charAt(1) >= 'a' && code.charAt(1) <= 'z') ||
        (code.charAt(1) >= '0' && code.charAt(1) <= '9')
    );
}

function isNumerical(code) {
    return code.length === 2 && !isNaN(parseInt(code));
}

function getCodeDescription(code) {
    if (code === "Za") return "nothing (null)";
    if (code === "Z1") return "exit Z1";

    const itemText = typeof gfxItemID === "function" ? gfxItemID(code) : "Unknown";
    if (itemText !== "Item " + code && itemText !== "Unknown") return itemText;

    if (code.length === 2 && code.charAt(0) >= 'A' && code.charAt(0) <= 'Z' && (LOWER.includes(code.charAt(1)) || CITY_SYMBOLS.includes(code.charAt(1)))) {
        return `sector ${code}`;
    }
    return `code "${code}"`;
}

function decompilepunchcode(initialCode) {
    const punchcodeImagesContainer = document.getElementById('punchcodeImages');
    punchcodeImagesContainer.innerHTML = "";
    if (!initialCode) return;

    function bindHover(element, desc, startIdx, endIdx) {
        element.style.cursor = "pointer";
        element.addEventListener('mousemove', (e) => {
            const ta = document.getElementById('punchcodeInput');
            ta.focus({ preventScroll: true });
            ta.setSelectionRange(startIdx, endIdx);
            const tooltip = document.getElementById('tooltip');
            tooltip.style.display = 'block';
            tooltip.innerText = desc;
            tooltip.style.left = (e.pageX + 15) + 'px';
            tooltip.style.top = (e.pageY + 15) + 'px';
        });
        element.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });
    }

    function parseAndRender(srcString, overrideStart = null, overrideEnd = null) {
        let col = 0;
        let ifnot = false;
        let ifnotStartIdx = null;

        while (col < srcString.length) {
            let startIdx = col;
            let char = srcString.charAt(col);

            if (char === ' ' || char === '\t') {
                const spacer = document.createElement('div');
                spacer.style.width = '16px';
                spacer.style.height = '32px';
                spacer.style.display = 'inline-block';
                punchcodeImagesContainer.appendChild(spacer);
                col++;
                continue;
            }
            else if (char === '\n' || char === '\r') {
                const br = document.createElement('div');
                br.style.flexBasis = '100%';
                br.style.height = '0';
                punchcodeImagesContainer.appendChild(br);
                if (char === '\r' && srcString.charAt(col + 1) === '\n') col++;
                col++;
                continue;
            }

            let text = "";
            let endIdx = col;

            if (char === '[') {
                let closeIdx = srcString.indexOf(']', col);
                if (closeIdx !== -1) {
                    text = srcString.substring(col, closeIdx + 1);
                    endIdx = closeIdx + 1;
                    col = endIdx;
                } else {
                    let len = Math.min(2, srcString.length - col);
                    text = srcString.substring(col, col + len);
                    endIdx = col + len;
                    col = endIdx;
                }
            } else {
                let len = Math.min(2, srcString.length - col);
                text = srcString.substring(col, col + len);
                endIdx = col + len;
                col = endIdx;
            }

            let hlStart = overrideStart !== null ? overrideStart : startIdx;
            let hlEnd = overrideEnd !== null ? overrideEnd : endIdx;

            if (text.startsWith('[') && text.endsWith(']')) {
                let macroName = text.substring(1, text.length - 1);
                let macroCode = qpcData[macroName];
                if (macroCode !== undefined) {
                    parseAndRender(macroCode, hlStart, hlEnd);
                } else {
                    let block = createTextBlock(text);
                    punchcodeImagesContainer.appendChild(block);
                    bindHover(block, "Missing Tape: " + text, hlStart, hlEnd);
                }
                continue;
            }

            let item = text;
            let rawDesc = typeof gfxItemID === "function" ? gfxItemID(item) : "Unknown";
            if (rawDesc === "Unknown") rawDesc = getCodeDescription(item);

            if (item === "Xn") {
                ifnot = true;
                ifnotStartIdx = hlStart;
                continue;
            }

            let blockEl = null;

            if (item === "Xc") {
                blockEl = createImgBlock('i/Xc.png');
                punchcodeImagesContainer.appendChild(blockEl);
                bindHover(blockEl, rawDesc, hlStart, hlEnd);
            } else {
                let imgSrc = ifnot ? ('i/' + item + 'n.png') : ('i/' + item + '.png');
                blockEl = createImgBlock(imgSrc);
                punchcodeImagesContainer.appendChild(blockEl);

                let cleanDesc = rawDesc.replace(/^[%\$#]{2}/, '');
                let tooltipDesc = cleanDesc;

                if (cleanDesc.match(/\[(.*?)\/(.*?)\]/)) {
                    tooltipDesc = cleanDesc.replace(/\[(.*?)\/(.*?)\]/g, (match, left, right) => {
                        return ifnot ? right : left;
                    });
                } else {
                    tooltipDesc = ifnot ? ("If Not: " + cleanDesc) : cleanDesc;
                }

                let finalStart = ifnot ? ifnotStartIdx : hlStart;
                bindHover(blockEl, tooltipDesc || item, finalStart, hlEnd);

                let currentDesc = rawDesc;

                while (currentDesc.startsWith("%%") || currentDesc.startsWith("$$") || currentDesc.startsWith("##")) {
                    let prefix = currentDesc.substring(0, 2);

                    let nStart = col;
                    while(nStart < srcString.length && (srcString.charAt(nStart) === ' ' || srcString.charAt(nStart) === '\t' || srcString.charAt(nStart) === '\n' || srcString.charAt(nStart) === '\r')) {
                        nStart++;
                    }
                    if (nStart >= srcString.length) break;

                    let nextcode = srcString.substring(nStart, nStart + 2);
                    col = nStart + 2;

                    let paramHlStart = overrideStart !== null ? overrideStart : nStart;
                    let paramHlEnd = overrideStart !== null ? overrideEnd : col;

                    let paramBlock = null;
                    let paramDesc = "";

                    if (prefix === "%%") {
                        currentDesc = currentDesc.substring(2);
                        paramDesc = "Param: " + getCodeDescription(nextcode);
                        paramBlock = createTextBlock(nextcode);
                    } else if (prefix === "$$") {
                        currentDesc = currentDesc.substring(2);
                        paramDesc = "Item: " + (typeof gfxItemID === "function" ? gfxItemID(nextcode) : nextcode);
                        paramBlock = createImgBlock('i/' + nextcode + '.png');
                    } else if (prefix === "##") {
                        currentDesc = currentDesc.substring(2);
                        paramDesc = "Number: " + nextcode;
                        paramBlock = createNumBlock(nextcode);
                    }

                    if (paramBlock) {
                        punchcodeImagesContainer.appendChild(paramBlock);
                        bindHover(paramBlock, paramDesc, paramHlStart, paramHlEnd);
                    }
                }
            }
            ifnot = false;
        }
    }

    parseAndRender(initialCode);
}

let punchcodeBg = "Ca";

    document.getElementById('bgInput').value = code;
    punchcodeBg = code;
    updateDecompiler();
}

function setCustomPunchcodeBg() {

        punchcodeBg = code;
        updateDecompiler();
    }
}

function createSpacer(text) {
    const wrap = document.createElement('div');
    wrap.className = 'punchcode-space';
    const div = document.createElement('div');
    div.style.backgroundColor = 'transparent';
    div.textContent = text;
    wrap.appendChild(div);
    return wrap;
}

function createTextBlock(text) {
    const div = document.createElement('div');
    div.className = 'punchcode-text';
    div.textContent = text;
    div.style.backgroundImage = `url('t/${punchcodeBg}.png')`;
    div.style.color = punchcodeTextColor;
    return div;
}

function createNumBlock(num) {
    const wrap = document.createElement('div');
    wrap.className = 'punchcode-num';
    wrap.style.backgroundImage = `url('t/${punchcodeBg}.png')`;

    if (!/^[A-Z]/.test(String(num))) {
        const div = document.createElement('div');
        div.className = 'punchcode-text';
        div.style.backgroundColor = 'transparent';
        div.style.backgroundImage = 'none';
        div.style.color = punchcodeTextColor;
        div.textContent = num;
        wrap.appendChild(div);
        return wrap;
    } else {
        const img = document.createElement('img');
        img.src = "i/" + num + ".png";
        img.style.width = "32px";
        img.style.height = "32px";
        img.style.display = "block";
        wrap.appendChild(img);
        return wrap;
    }
}

function createImgBlock(src) {
    const wrap = document.createElement('div');
    wrap.className = 'punchcode-img';
    wrap.style.backgroundImage = `url('t/${punchcodeBg}.png')`;
    const img = document.createElement('img');
    img.src = src;
    wrap.appendChild(img);
    return wrap;
}

function DarkMode() {
    punchcodeTextColor = "#000000";
    updateDecompiler();
}

function LightMode() {
    punchcodeTextColor = "#FFFFFF";
    updateDecompiler();
}

    initBlank();
