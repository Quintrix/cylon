<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cylon Desktop</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx.js"></script>
<style>
/* Desktop Workspace Styles */
body, html {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
background-color: var(--bg-color, #000);
color: var(--fg-color, #0f0);
font-family: var(--font-face, monospace);
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
user-select: none;
-webkit-user-select: none;
}
 
#desktop-wrapper {
   position: relative;
   background-color: #000;
   border: 2px solid var(--sel-bg, #333);
   box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
   overflow: hidden;
}
 
#bg-canvas {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 1;
   image-rendering: -moz-crisp-edges;
   image-rendering: -webkit-optimize-contrast;
   image-rendering: crisp-edges;
   image-rendering: pixelated;
}
 
#tiles-layer {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 5;
}
 
#icons-layer {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 10;
}
 
.icon-wrap {
   position: absolute;
   cursor: pointer;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   border-radius: 4px;
   transition: background-color 0.1s;
}
 
.icon-wrap:hover {
   background-color: rgba(255, 255, 255, 0.1);
   z-index: 20;
}
 
.icon-wrap:active {
   transform: scale(0.95);
   background-color: rgba(255, 255, 255, 0.2);
}
 
.icon-img {
   max-width: 60%;
   max-height: 55%;
   object-fit: contain;
   image-rendering: pixelated;
   filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
}
 
.icon-label {
   margin-top: 4px;
   font-size: clamp(9px, 2vmin, 14px);
   font-weight: bold;
   color: #fff;
   font-family: sans-serif;
   text-shadow: 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000;
   text-align: center;
   line-height: 1.1;
   width: 90%;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
}
</style>
</head>
<body>
<div id="desktop-wrapper">
   <canvas id="bg-canvas"></canvas>
   <div id="tiles-layer"></div>
   <div id="icons-layer"></div>
</div>
<script>
window.onload = async function() {
if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
window.CylonSDK.injectDesktopStyles();
}
 
if (!window.CylonCommand || !window.qdosLoad) {
document.body.innerHTML = "<h3 style='padding:20px;'>Error: Cylon OS not fully connected.</h3>";
return;
}
 
window.keydown = function(key, e) {
   if (!window.CylonGFX) return;
   
   // Interrupt auto-walking if user takes manual control
   window.CylonGFX.targetCursorZ = -1;
   window.CylonGFX.pendingCursorAction = null;
 
   let handled = false;
   if (key === 'ArrowUp')    { window.CylonGFX.moveCursor(0, -1); handled = true; }
   if (key === 'ArrowDown')  { window.CylonGFX.moveCursor(0, 1); handled = true; }
   if (key === 'ArrowLeft')  { window.CylonGFX.moveCursor(-1, 0); handled = true; }
   if (key === 'ArrowRight') { window.CylonGFX.moveCursor(1, 0); handled = true; }
   if (key === 'Enter')      { window.CylonGFX.executeCursor(); handled = true; }
   
   if (handled && e) {
       e.preventDefault(); // Prevent iframe from scrolling
   }
};
 
// ====================================================================
// OS BOOT SCRIPT - Transparent terminal logic driven by iferror
// ====================================================================
 
await window.CylonCommand(`desktop:`);
await window.CylonCommand(`iferror mount desktop idb`);
await window.CylonCommand(`iferror import cylon-desktop.gfx ram desktop`);
await window.CylonCommand(`iferror mount ram: ram desktop`);
await window.CylonCommand(`cylon:`);
await window.CylonCommand(`iferror ram:`);
 
// Initialize the Graphics Engine on the desktop root sector
if (window.CylonGFX) {
   let startSector = 'Aa';
   try {
       let loaded = await window.qdosLoad('desktop:/a/gfxSector');
       if (loaded) {
           let s = loaded.trim();
           if (s.length === 2) startSector = s;
       }
   } catch(e) {}
   
   await window.CylonGFX.init('desktop:/w/' + startSector);
} else {
   console.error("CylonGFX Engine missing!");
}
 
// Keep it scaled properly if screen orientation/size changes
window.addEventListener('resize', fitDesktopToScreen);
 
if (window.ResizeObserver) {
new ResizeObserver(fitDesktopToScreen).observe(document.body);
}
};
 
// Calculate container sizing logically scaling or adhering to static tiles
function fitDesktopToScreen() {
   if (!window.CylonGFX) return;
 
   const wrapper = document.getElementById('desktop-wrapper');
   const screenW = window.innerWidth;
   const screenH = window.innerHeight;
 
   const cols = window.CylonGFX.gridWide;
   const rows = window.CylonGFX.gridTall;
 
   // Failsafe: Avoid applying sizing calculations if DOM/iframe geometry isn't ready
   if (!cols || !rows || screenW === 0 || screenH === 0) return;
 
   let w, h;
 
   // Utilize the stretching parameter properly
   if (window.CylonGFX.gfxGridStretch) {
       const aspect = cols / rows;
       w = screenW;
       h = screenW / aspect;
 
       // If the calculated height exceeds the window, constrain by height instead
       if (h > screenH) {
           h = screenH;
           w = screenH * aspect;
       }
 
       // 98% allows a slight visual border clearance on the edges
       w = Math.floor(w * 0.98);
       h = Math.floor(h * 0.98);
   } else {
       // Strictly adhere to TileSize without stretching
       w = cols * window.CylonGFX.gfxTileSize;
       h = rows * window.CylonGFX.gfxTileSize;
   }
 
   wrapper.style.width = w + 'px';
   wrapper.style.height = h + 'px';
}
 
</script>
 
</body>
</html>
