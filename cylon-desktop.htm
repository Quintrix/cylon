<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desktop</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx-itemid.js"></script>
<script src="cylon-gfx.js"></script>
<style>
/* Desktop Workspace Styles */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color, #000);
    color: var(--fg-color, #0f0);
    font-family: var(--font-face, monospace);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

#desktop-wrapper {
   position: relative;
   background-color: #000;
   border: 2px solid var(--sel-bg, #333);
   box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
   overflow: hidden;
   box-sizing: border-box;
}

#bg-canvas {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 1;
   image-rendering: -moz-crisp-edges;
   image-rendering: -webkit-optimize-contrast;
   image-rendering: crisp-edges;
   image-rendering: pixelated;
}

#tiles-layer {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 5;
}

#icons-layer {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   z-index: 10;
}

.icon-wrap {
   position: absolute;
   cursor: pointer;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   border-radius: 4px;
   transition: background-color 0.1s;
}

.icon-wrap:hover {
   background-color: rgba(255, 255, 255, 0.1);
   z-index: 20;
}

.icon-wrap:active {
   transform: scale(0.95);
   background-color: rgba(255, 255, 255, 0.2);
}

.icon-img {
   max-width: 60%;
   max-height: 55%;
   object-fit: contain;
   image-rendering: pixelated;
   filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
}

.icon-label {
   margin-top: 4px;
   font-size: clamp(9px, 2vmin, 14px);
   font-weight: bold;
   color: #fff;
   font-family: sans-serif;
   text-shadow: 1px 1px 1px #000, -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000;
   text-align: center;
   line-height: 1.1;
   width: 90%;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;
}
</style>
</head>
<body>
<div id="desktop-wrapper">
   <canvas id="bg-canvas"></canvas>
   <div id="tiles-layer"></div>
   <div id="icons-layer"></div>
</div>
<script>
// ============================================================================
// SYSTEM APP ROUTING (Batch File Execution)
// ============================================================================
window.ObjDown = async function(filePath) {
    if (!filePath || !window.CylonGFX) return false;

    let scriptData = null;
    try {
        if (typeof window.qdosLoad === 'function') {
            scriptData = await window.qdosLoad(filePath);
        } else {
            const dos = window.CylonGFX.getDOS ? window.CylonGFX.getDOS() : null;
            if (dos) scriptData = await dos.load(filePath);
        }
    } catch (err) {
        console.warn('ObjDown load failed:', filePath, err);
        return false;
    }

    if (typeof scriptData !== 'string' || !scriptData.trim()) return false;

    // Only treat the file as an executable batch if it contains non-comment lines
    const hasCommands = scriptData.replace(/\\n/g, '\n').split('\n').some(line => {
        const cmd = line.trim();
        return cmd && !cmd.startsWith('//') && !cmd.startsWith(';');
    });
    if (!hasCommands) return false;

    if (typeof window.CylonScript === 'function') {
        await window.CylonScript(scriptData);
    } else if (typeof window.CylonGFX.executeScript === 'function') {
        await window.CylonGFX.executeScript(filePath);
    }

    if (!window.remoteQandylandUrl && typeof window.CylonGFX.renderScreen === 'function') {
        await window.CylonGFX.renderScreen();
    }
    return true;
};

// ============================================================================
// ITEMID MODS LOADER (cylon:/cylon-gfx-itemid.js + ${drive}:/a/gfxItemID)
// ============================================================================
const defaultGfxItemID = (typeof window.gfxItemID === 'function') ? window.gfxItemID : (() => 'Unknown');
let baseGfxItemID = defaultGfxItemID;
let itemIDOverrides = {};
let lastItemModSignature = null;
let desktopReady = false;

async function loadItemIDMods(jdos, drive) {
    let nextBase = defaultGfxItemID;
    let nextOverrides = {};
    let baseSig = '';
    let ovSig = '';

    if (jdos) {
        // 1. Load DevTeam edits from cylon:/cylon-gfx-itemid.js if present
        try {
            if (await jdos.exists('cylon:/cylon-gfx-itemid.js')) {
                const code = await jdos.load('cylon:/cylon-gfx-itemid.js');
                if (code) {
                    const parsedFn = new Function('window', code + '\nreturn window.gfxItemID;')({});
                    if (typeof parsedFn === 'function') {
                        nextBase = parsedFn;
                        baseSig = code;
                    }
                }
            }
        } catch (err) {
            console.warn('Could not load cylon:/cylon-gfx-itemid.js:', err);
        }

        // 2. Load per-drive .gfx overrides from ${drive}:/a/gfxItemID
        const modDrive = drive || window.desktopDrive || 'desktop';
        try {
            const modPath = `${modDrive}:/a/gfxItemID`;
            if (await jdos.exists(modPath)) {
                const raw = await jdos.load(modPath);
                if (raw && raw.trim()) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                        nextOverrides = parsed;
                        ovSig = raw;
                    }
                }
            }
        } catch (err) {
            console.warn(`Could not load ${modDrive}:/a/gfxItemID:`, err);
        }
    }

    baseGfxItemID = nextBase;
    window.baseGfxItemID = nextBase;
    itemIDOverrides = nextOverrides;

    if (window.CylonGFX) {
        window.CylonGFX.itemIDOverrides = nextOverrides;
    }

    window.gfxItemID = function(id) {
        const ov = (window.CylonGFX && window.CylonGFX.itemIDOverrides) || itemIDOverrides;
        if (ov && Object.prototype.hasOwnProperty.call(ov, id)) {
            const custom = ov[id];
            if (custom !== undefined && custom !== null && String(custom).trim() !== '') {
                return String(custom);
            }
        }
        return baseGfxItemID(id);
    };

    window.reloadItemIDMods = function() {
        return loadItemIDMods(jdos, window.desktopDrive || 'desktop');
    };

    const sig = baseSig + '\0' + ovSig;
    const changed = (lastItemModSignature !== null && sig !== lastItemModSignature);
    lastItemModSignature = sig;
    return changed;
}

// Re-apply modified tags and re-render when returning to the Desktop tab
window.addEventListener('message', async (e) => {
    if (window.location.origin !== 'null' && e.origin !== window.location.origin) return;
    if (e.source !== window && e.source !== window.parent) return;

    if (e.data && e.data.type === 'QANDY_PAGE_ACTIVATED' && desktopReady) {
        const jdos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
        const changed = await loadItemIDMods(jdos, window.desktopDrive || 'desktop');
        if (changed && window.CylonGFX) {
            if (window.remoteQandylandUrl) {
                if (window.map) window.CylonGFX.renderSectorStaticObjects(window.map);
                window.CylonGFX.lastRenderedItems = null;
                if (!window.CylonGFX.isSyncing) await window.CylonGFX.networkTick();
            } else {
                await window.CylonGFX.renderScreen();
            }
        }
    }
});

// ============================================================================
// DESKTOP CONFIG PARSING & VALIDATION
// Formats accepted for cylon:/a/cylonDesktop:
//   - Local single-user:  <filename.gfx>                 (e.g. cylon-desktop.gfx)
//   - Remote multi-user:  <server>//<filename.gfx>       (e.g. localhost:8080//cylon-desktop.gfx)
// Security: '/' is disallowed inside the filename itself.
// ============================================================================
const SAFE_GFX_NAME_RE = /^[A-Za-z0-9_.-]+$/;

function validateGfxFilename(name) {
    const clean = String(name || '').trim();
    if (!clean || clean === '.' || clean === '..' || clean.includes('..')) {
        throw new Error(`Invalid cylonDesktop filename: "${clean}"`);
    }
    if (clean.includes('/') || clean.includes('\\')) {
        throw new Error(`Security violation: '/' is not allowed in cylonDesktop filename ("${clean}").`);
    }
    if (!SAFE_GFX_NAME_RE.test(clean)) {
        throw new Error(`Invalid characters in cylonDesktop filename: "${clean}"`);
    }
    return clean;
}

function normalizeServerUrl(serverRaw) {
    let srv = String(serverRaw || '').trim().replace(/\/+$/, '');
    if (!srv) return null;
    if (!/^https?:\/\//i.test(srv)) {
        const isLocal = /^(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(srv);
        const proto = isLocal
            ? 'http://'
            : ((window.location.protocol === 'http:' || window.location.protocol === 'https:')
                ? window.location.protocol + '//'
                : 'https://');
        srv = proto + srv;
    }
    return srv;
}

function parseDesktopConfig(rawValue) {
    const raw = String(rawValue == null ? '' : rawValue).trim();
    if (!raw) {
        return { mode: 'local', serverUrl: null, gfxFile: 'cylon-desktop.gfx' };
    }

    const schemeMatch = raw.match(/^(https?:\/\/)/i);
    const schemeLen = schemeMatch ? schemeMatch[1].length : 0;
    const sepIdx = raw.lastIndexOf('//');

    // Treat '//' after any URL scheme as the remote server // filename delimiter
    if (sepIdx !== -1 && sepIdx >= schemeLen) {
        const serverPart = raw.slice(0, sepIdx).trim();
        const filePart = raw.slice(sepIdx + 2);
        const serverUrl = normalizeServerUrl(serverPart);
        if (!serverUrl) {
            throw new Error(`Invalid server address in cylonDesktop: "${raw}"`);
        }
        return {
            mode: 'remote',
            serverUrl: serverUrl,
            gfxFile: validateGfxFilename(filePart)
        };
    }

    return {
        mode: 'local',
        serverUrl: null,
        gfxFile: validateGfxFilename(raw)
    };
}

async function resolveStartSector(dos, drive) {
    if (dos) {
        const candidates = [`${drive}:/a/gfxSector`, `${drive}:/a/gfxSpawn`];
        for (const p of candidates) {
            try {
                const val = await dos.load(p);
                if (val && val.trim().length === 2) return val.trim();
            } catch (e) {}
        }
        try {
            if (await dos.exists(`${drive}:/w/Aa`)) return 'Aa';
            if (await dos.exists(`${drive}:/w/Fb`)) return 'Fb';
        } catch (e) {}
    }
    return 'Aa';
}

// ============================================================================
// DESKTOP CLIENT (Single-User Local or Multi-User Qandyland)
// ============================================================================
window.onload = async function() {
    if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
        window.CylonSDK.applyColors(window.parent.CylonColors);
    }

    if (!window.CylonCommand || !window.CylonGFX) {
        document.body.innerHTML = "<h3 style='padding:20px;'>Error: Cylon OS or CylonGFX is not available.</h3>";
        return;
    }

    // Set Identity properties for the desktop
    window.desktopDrive = 'desktop';
    window.playerItem = 'Si'; // System cursor icon
    window.gfxDo = 'RF';
    window.CylonGFX.clickMovesCursor = true;

    // ------------------------------------------------------------------------
    // TARGET MENU
    // ------------------------------------------------------------------------
    window.CylonGFX.showTargetMenu = function(z, clientX, clientY) {
        if (!window.parent || !window.parent.CylonPopManager || typeof window.parent.CylonPopManager.showContextMenu !== 'function') return;

        let items = [];
        let iconWraps = document.querySelectorAll(`.icon-wrap[data-z="${z}"]`);
        const isRemote = !!window.remoteQandylandUrl;

        iconWraps.forEach(wrap => {
            let labelText = wrap.getAttribute('data-label');
            let fullPath = wrap.getAttribute('data-path');
            if (labelText && fullPath) {

                items.push({ label: 'Open ' + labelText, action: async () => {
                    let filename = fullPath.substring(fullPath.lastIndexOf('/') + 1);
                    let iconId = filename.substring(0, 2);

                    if (window.ObjDown && await window.ObjDown(fullPath)) {
                        return;
                    }

                    if (isRemote) {
                        let zStr = this.encodeZ(z, this.gfxZBase);
                        let plug = (filename.length === 6 && wrap.classList.contains('static-obj'))
                            ? ('OD' + iconId + zStr)
                            : ('ID' + iconId + zStr);
                        if (window.gfxDo === 'RF') window.gfxDo = '';
                        window.gfxDo += plug;
                    } else {
                        await this.executeScript(fullPath);
                    }
                }});

                if (!isRemote && this.enableFileMove) {
                    items.push({ label: 'Move ' + labelText, action: () => {
                        this.pendingMovePath = fullPath;
                        if (window.parent && window.parent.print) window.parent.print('Select a destination tile to drop this file.\n');
                    }});
                    items.push({ label: 'Remove ' + labelText, action: () => this.removeScript(fullPath) });
                }
            }
        });

        if (items.length > 0) {
            let mockEvent = { clientX, clientY, view: window };
            window.parent.CylonPopManager.showContextMenu(mockEvent, items);
        }
    };

    // ------------------------------------------------------------------------
    // EXECUTE CURSOR (Keyboard Enter)
    // ------------------------------------------------------------------------
    const origExecuteCursor = window.CylonGFX.executeCursor.bind(window.CylonGFX);
    window.CylonGFX.executeCursor = function() {
        if (!window.remoteQandylandUrl && this.enableFileMove && this.pendingMovePath) {
            const pendingPath = this.pendingMovePath;
            this.pendingMovePath = null;
            let z = window.playerZ;

            this.moveObjectToZ(pendingPath, z).then(() => {
                let x = z % this.gridWide;
                let y = Math.floor(z / this.gridWide);
                const wrapper = document.getElementById('desktop-wrapper');
                let rect = wrapper.getBoundingClientRect();
                let clientX = rect.left + (x + 0.5) * (rect.width / this.gridWide);
                let clientY = rect.top + (y + 0.5) * (rect.height / this.gridTall);
                this.showTargetMenu(z, clientX, clientY);
            });
            return;
        }
        origExecuteCursor();
    };

    // ------------------------------------------------------------------------
    // KEYBOARD HANDLING
    // ------------------------------------------------------------------------
    window.keydown = function(key, e) {
        const gfx = window.CylonGFX;
        if (!gfx) return;

        if (window.parent && window.parent.CylonPopManager && window.parent.CylonPopManager.isMenuOpen) {
            if (window.parent.CylonPopManager.handleMenuKey(key)) {
                if (e) e.preventDefault();
                return;
            }
        }

        let dx = 0, dy = 0;
        if (key === 'ArrowUp') dy = -1;
        else if (key === 'ArrowDown') dy = 1;
        else if (key === 'ArrowLeft') dx = -1;
        else if (key === 'ArrowRight') dx = 1;
        else if (key === 'Enter') {
            gfx.executeCursor();
            if (e) e.preventDefault();
            return;
        }
        else return;

        gfx.moveCursor(dx, dy);
        if (e) e.preventDefault();
    };

    // ------------------------------------------------------------------------
    // BOOT SEQUENCE
    // ------------------------------------------------------------------------
    let hostOrigin = 'https://qandy.onrender.com';
    let jdos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;

    try {
        if (jdos) {
            let savedOrigin = await jdos.load('cylon:/a/cylonHostOrigin');
            if (savedOrigin) hostOrigin = savedOrigin.trim();
        }
    } catch (err) {
        console.warn('Could not read cylon:/a/cylonHostOrigin, using fallback.');
    }

    const baseUrl = hostOrigin.endsWith('/') ? hostOrigin.slice(0, -1) : hostOrigin;

    try {
        // Read cylon:/a/cylonDesktop (with fallback to current drive /a/cylonDesktop)
        let rawDesktopCfg = '';
        if (jdos) {
            try {
                if (await jdos.exists('cylon:/a/cylonDesktop')) {
                    rawDesktopCfg = await jdos.load('cylon:/a/cylonDesktop');
                } else if (await jdos.exists('/a/cylonDesktop')) {
                    rawDesktopCfg = await jdos.load('/a/cylonDesktop');
                }
            } catch (err) {
                console.warn('Could not read cylonDesktop config, using default.', err);
            }
        }

        const desktopCfg = parseDesktopConfig(rawDesktopCfg);
        const isMultiUser = (desktopCfg.mode === 'remote');
        window.CylonGFX.enableFileMove = !isMultiUser;

        // Check existing desktop mount; remount RAM drive if source changed
        let isMounted = false;
        if (jdos) {
            let mounts = await jdos.mounts();
            let existing = mounts.find(m => m.name === 'desktop');
            if (existing) {
                if (existing.type === 'ram') {
                    let src = String(existing.source || '');
                    let matchesFile = (src === desktopCfg.gfxFile) || src.endsWith('/' + desktopCfg.gfxFile);
                    let matchesHost = !isMultiUser || src.startsWith(desktopCfg.serverUrl + '/');
                    if (matchesFile && matchesHost) {
                        isMounted = true;
                    } else {
                        await jdos.umount('desktop');
                    }
                } else {
                    isMounted = true; // Preserve installed persistent drive (e.g. ls)
                }
            }
        }

        if (isMultiUser) {
            const qandylandUrl = `${desktopCfg.serverUrl}/qandyland.js`;
            const gfxUrl = `${desktopCfg.serverUrl}/${desktopCfg.gfxFile}`;

            if (!isMounted) {
                await CylonCommand(`mount ${gfxUrl} ram desktop`);
            }

            await loadItemIDMods(jdos, 'desktop');
            const startSector = await resolveStartSector(jdos, 'desktop');
            await window.CylonGFX.gfxConnect(qandylandUrl, 'desktop', desktopCfg.gfxFile, startSector);
        } else {
            if (!isMounted) {
                let localSource = null;
                if (jdos) {
                    if (await jdos.exists(desktopCfg.gfxFile)) {
                        localSource = desktopCfg.gfxFile;
                    } else if (await jdos.exists(`cylon:/${desktopCfg.gfxFile}`)) {
                        localSource = `cylon:/${desktopCfg.gfxFile}`;
                    }
                }

                if (localSource) {
                    await CylonCommand(`import ${localSource} ram desktop`);
                } else {
                    await CylonCommand(`mount ${baseUrl}/${desktopCfg.gfxFile} ram desktop`);
                }
            }

            window.remoteQandylandUrl = null;
            if (window.CylonGFX.stopNetworkTick) window.CylonGFX.stopNetworkTick();

            await loadItemIDMods(jdos, 'desktop');
            const startSector = await resolveStartSector(jdos, 'desktop');
            await window.CylonGFX.init(`desktop:/w/${startSector}`);
        }

        // Resolve asset directories against the active desktop origin
        const assetBase = isMultiUser ? desktopCfg.serverUrl : baseUrl;
        if (window.CylonGFX) {
            let refreshNeeded = false;
            const dirProps = ['gfxTileDir', 'gfxIconDir', 'gfxCharDir', 'gfxMapsDir'];

            for (const prop of dirProps) {
                let val = window.CylonGFX[prop] || '';
                if (isMultiUser && assetBase !== baseUrl && val.startsWith(`${baseUrl}/`)) {
                    window.CylonGFX[prop] = `${assetBase}/` + val.slice(baseUrl.length + 1);
                    refreshNeeded = true;
                } else if (!val.match(/^https?:\/\//i) && !val.startsWith('data:')) {
                    window.CylonGFX[prop] = `${assetBase}/` + val.replace(/^\/+/, '');
                    refreshNeeded = true;
                }
            }

            if (refreshNeeded) {
                await window.CylonGFX.renderScreen();
            }
        }

        window.cylonHostOrigin = `${baseUrl}/`;
        desktopReady = true;

    } catch (err) {
        console.error('Cylon Desktop startup failed:', err);
        if (window.parent && window.parent.print) {
            window.parent.print(`[.4]Cylon Desktop startup failed: ${String(err.message || err)}[.]\n`);
        }
    }

    // Connect Screen Scaling Observer
    window.addEventListener('resize', fitDesktopToScreen);
    if (window.ResizeObserver) new ResizeObserver(fitDesktopToScreen).observe(document.body);
};

function fitDesktopToScreen() {
   if (!window.CylonGFX) return;

   const wrapper = document.getElementById('desktop-wrapper');
   const screenW = window.innerWidth;
   const screenH = window.innerHeight;

   const cols = window.CylonGFX.gridWide;
   const rows = window.CylonGFX.gridTall;

   if (!cols || !rows || screenW === 0 || screenH === 0) return;

   let w, h;

   if (window.CylonGFX.gfxGridStretch) {
       const aspect = cols / rows;
       w = screenW;
       h = screenW / aspect;

       if (h > screenH) {
           h = screenH;
           w = screenH * aspect;
       }

       w = Math.floor(w * 0.98);
       h = Math.floor(h * 0.98);
   } else {
       w = cols * window.CylonGFX.gfxTileSize;
       h = rows * window.CylonGFX.gfxTileSize;
   }

   wrapper.style.width = w + 'px';
   wrapper.style.height = h + 'px';
}
</script>
</body>
</html>
