function Trap(a) {
  Game="<center><font color=purple>Guards:</font><p>";
  if (a==0||a==1) { Game=Game+"Freeze! Who are you?<br>What are you doing here?<br>" }  
  if (a==2||a==3) { Game=Game+"You are under arrest!<br>Did you kill this player?<br>"; }
  if (a==1||a==3) { Game=Game+"The guard punches you.<br>"; }
  if (a==4||a==5) { Game=Game+"The guard beats you unconscious.<br>"; } 
  if (a==5) {
    z=0; for (i=0; i<MapSizeY+1; i++) { for (j=0; j<MapSizeX+1; j++) { eval('T'+z+'.setAttribute(\"src\",\"'+DirTile+'/Q5.png\");'); z++; }}
    RefMap=0; EraseAll(); ToDo="C=KG"; 
  }
  if (a==7) { 
    Game=Game+"<p>Wake Up Prisoner.<br>Transport to the Kings Prison<br>Labor Camp arrives in 1 minute";
    S[S.length]="I|W1|||81"; Sprung=setTimeout('S.pop();',5000); 
  }
  if (a<7) { Sprung=setTimeout('Trap('+(a+1)+');',2000); }
  POP(Game);   
}

function ProcessQue() {
  if (CharZ==Destination) {
    if (Que.substring(0,3)=="Gts") {
      if (CharInven.indexOf("Z0")>-1) {
        if (Que.substring(3,5)=="C5") {
          if (CharMap=="A9e") {
            S[S.length]="I|W1|||"+(CharZ+1);
            S[S.length]="I|W1|||"+(CharZ-1);
            S[S.length]="I|W1|||"+(CharZ-2);
            S[S.length]="I|W1|||"+(CharZ-3);
            S[S.length]="I|W1|||"+(CharZ+14);
            S[S.length]="I|W1|||"+(CharZ-15);
            S[S.length]="I|W1|||"+(CharZ+16);
            POP("Its a trap! Guards appear!");
            Sprung=setTimeout('Trap(0);',1000); 
          }
        } else {
          ToDo="C=GS&J="+Que.substring(3,5);
        }
      }
    }
    if (Que.substring(0,3)=="Get") { if (CharInven.indexOf("Z0")>-1) { ToDo="C=G&J="+Que.substring(3,5); }}
    if (Que.substring(0,3)=="Chk") { ToDo="C=CK&J="+Que.substring(3,5); }
    if (Que.substring(0,3)=="Cty") { AllowScroll=0; EraseAll(); ToDo="C=EC&J="+Que.substring(3,Que.length); }
    if (Que.substring(0,3)=="XCt") { if (AllowScroll) { EraseAll(); ToDo="C=XC&J="+Que.substring(3,Que.length); }}
    if (Que.substring(0,3)=="Tel") { if (AllowScroll) { EraseAll(); ToDo="C=TP&J="+Que.substring(3,Que.length); }}
    if (Que.substring(0,3)=="Use") { ToDo="C=UI&J="+Que.substring(3,5); }
    if (Que.substring(0,3)=="Red") { 
      if (CharMap==HouseMap) {
        if (House) { HOUSE(2); } else { POP("<font color=navy><b>"+Que.substring(3,Que.length)+"</b></font>"); }
      } else {
        if (CharMap=="D6") {
          ForSale(0);
        } else {
          POP("<font color=navy><b>"+Que.substring(3,Que.length)+"</b></font>");
        }
      }
    }
    if (Que.substring(0,3)=="Bld") { VisitBuild(); }
    if (Que.substring(0,3)=="POP") { POP(Que.substring(3,Que.length)); }
    
    if (Que.substring(0,3)=="Atk") { Skill="Atk"+Que.substring(3,Que.length); RenderDam(); }
    if (Que.substring(0,3)=="Fsh") { Skill="Fsh"+Que.substring(3,Que.length); }
    if (Que.substring(0,3)=="NPC") { eval("NPC_"+Que+"(\"0\");"); }
  }
  Destination=0; Que="";
}

function Digits(a) {
  if (a<10) {
    return "0"+a;
  } else {
    if (a>99) {
      return "00";
    } else {
      return a;
    }
  }
}

function Graph(a1) {
  a2=LVL[CalcLevel(a1)];
  a3=LVL[CalcLevel(a1)+1];
  if (ToLevel99) {
    a4=CalcLevel(a1);
    a5=99; // how much experience is needed to level
    StatNext=LVL[99]-a1;	  
  } else {
    a4=a1-a2; // how much experience into level you have
    a5=a3-a2; // how much experience is needed to level
    StatNext=a5-a4;
  }
  
  a6=Math.round((100/a5)*a4);
  StatPercent=a6;

  a8=CalcLevel(a1);
  a7="&nbsp;"+Digits(a8)+"&nbsp;<img src="+DirTile+"/DAM5.gif height=10 width="+a6+"><img src="+DirTile+"/DAM0.gif height=10 width="+(100-a6)+">&nbsp;";
  
  if (ToLevel99) {
    a7=a7+"99 ";
  } else {
    if ((CalcLevel(a1)+1)<10) {
     a9=(CalcLevel(a1)+1);
     a7=a7+" "+Digits(a9)+" ";
    } else {
    a9=(CalcLevel(a1)+1);
     a7=a7+Digits(a9)+" ";
    }
  }
  
  return a7;
}

function ProcessInput(e) {  
  if (!e) e=window.event;
  if (e.keyCode) {
   i=e.keyCode;
  } else {
   if (e.which) { i=e.which; }
  }
  Shifted=0; if (e.shiftKey) { Shifted=1; }
  if (i==59) { if (Shifted) { i=58; }}  
  DecodeKey(i);
  return false; e.returnValue = false;
}

function DecodeKey(i) {
  IStamp=CStamp; K=0; if (VKey) { K=VKey; }
  if (i==27) { ChatLine=""; KCap=0; RefChat=1; } // ### ESCAPE ###
  if (i==8) { 
    if (Shifted || ShiftSet) {
      ChatLine=""; KCap=0; RefChat=1;
    } else {
      ChatLine=ChatLine.substring(0,ChatLine.length-1); K=8; // ### BACKSPACE ###
    }
  }
  
  if (document.getElementById("cursor").offsetLeft>400) { if (i != 13) { i=0; }}

  // left=37 up=38 right=39 down=40
  
  if (Retreat==0) { if (TradeOn==0) {
    if (i==37) { StepHere(CharZ-1); }
    if (i==38) { StepHere(CharZ-MapSizeX-1); }
    if (i==39) { StepHere(CharZ+1); }
    if (i==40) { StepHere(CharZ+MapSizeX+1); }
  }}
  
  if (TileMode) { AdminTileMode(i); } else {
    
    // POP(i);
        
    if (i==32) { K=32; }
    if (i>64 && i<91) { K=i+32; if (Shifted || ShiftSet) { K=i; }} 
    if (i>47 && i<58) { K=i; if (Shifted || ShiftSet) { K=i-16; if (K==38) {K=94;} if (K==40) {K=42;} if (K==39) {K=38;} if (K==41) {K=40;} if (K==32) {K=41;} }} 

    if (i==50) { if (Shifted || ShiftSet) { K=39; }}
    if (i==187) { K=61; if (Shifted || ShiftSet) { K=43; }}
    if (i==61) { K=61; if (Shifted || ShiftSet) { K=43; }}
    if (i==59) { K=59; }
    if (i==58) { K=58; }
    if (i==186) {K=59; if (Shifted || ShiftSet) { K=58; }}
    if (i==219) { K=91; }
    if (i==221) { K=93; }
    
    if (i==188) { K=44; if (Shifted || ShiftSet) { K=91; }}
    if (i==190) { K=46; if (Shifted || ShiftSet) { K=93; }}
    
    if (i==109) { K=45; }
    if (i==191) { if (Shifted || ShiftSet) { K=63; } else { K=47; }}
    if (i==222) { K=39; }
    if (i==107) { K=61; if (Shifted || ShiftSet) { K=43; }}
    
    if (i==13) {
      if (SendChat=="") {
        if (ChatLine.substring(0,2)=="/m") {
          if (window.XMLHttpRequest) { who=new XMLHttpRequest(); } else { if (window.ActiveXObject) { who=new ActiveXObject("Microsoft.XMLHTTP"); }} 
          MsgSent();
          ChatLine=ChatLine.replace(/\#/g,"%23");
          ChatLine=ChatLine.replace(/\+/g,"%2B");
          ChatLine=ChatLine.replace(/\=/g,"%3D");
          ChatLine=ChatLine.replace(/\=/g,"%3D");
          ChatLine=ChatLine.replace(/\&/g,"%26");
          if (ChatLine.substr(ChatLine.indexOf(" ",ChatLine.indexOf(" ")+1)+1,ChatLine.length)) {
            who.open('GET', WhoServer+'?N='+CharName+'&P='+WhoKey+'&C=S&SC='+ChatLine, true);                  
            who.send(null);
            NewChatLine=ChatLine.substr(0,ChatLine.indexOf(" ",ChatLine.indexOf(" ")+1)+1);
          }
          ChatLine=""; POP("Message Sent"); 
        } else {
          if (CMode) {
            CMode=0; RefChat=1;
            document.getElementById("msgs").src="http://localhost/images/buttons/d_msgs.gif";
          }
        }
        if (ChatLine.substring(0,1)=="/") { if (Admin) { AdminExecChat(); }}
        if (CharStatus=="MUTE") {
          Cht=Cht+"<br>"+CharName+": <font color=red>You Have Been Muted!</font>";
          RefChat=1; ChatLine=""; K=0;
        } 
        if (ChatLine) { SendChat=ChatLine; Cht=Cht+"<br>"+CharName+": "+SendChat; }
        if (CharStatus!="MUTE") { K=13; if (KCap==0) { ChatLine=""; }}
        if (NewChatLine) {
          ChatLine=NewChatLine;
          NewChatLine="";
          RefreshChat();
        }          
      } else {
        K=0; 
      }
    }
    
    if (K>0) {
      if (K>13) {
        ChatLine=ChatLine+String.fromCharCode(eval(K));
        if (Admin) { AdminChat(); }
      }
      IStamp=CStamp; RefreshChat();
    }
  }
  Shifted=0; 
  if (i==1) {
    ShiftSet=1-ShiftSet; Keys(1);
  } else {
    if (ShiftSet) { 
     ShiftSet=0; Keys(1); 
    }     
  }  
}

        if (who.responseText == "OFF") { POP("Error: User not online"); }
      } else {
        POP("Error Connecting to WHO server");
      }                
    }
  }
}

function WhoMode(a) {
  // readyState         the code successively changes value from 0 to 4 that means for "ready".
  // status             200 is OK 404 if the page is not found.
  // responseText       holds loaded data as a string of characters.
  // responseXml        holds an XML loaded file, DOM's method allows to extract data.

  //

  who.send(null);

  if(who.readyState==4) {

      if (AllyClan) {

          W0=W0+"<p align=center><a href=\"javascript:Null();\" onmousedown=\"ClickAlly();\">Clan Mates Online:</a><p align=center>";

      } else {
        W0=W0+"<p align=center><a href=\"javascript:Null();\" onmousedown=\"ClickAlly();\">Allies Online:</a><p align=center>";        
      } 
      W1=who.responseText.split(" ");
      W0=W0+"<table border=0><tr>"; r=0;
      for (Wi=0;Wi<W1.length;Wi++) {
        W2=W1[Wi].split("=");
        if (W2[0]!="E") {
          if (r==5) { W0=W0+"</tr><tr>"; r=0; } r++;
          W0=W0+"<td align=center><b><a href=\"javascript:Null();\" onmousedown=\"ClickWho(\'"+W2[0]+"\');\">"+W2[0]+"</a></b></td>";

      if (SResults=="Pop") { Skill=""; SResults=""; POP(Need); IStamp=CStamp; }
      if (SResults=="Not") { SResults=""; POP("You find nothing"); IStamp=CStamp; }
      if (SResults=="Bar") { SResults=""; POP("Your fish is<br>in a barrel."); IStamp=CStamp; }
      if (SResults=="Myt") { $SResults=""; Trader(1); IStamp=CStamp; }
      if (SResults=="Sto") { SResults=""; STORE(""); }
      if (SResults=="DyS") {
        Skill="D"; SResults="";
        Game="<center><font color=#006000><b>Store Inventory:</b></font><p>";
        IV=Need.split("|");
        for (i=0;i<IV.length;i++) {
          IV2=IV[i].split(" ");
          if (IV2[0]) {
            Game=Game+"&nbsp;<a href=javascript:Null(); onmousedown=\"javascript:DynStore(\'"+IV2[0]+"\');\"><img src=\""+DirItem+"/O"+IV2[0]+".gif\" border=0 height=32 width=32></a>x"+IV2[1]+"&nbsp;";
            if (IV2[0]==DynItem) { DynBuy=IV2[2]; DynSell=IV2[3]; }
          }
        }
        
        if (DynItem) {
          Game=Game+"<p>"+ItemID(DynItem)+"<p>";
          Game=Game+"<img src=\""+DirItem+"/O"+DynSell+".gif\" border=0 height=32 width=32>&nbsp; &nbsp;";
          Game=Game+"&nbsp; &nbsp;<img src=\""+DirItem+"/O"+DynBuy+".gif\" border=0 height=32 width=32><br>";
          Game=Game+"<a href=javascript:Null(); onmousedown=\"javascript:DynStore(\'"+DynSell+"\');\">Sell</a> &nbsp; &nbsp;";
          Game=Game+"&nbsp; &nbsp;<a href=javascript:Null(); onmousedown=\"javascript:DynStore(\'"+DynBuy+"\');\">Buy</a>";
        }
        Game=Game+"<p><a href=javascript:Null(); onmousedown=\"javascript:DynStore(\'Z0\');\">Leave Store</a>";
        PopForce="visible"; PopAlign="center"; POP(Game);
      }
      
      if (SResults=="IHt") {
        Retreat=0; SResults="";
        POP(Fight+" hits for "+Damage);
        Damage=0;
        RenderDam();
        IStamp=CStamp; 
      }
      if (SResults=="PHt") {
        Retreat=0; SResults="";
        POP("You hit for "+Damage);
        Damage=0; RenderDam();
        IStamp=CStamp; 
      }
      if (SResults=="Hse") {
        SResults="";
        POP("Done.");
        SBMode=1; RefSB=1;
      }      
    }
  } else {
    SWait=SWait+1;
    if (SWait<40) {
      HitTimer=setTimeout('GetIt();',250); 
    } else {
      clearInterval(RPG);
      EraseAll();
      document.onkeydown="";
      document.onkeypress="";
      document.onkeyup="";
      CharName="";
      CharPswd="";
      CharMap="B2";
      CharObj="NEW";
      Retreat=1;
      Skill="";
      ToDo="";
      RefChat=0;
      Accepted="..";
      TradeOffer="xx";
      TradeWith="";
      TradeOn=0;
      LErr=12;
      SResults="Off";
      LoginError();
    }
  }
}


function DynStore(a) {
  IStamp=CStamp; 
  if (a==DynBuy) {
    Skill="";
    ToDo="C=DS&J="+DynItem+DynBuy; 
    POP("Buying...");
  } else {
    if (a==DynSell) {
      Skill="";
      ToDo="C=DS&J="+DynItem+DynSell; 
      POP("Selling...");
    } else {
      if (a=="Z0") {
        TradeOn=0;
        Skill="";
        DynItem="";
        PopForce="hidden";
        HPOP();
      } else {
        POP(ItemID(a));
        DynItem=a;
      }
    }
  }
}



 
</script>
