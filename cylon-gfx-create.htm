<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFX Creator</title>
<script src="cylon-sdk.js"></script>
<script src="cylon-gfx-itemid.js"></script>
<script src="cylon-gfx.js"></script>
<style>
/* Core OS Styles */
body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color, #000);
    color: var(--fg-color, #0f0);
    font-family: var(--font-face, monospace);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
 
#desktop-wrapper {
   position: relative;
   background-color: #000;
   border: 2px solid var(--sel-bg, #333);
   box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
   overflow: hidden;
   box-sizing: border-box; 
}
 
#bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; image-rendering: pixelated; }
#tiles-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
#icons-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

.icon-wrap {
   position: absolute;
   cursor: pointer;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   transition: background-color 0.1s;
}

.icon-wrap:hover { 
    background-color: rgba(255, 255, 255, 0.2); 
    z-index: 20; 
}

/* Map Editor Override: Show item name cleanly on hover */
.icon-wrap:hover::after {
    content: attr(data-label);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--menu-bg, #111);
    color: var(--fg-color, #0f0);
    border: 1px solid var(--fg-color, #0f0);
    padding: 2px 6px;
    font-size: 12px;
    font-family: var(--font-face, monospace);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
}

.icon-img {
   /* Map Editor Override: Make icons and cursor stretch to fill the 32x32 tile */
   max-width: 100% !important; 
   max-height: 100% !important; 
   width: 100% !important;
   height: 100% !important;
   object-fit: fill !important; 
   image-rendering: pixelated;
   filter: none !important;
}

.icon-label {
   /* Map Editor Override: Hide desktop-style text labels under objects */
   display: none !important;
}
</style>
</head>
<body>

<div id="desktop-wrapper">
   <canvas id="bg-canvas"></canvas>
   <div id="tiles-layer"></div>
   <div id="icons-layer"></div>
</div>

<script>
// ============================================================================
// GFX EDITOR CLIENT (Unified Map Editing Interface)
// ============================================================================

window.currentBrush = 'Ga';
window.isFillMode = false;
window.activeDrive = null;

window.onload = async function() {
    if (window.CylonSDK && window.CylonSDK.injectDesktopStyles) {
        window.CylonSDK.applyColors(window.parent.CylonColors);
    }

    // Connect Screen Scaling Observer
    window.addEventListener('resize', fitDesktopToScreen);
    if (window.ResizeObserver) new ResizeObserver(fitDesktopToScreen).observe(document.body);

    // If the user dismisses the startup menu before picking a drive, tapping anywhere re-opens it
    document.body.addEventListener('pointerup', () => {
        if (!window.activeDrive) showDriveMenu();
    });

    await showDriveMenu();
};

async function showDriveMenu() {
    let dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    if (!dos || !window.parent || !window.parent.CylonPopManager) return;

    let mounts = await dos.mounts();
    let gfxDrives = mounts.filter(m => {
        let src = (m.source || '').toLowerCase();
        let name = (m.name || '').toLowerCase();
        return src.endsWith('.gfx') || name.endsWith('.gfx') || name === 'desktop';
    });

    let items = [];
    if (gfxDrives.length === 0) {
        items.push({
            label: '(No .gfx drives mounted)',
            action: () => {
                if (window.parent && window.parent.printDOS) {
                    window.parent.printDOS('[.2]Mount a .gfx drive first, e.g.: mount cylon-desktop.gfx ram[.]\n');
                }
            }
        });
    } else {
        gfxDrives.forEach(m => {
            items.push({
                label: `${m.name} [${m.type}]`,
                action: () => startEditor(m.name)
            });
        });
    }

    window.parent.CylonPopManager.showContextMenu('topleft', items);
}

async function startEditor(driveName) {
    if (!driveName) return;

    window.activeDrive = driveName;

    // Setup Engine Context
    window.desktopDrive = driveName;
    window.playerItem = 'Si'; // System cursor icon
    window.gfxDo = 'RF';
    
    // We leave clickMovesCursor false so the override logic can selectively move or open menus
    window.CylonGFX.clickMovesCursor = false;
    
    // Find starting sector (default Aa)
    let startSector = 'Aa';
    let dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    try {
        let loaded = await dos.load(`${driveName}:/a/gfxSector`);
        if (loaded && loaded.trim().length === 2) {
            startSector = loaded.trim();
        } else {
            let spawnLoaded = await dos.load(`${driveName}:/a/gfxSpawn`);
            if (spawnLoaded && spawnLoaded.trim().length === 2) startSector = spawnLoaded.trim();
        }
    } catch(e) {}
    
    // Initialize the engine locally in this iframe
    await window.CylonGFX.init(`${driveName}:/w/${startSector}`);
    
    // Fix asset URLs dynamically like the desktop does
    let baseUrl = window.cylonHostOrigin || '';
    if (baseUrl) {
        if (!window.CylonGFX.gfxTileDir.match(/^https?:\/\//i)) window.CylonGFX.gfxTileDir = baseUrl + window.CylonGFX.gfxTileDir.replace(/^\/+/, '');
        if (!window.CylonGFX.gfxIconDir.match(/^https?:\/\//i)) window.CylonGFX.gfxIconDir = baseUrl + window.CylonGFX.gfxIconDir.replace(/^\/+/, '');
    }
    
    // Force grid on by default for mappers
    window.CylonGFX.gfxGrid = true;
    
    await window.CylonGFX.renderScreen();
}

// ----------------------------------------------------------------------------
// OVERRIDE: GFX CONTEXT MENU
// ----------------------------------------------------------------------------
window.CylonGFX.showTargetMenu = async function(z, clientX, clientY) {
    if (!window.activeDrive) { showDriveMenu(); return; }
    
    let x = z % this.gridWide;
    let y = Math.floor(z / this.gridWide);

    // Single Click: Snap Cursor, Double Click: Open Menu
    if (window.playerZ !== z) {
        this.setCursorZ(z);

        // If Fill Mode is active, paint the tile immediately
        if (this.fillTileCode) {
            await this.setTileAtCursor(this.fillTileCode);
        }

        // Handle AirLock edge scrolling logic for map editors testing scroll-based games
        if (this.gfxAirLock) {
            let dirChar = null;
            if (y === 0) dirChar = 'N';
            else if (y === this.gridTall - 1) dirChar = 'S';
            else if (x === this.gridWide - 1) dirChar = 'E';
            else if (x === 0) dirChar = 'W';

            if (dirChar) {
                let parts = this.currentPath.split('/');
                let currentSector = parts[parts.length - 1];
                let nextSector = this.calculateTargetSector(currentSector, dirChar, this.gfxLowerBound, this.gfxRoundWorld);
                
                if (nextSector) {
                    let targetZ = z;
                    // Place cursor on the opposite edge to simulate a continuous walk
                    if (dirChar === 'E') targetZ = (y * this.gridWide) + 0;
                    if (dirChar === 'W') targetZ = (y * this.gridWide) + (this.gridWide - 1);
                    if (dirChar === 'S') targetZ = (0 * this.gridWide) + x;
                    if (dirChar === 'N') targetZ = ((this.gridTall - 1) * this.gridWide) + x;
                    
                    this.setCursorZ(targetZ);
                    await window.CylonCommand(`gfx tele ${nextSector}`);
                }
            }
        }
        return;
    }

    if (!window.parent || !window.parent.CylonPopManager) return;
    
    let dos = window.parent.CylonDOS;
    let mPath = this.currentPath + '/m';
    
    // Read the actual tile data safely to see what tile the cursor is hovering
    let tData = "";
    try { tData = await dos.load(mPath); } catch (e) {}
    tData = tData.replace(/\s+/g, '');
    let currentTile = tData.substring(z * 2, z * 2 + 2) || 'Za';

    // Scan for existing items/objects on this exact Z tile
    let existingItems = [];
    let iconWraps = document.querySelectorAll(`.icon-wrap[data-z="${z}"]`);
    iconWraps.forEach(wrap => {
        let labelText = wrap.getAttribute('data-label');
        let path = wrap.getAttribute('data-path');
        if (path) {
            existingItems.push({ labelText, path });
        }
    });

    let items = [];
    let parts = this.currentPath.split('/');
    let currentSector = parts[parts.length - 1];
    
    const groundChars = "abcdefghijklmnopqrstuvwxyz";
    const extChars    = "0123456789_()[]{}^,:;+-=%@";
    let secondChar = currentSector.charAt(1);

    // Header Info & Export Tool
    let zHex = this.encodeZ(z, this.gfxZBase || 10);
    items.push({ label: `Sector ${currentSector} Z ${zHex} Tile ${currentTile}`, action: () => {
        showGfxSubMenu(clientX, clientY);
    }});

    // Extended Map Navigation
    if (extChars.includes(secondChar)) {
        let idx = extChars.indexOf(secondChar);
        let groundSector = currentSector.charAt(0) + groundChars[idx];
        items.push({ label: `Exit Extended City ${groundSector}`, action: async () => {
            await window.CylonCommand(`gfx tele ${groundSector}`);
        }});
    } else if (groundChars.includes(secondChar)) {
        let idx = groundChars.indexOf(secondChar);
        let extSector = currentSector.charAt(0) + extChars[idx];
        items.push({ label: `Enter Extended Map ${extSector}`, action: async () => {
            await window.CylonCommand(`gfx tele ${extSector}`);
        }});
    }

    // Edit existing objects if present
    if (existingItems.length > 0) {
        existingItems.forEach(item => {

            items.push({ label: `Edit ${item.labelText}`, action: async () => {
                let dos = window.parent.CylonDOS;
                if (!dos) return;

                // 1. Save the target path to RAM so the compiler knows what to load
                let parts = item.path.split('/');
                let drive = parts[0];

                await dos.save('cylon:/a/gfxEditTarget', item.path);

                // 2. Launch (or focus) the compiler
                await window.CylonCommand('cylon-gfx-compiler.htm');

                // Close the context menu
                if (window.hpop) window.hpop();

            }});
        });
    }
    
    // Delete existing objects if present
    if (existingItems.length > 0) {
        existingItems.forEach(item => {
            items.push({ label: `Delete ${item.labelText}`, action: async () => {
                await window.CylonCommand(`delete ${item.path}`);
                setTimeout(() => window.CylonGFX.renderScreen(), 100);
            }});
        });
    }

    // Core Map Painting Tools
    items.push({ label: `Get Tile [${currentTile}]`, action: () => { 
        window.currentBrush = currentTile; 
    }});
    
    items.push({ label: `Paint Tile [${window.currentBrush}]`, action: async () => { 
        await window.CylonCommand(`gfx tile ${window.currentBrush}`);
    }});
    
    items.push({ label: window.isFillMode ? 'Disable Fill Mode' : `Tile Fill Mode [${window.currentBrush}]`, action: async () => {
        window.isFillMode = !window.isFillMode;
        await window.CylonCommand(`gfx fill ${window.isFillMode ? window.currentBrush : ''}`);
    }});

    // Dynamically find the index of the Paint Tile option
    let paintIdx = items.findIndex(i => i.label.startsWith('Paint Tile ['));

    // Execute the popup
    let mockEvent = { clientX, clientY, view: window };
    window.parent.CylonPopManager.showContextMenu(mockEvent, items);
    
    // Inject Tile Visuals into the Context Menu DOM dynamically using the correct index
    if (paintIdx > -1) {
        setTimeout(() => {
            try {
                let menuEls = window.parent.CylonPopManager.menuElements;
                if (menuEls && menuEls.length > paintIdx) {
                    let paintEl = menuEls[paintIdx];
                    paintEl.innerHTML = `<img src="${window.CylonGFX.gfxTileDir}${window.currentBrush}.png" style="width:16px;height:16px;vertical-align:middle;image-rendering:pixelated;margin-right:6px;border:1px solid #555;"> Paint Tile [${window.currentBrush}]`;
                }
            } catch(e) {}
        }, 10);
    }
};

// ----------------------------------------------------------------------------
// OVERRIDE: SCROLL INTERCEPT (Return to Ground Level from Extended Maps)
// ----------------------------------------------------------------------------
const _origCalculateTargetSector = window.CylonGFX.calculateTargetSector;

window.CylonGFX.calculateTargetSector = function(currentSector, dirChar, maxMapBounds, roundWorld) {
    const groundChars = "abcdefghijklmnopqrstuvwxyz";
    const extChars    = "0123456789_()[]{}^,:;+-=%@";
    
    if (currentSector && currentSector.length >= 2) {
        let secondChar = currentSector.charAt(1);
        
        if (extChars.includes(secondChar)) {
            let idx = extChars.indexOf(secondChar);
            return currentSector.charAt(0) + groundChars[idx];
        }
    }

    return _origCalculateTargetSector.call(this, currentSector, dirChar, maxMapBounds, roundWorld);
};

window.showGfxSubMenu = async function(clientX, clientY) {
    let dos = window.parent && window.parent.CylonDOS ? window.parent.CylonDOS : window.CylonDOS;
    let drive = window.activeDrive;
    let alphaDir = drive + ':/a';

    let items = [
        {
            label: `Save Drive to File`,
            action: () => window.CylonCommand(`export ${drive} ${drive}.gfx`)
        },
        {
            label: `Copy Drive to Clipboard`,
            action: () => window.CylonCommand(`export ${drive} <c>`)
        }
    ];

    const knownVars = {
        gfxCharDir: "character image directory",
        gfxIconDir: "icon image directory",
        gfxTileDir: "tile image directory",
        gfxMapsDir: "map image directory",
        gfxIconSize: "size of icons (32, 48, 64, etc)",
        gfxGridTall: "sector height in number of tiles",
        gfxGridWide: "sector width in number of tiles",
        gfxLowerBound: "lower bounds of map (ie: Hh, Zz)",
        gfxGridStretch: "if true, stretch grid to fill full screen",
        gfxRoundWorld: "if true, world is round and can scroll A <-> Z",
        gfxAirLock: "if true, automatic scrolling on edge tiles",
        gfxCommandLog: "if true, commands sent via CylonCommand() as if the user had typed them",
        gfxCycle: "speed player moves from tile to tile",
        gfxSector: "current map sector being rendered",
        gfxTickRate: "How often client pings the server, 0 = single player, capflag = 1 second",
        gfxSpawn: "The first map sector players start on",
        gfxSpawnZ: "The z-location of the player item for gfxSpawn"
    };

    let allVars = new Set(Object.keys(knownVars));
    
    try {
        let alphaFiles = await dos.dir(alphaDir);
        if (alphaFiles && alphaFiles.length > 0) {
            for (let file of alphaFiles) {
                if (file.type === 'file' && !file.name.includes('_dir.sys!')) {
                    let varName = file.name.substring(file.name.lastIndexOf('/') + 1);
                    allVars.add(varName); 
                }
            }
        }
    } catch (e) {}

    let sortedVars = Array.from(allVars).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

    for (let varName of sortedVars) {
        let desc = knownVars[varName] || "unknown";
        let val = ''; 
        
        try {
            if (await dos.exists(alphaDir + '/' + varName)) {
                let rawVal = await dos.load(alphaDir + '/' + varName);
                val = String(rawVal == null ? '' : rawVal).trim().replace(/\n/g, '\\n');
            }
        } catch (e) {}

        let displayCmd = `save ${varName} ${val}`;
        if (displayCmd.length > 32) displayCmd = displayCmd.substring(0, 29) + '...';

        items.push({
            label: displayCmd,
            action: async () => {
                let actualCmd = `save ${alphaDir}/${varName} ${val}`;
                
                if (window.CylonPrefill) {
                    window.CylonPrefill(actualCmd);
                    
                    if (window.pop) {
                        let html = `
                            <div style="position:fixed; top:10px; left:50%; transform:translateX(-50%); text-align:center; padding:15px; background:var(--menu-bg,#111); border:2px solid var(--fg-color,#0f0); box-shadow:0 6px 20px rgba(0,0,0,0.9); border-radius:4px; min-width:260px; z-index:100000;">
                                <div style="font-weight:bold; font-size:16px; margin-bottom:5px; color:var(--fg-color,#0f0);">${varName}</div>
                                <div style="font-size:12px; color:var(--menu-fg,#aaa); margin-bottom:15px;">${desc}</div>
                                <div style="font-size:14px; line-height: 1.4;">Edit value on command line<br>and press <b>ENTER</b> to save.</div>
                            </div>
                        `;
                        window.pop(html, "center");
                    }
                } else {
                    window.CylonCommand(actualCmd);
                }
            }
        });
    }

    let mockEvent = { clientX, clientY, view: window };
    window.parent.CylonPopManager.showContextMenu(mockEvent, items);
};

// ----------------------------------------------------------------------------
// ADD ITEM / OBJECT DIALOG (Native OS Popups)
// ----------------------------------------------------------------------------
window.showAddDialog = function(type, z) {
    let title = type === 'item' ? 'Add Item' : 'Add Object';
    
    let html = `
        <div style="padding: 15px; background: var(--menu-bg, #111); color: var(--menu-fg, #eee); border: 2px solid var(--fg-color, #0f0); font-family: var(--font-face, monospace); box-shadow: 4px 4px 15px rgba(0,0,0,0.8);">
            <h3 style="margin-top:0; border-bottom: 2px solid var(--menu-fg); padding-bottom: 5px;">${title} @ Z:${z}</h3>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 14px;">ID Code (2 chars):</label><br>
                <input type="text" id="add-id-input" maxlength="2" placeholder="e.g. Ca" style="width: 80px; background: var(--input-bg, #000); color: var(--input-fg, #0f0); border: 1px solid var(--fg-color, #0f0); font-family: inherit; font-size: 16px; padding: 4px;">
            </div>
            ${type === 'obj' ? `
            <div style="margin-bottom: 12px;">
                <label style="font-size: 14px;">Data (Optional 2 chars):</label><br>
                <input type="text" id="add-data-input" maxlength="2" placeholder="00" style="width: 80px; background: var(--input-bg, #000); color: var(--input-fg, #0f0); border: 1px solid var(--fg-color, #0f0); font-family: inherit; font-size: 16px; padding: 4px;">
            </div>
            ` : ''}
            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button onclick="var f=document.querySelector('.page-frame.active'); if(f) f.contentWindow.submitAdd('${type}'); else if(window.submitAdd) window.submitAdd('${type}');" style="flex: 1; background: var(--sel-bg, #333); color: var(--sel-fg, #0f0); border: 1px solid var(--fg-color, #0f0); padding: 8px; cursor: pointer; font-weight: bold; font-family: inherit;">ADD</button>
                <button onclick="if(window.hpop) window.hpop();" style="flex: 1; background: var(--menu-bg, #333); color: var(--menu-fg, #aaa); border: 1px solid var(--menu-fg, #555); padding: 8px; cursor: pointer; font-weight: bold; font-family: inherit;">CANCEL</button>
            </div>
        </div>
    `;
    
    if (window.parent && window.parent.popHtm) {
        window.parent.PopAlign = "center";
        window.parent.popHtm(html);
    }
};

window.submitAdd = async function(type) {
    let idInput = document.getElementById('add-id-input');
    if (!idInput) return;
    
    let id = idInput.value.padEnd(2, 'a').substring(0, 2);
    let data = type === 'obj' ? (document.getElementById('add-data-input').value || '') : '';
    
    if (id.trim() === '') {
        if (window.hpop) window.hpop();
        return;
    }

    let cmd = type === 'item' ? `gfx item ${id}` : `gfx obj ${id} ${data}`;
    await window.CylonCommand(cmd);
    
    if (window.hpop) window.hpop();
};

// ----------------------------------------------------------------------------
// KEYBOARD HANDLING
// ----------------------------------------------------------------------------
window.keydown = function(key, e) {
    if (!window.activeDrive) {
        if (key === 'Enter') { showDriveMenu(); if (e) e.preventDefault(); }
        return;
    }
    
    const gfx = window.CylonGFX;
    if (!gfx) return;
    
    if (window.parent && window.parent.CylonPopManager && window.parent.CylonPopManager.isMenuOpen) {
        if (window.parent.CylonPopManager.handleMenuKey(key)) {
            if (e) e.preventDefault();
            return;
        }
    }
    
    let dx = 0, dy = 0;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') dy = -1;
    else if (key === 'ArrowDown' || key === 's' || key === 'S') dy = 1;
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') dx = -1;
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') dx = 1;
    else if (key === 'Enter') { 
        gfx.executeCursor(); 
        if (e) e.preventDefault(); 
        return; 
    }
    else return;
    
    gfx.moveCursor(dx, dy);
    if (e) e.preventDefault();
};

// ----------------------------------------------------------------------------
// VIEWPORT SIZING
// ----------------------------------------------------------------------------
function fitDesktopToScreen() {
   if (!window.CylonGFX || !window.CylonGFX.gridWide) return;
 
   const wrapper = document.getElementById('desktop-wrapper');
   const screenW = window.innerWidth;
   const screenH = window.innerHeight;
 
   const cols = window.CylonGFX.gridWide;
   const rows = window.CylonGFX.gridTall;
 
   if (!cols || !rows || screenW === 0 || screenH === 0) return;
 
   let w, h;
 
   if (window.CylonGFX.gfxGridStretch) {
       const aspect = cols / rows;
       w = screenW;
       h = screenW / aspect;
 
       if (h > screenH) {
           h = screenH;
           w = screenH * aspect;
       }
 
       w = Math.floor(w * 0.98);
       h = Math.floor(h * 0.98); 
   } else {
       w = cols * window.CylonGFX.gfxTileSize;
       h = rows * window.CylonGFX.gfxTileSize;
   }
 
   wrapper.style.width = w + 'px';
   wrapper.style.height = h + 'px';
   wrapper.style.margin = '0 auto';
}
</script>
</body>
</html>
