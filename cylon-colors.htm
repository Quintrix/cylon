<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cylon Colors Control Panel</title>
    <script src="cylon-sdk.js"></script>
    <style>
        :root {
            --theme: default;
            --font-face: Courier, monospace;
            --bg-color: #030;
            --fg-color: #080;
            --menu-bg: #ccc;
            --menu-fg: #030;
            --sel-bg: #00c;
            --sel-fg: #ccc;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: var(--font-face);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            justify-content: flex-start;
            padding-top: 40px;
            padding-left: 10px; 
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Expanded to a 4 column grid */
        .config-grid {
            display: grid;
            grid-template-columns: 160px auto 160px auto; 
            gap: 4px 10px;
            align-items: center; 
        }

        .label {
            text-align: right;
            user-select: none;
            white-space: pre;
        }

        /* New wrapper to hold the text input and the color swatch together */
        .input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .swatch {
            width: 22px;
            height: 22px;
            border: 1px solid var(--menu-fg);
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .swatch:active {
            transform: scale(0.9);
        }

        input[type="text"] {
            background-color: var(--menu-bg);
            color: var(--menu-fg);
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            border: none;
            outline: none;
            padding: 2px 6px;
            width: 120px;
            border-radius: 0;
            cursor: pointer;
        }

        .spacer {
            height: 12px;
            grid-column: 1 / -1;
        }

        /* Container to center the Save button horizontally */
        .action-row {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            background-color: var(--sel-bg);
            color: var(--sel-fg);
            text-align: center;
            padding: 2px 16px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: transform 0.05s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        #error-msg {
            color: #f00;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="error-msg">Error: CylonDOS not connected.</div>

    <div class="config-grid">
        <!-- Row 1 -->
        <div class="label">Theme:</div>
        <div><input type="text" id="Theme" value="default" list="theme-list"></div>
        <div class="label">InputFg:</div>
        <div class="input-wrap">
            <input type="text" id="InputFg" value="#0f0">
            <div class="swatch" id="swatch-InputFg" onclick="showPicker('InputFg')"></div>
        </div>

        <div class="spacer"></div>

        <!-- Row 2 -->
        <div class="label">Font:</div>
        <div><input type="text" id="Font" value="Courier"></div>
        <div class="label">InputBg:</div>
        <div class="input-wrap">
            <input type="text" id="InputBg" value="#000">
            <div class="swatch" id="swatch-InputBg" onclick="showPicker('InputBg')"></div>
        </div>

        <div class="spacer"></div>

        <!-- Row 3 -->
        <div class="label">BackgroundColor:</div>
        <div class="input-wrap">
            <input type="text" id="BackgroundColor" value="#030">
            <div class="swatch" id="swatch-BackgroundColor" onclick="showPicker('BackgroundColor')"></div>
        </div>
        <div class="label">CaseBg:</div>
        <div class="input-wrap">
            <input type="text" id="CaseBg" value="#080808">
            <div class="swatch" id="swatch-CaseBg" onclick="showPicker('CaseBg')"></div>
        </div>

        <!-- Row 4 -->
        <div class="label">ForegroundColor:</div>
        <div class="input-wrap">
            <input type="text" id="ForegroundColor" value="#080">
            <div class="swatch" id="swatch-ForegroundColor" onclick="showPicker('ForegroundColor')"></div>
        </div>
        <div class="label">CaseFg:</div>
        <div class="input-wrap">
            <input type="text" id="CaseFg" value="#0a0">
            <div class="swatch" id="swatch-CaseFg" onclick="showPicker('CaseFg')"></div>
        </div>

        <div class="spacer"></div>

        <!-- Row 5 -->
        <div class="label">MenuBgColor:</div>
        <div class="input-wrap">
            <input type="text" id="MenuBgColor" value="#ccc">
            <div class="swatch" id="swatch-MenuBgColor" onclick="showPicker('MenuBgColor')"></div>
        </div>
        <div class="label">KeyBg:</div>
        <div class="input-wrap">
            <input type="text" id="KeyBg" value="#222">
            <div class="swatch" id="swatch-KeyBg" onclick="showPicker('KeyBg')"></div>
        </div>

        <!-- Row 6 -->
        <div class="label">MenuFgColor:</div>
        <div class="input-wrap">
            <input type="text" id="MenuFgColor" value="#030">
            <div class="swatch" id="swatch-MenuFgColor" onclick="showPicker('MenuFgColor')"></div>
        </div>
        <div class="label">KeyFg:</div>
        <div class="input-wrap">
            <input type="text" id="KeyFg" value="#fff">
            <div class="swatch" id="swatch-KeyFg" onclick="showPicker('KeyFg')"></div>
        </div>

        <div class="spacer"></div>

        <!-- Row 7 -->
        <div class="label">SelectBgColor:</div>
        <div class="input-wrap">
            <input type="text" id="SelectBgColor" value="#00c">
            <div class="swatch" id="swatch-SelectBgColor" onclick="showPicker('SelectBgColor')"></div>
        </div>
        <div class="label">KeyHlBg:</div>
        <div class="input-wrap">
            <input type="text" id="KeyHlBg" value="#666">
            <div class="swatch" id="swatch-KeyHlBg" onclick="showPicker('KeyHlBg')"></div>
        </div>

        <!-- Row 8 -->
        <div class="label">SelectFgColor:</div>
        <div class="input-wrap">
            <input type="text" id="SelectFgColor" value="#ccc">
            <div class="swatch" id="swatch-SelectFgColor" onclick="showPicker('SelectFgColor')"></div>
        </div>
        <div class="label">KeyHlFg:</div>
        <div class="input-wrap">
            <input type="text" id="KeyHlFg" value="#fff">
            <div class="swatch" id="swatch-KeyHlFg" onclick="showPicker('KeyHlFg')"></div>
        </div>

        <div class="spacer"></div>
        <div class="spacer"></div>

        <div class="action-row">
            <div class="label">Action:</div>
            <div id="save-btn" class="btn-action" onclick="saveConfig()">SAVE</div>
        </div>
    </div>

    <!-- Datalist for Theme Combobox -->
    <datalist id="theme-list"></datalist>

    <script>
        const CFG_FILE = 'cylon-colors.cfg';
        const THEME_DIR = 'cylon-colors';
        
        // Define our fallback/default settings
        const defaults = {
            "Theme": "default",
            "Font": "Courier",
            "BackgroundColor": "#030",
            "ForegroundColor": "#080",
            "MenuBgColor": "#ccc",
            "MenuFgColor": "#030",
            "SelectBgColor": "#00c",
            "SelectFgColor": "#ccc",
            "InputFg": "#0f0",
            "InputBg": "#000",
            "CaseBg": "#080808",
            "CaseFg": "#0a0",
            "KeyBg": "#222",
            "KeyFg": "#fff",
            "KeyHlBg": "#666",
            "KeyHlFg": "#fff"
        };

        // Standard 16 ANSI colors mapped to 3-hex values
        const ANSI_COLORS = [
            '#000', '#800', '#080', '#880', '#008', '#808', '#088', '#ccc', // 8 Standard
            '#555', '#f00', '#0f0', '#ff0', '#00f', '#f0f', '#0ff', '#fff'  // 8 Bright
        ];

        let activeColorInputId = null;

        function showPicker(inputId) {
            activeColorInputId = inputId;
            
            let html = `
                <style>
                    .cylon-color-cell {
                        width: 30px; height: 30px; border: 1px solid #000; cursor: pointer;
                        box-sizing: border-box; transition: transform 0.1s;
                    }
                    .cylon-color-cell:hover {
                        border: 2px solid #fff !important; transform: scale(1.15); z-index: 10; position: relative;
                    }
                </style>
                <div style="display: grid; grid-template-columns: repeat(8, 30px); gap: 4px; background: var(--menu-bg, #ccc); padding: 8px; border: 2px solid var(--fg-color, #0f0); box-shadow: 4px 4px 10px rgba(0,0,0,0.8);"
                     onmouseleave="if(window.hpop) window.hpop();">
                    ${ANSI_COLORS.map(color => `<div class="cylon-color-cell" style="background-color: ${color};" onclick="var f=document.querySelector('.page-frame.active'); if(f) f.contentWindow.selectColor('${color}'); else if(window.selectColor) window.selectColor('${color}'); if(window.hpop) window.hpop();"></div>`).join('')}
                </div>
            `;
            
            // Instruct OS to show menu at mouse coordinates (no dim) and display HTML
            if (window.parent) {
                if (window.parent.PopAlign !== undefined) window.parent.PopAlign = "click";
                if (typeof window.parent.pop === 'function') {
                    window.parent.pop(html);
                } else if (typeof window.parent.popHtm === 'function') {
                    window.parent.popHtm(html);
                }
            } else if (typeof pop === 'function') {
                if (typeof setPopAlign === 'function') setPopAlign('click');
                pop(html);
            }
        }

        function selectColor(color) {
            if (activeColorInputId) {
                let input = document.getElementById(activeColorInputId);
                if (input) {
                    input.value = color;
                    updateLivePreview();
                }
            }
            activeColorInputId = null;
        }

        // Binds the "Cylon Colors" title and live preview UI to the OS System Menu Button
        CylonSDK.onSystemMenu = function() {
            let bg = document.getElementById('BackgroundColor').value || '#000';
            let fg = document.getElementById('ForegroundColor').value || '#0f0';
            let font = document.getElementById('Font').value || 'monospace';
            let menuBg = document.getElementById('MenuBgColor').value || '#111';
            let menuFg = document.getElementById('MenuFgColor').value || '#aaa';
            let selBg = document.getElementById('SelectBgColor').value || '#333';
            let selFg = document.getElementById('SelectFgColor').value || '#0f0';

            let html = `
                <div style="background-color: ${bg}; color: ${fg}; font-family: ${font}, monospace; padding: 20px; border: 2px solid ${fg}; box-shadow: 0px 4px 15px rgba(0,0,0,0.8); text-align: center; min-width: 250px;">
                    <h2 style="margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid ${fg}; padding-bottom: 10px; font-size: 24px;">Cylon Colors</h2>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px;">
                        <div style="background-color: ${menuBg}; color: ${menuFg}; padding: 12px; border: 1px solid ${menuFg}; font-weight: bold;">
                            Menu Option Preview
                        </div>
                        <div style="background-color: ${selBg}; color: ${selFg}; padding: 12px; border: 1px solid ${selFg}; font-weight: bold;">
                            Selected Option Preview
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; gap: 10px;">
                        <button onclick="
                            var activeFrame = document.querySelector('.page-frame.active');
                            if(activeFrame && activeFrame.contentWindow.saveConfig) activeFrame.contentWindow.saveConfig();
                            window.hpop();
                        " style="padding: 10px 16px; background: ${selBg}; color: ${selFg}; border: 1px solid ${fg}; cursor: pointer; font-family: inherit; font-weight: bold;">
                            SAVE
                        </button>
                        
                        <button onclick="window.hpop()" style="padding: 10px 16px; background: ${menuBg}; color: ${menuFg}; border: 1px solid ${fg}; cursor: pointer; font-family: inherit; font-weight: bold;">
                            CLOSE
                        </button>
                    </div>
                </div>
            `;
            if (window.parent && window.parent.popHtm) {
                // Ensure system menu aligns centrally since popAlign might have changed
                if (window.parent.PopAlign !== undefined) window.parent.PopAlign = "center";
                window.parent.popHtm(html);
            }
        };

        document.addEventListener('input', (e) => {
            if (e.target.tagName === 'INPUT') {
                updateLivePreview();
            }
        });

        function updateLivePreview() {
            document.documentElement.style.setProperty('--font-face', document.getElementById('Font').value + ', monospace');
            document.documentElement.style.setProperty('--bg-color', document.getElementById('BackgroundColor').value);
            document.documentElement.style.setProperty('--fg-color', document.getElementById('ForegroundColor').value);
            document.documentElement.style.setProperty('--menu-bg', document.getElementById('MenuBgColor').value);
            document.documentElement.style.setProperty('--menu-fg', document.getElementById('MenuFgColor').value);
            document.documentElement.style.setProperty('--sel-bg', document.getElementById('SelectBgColor').value);
            document.documentElement.style.setProperty('--sel-fg', document.getElementById('SelectFgColor').value);
            
            updateSwatches();
        }

        // Keeps the visual swatch squares perfectly in sync with the input box text
        function updateSwatches() {
            const colorFields = [
                'InputFg', 'InputBg', 'BackgroundColor', 'CaseBg', 
                'ForegroundColor', 'CaseFg', 'MenuBgColor', 'KeyBg', 
                'MenuFgColor', 'KeyFg', 'SelectBgColor', 'KeyHlBg', 
                'SelectFgColor', 'KeyHlFg'
            ];
            colorFields.forEach(id => {
                let input = document.getElementById(id);
                let swatch = document.getElementById('swatch-' + id);
                if (input && swatch) {
                    swatch.style.backgroundColor = input.value;
                }
            });
        }

        // Apply raw text configuration to the form inputs
        function applyTextToInputs(rawText) {
            let lines = rawText.split('\n');
            lines.forEach(line => {
                line = line.trim();
                if (line && line.includes('=')) {
                    let parts = line.split('=');
                    let key = parts[0].trim();
                    let val = parts.slice(1).join('=').trim();
                    
                    let inputEl = document.getElementById(key);
                    if (inputEl) {
                        inputEl.value = val;
                    }
                }
            });
        }

        // Setup the pre-installed themes and populate the dropdown list
        async function initThemes(dos) {
            if (!(await dos.exists(THEME_DIR))) {
                await dos.mkdir(THEME_DIR);
                
                // Seed default themes
                await dos.save(`${THEME_DIR}/darkgreen.cfg`, "Theme=darkgreen\nFont=Courier\nBackgroundColor=#002200\nForegroundColor=#00ff00\nMenuBgColor=#cccccc\nMenuFgColor=#003300\nSelectBgColor=#0000cc\nSelectFgColor=#cccccc\nInputFg=#00ff00\nInputBg=#000000\nCaseBg=#080808\nCaseFg=#00aa00\nKeyBg=#222222\nKeyFg=#ffffff\nKeyHlBg=#666666\nKeyHlFg=#ffffff");
                
                await dos.save(`${THEME_DIR}/darkpurple.cfg`, "Theme=darkpurple\nFont=Courier\nBackgroundColor=#150015\nForegroundColor=#dd00dd\nMenuBgColor=#330033\nMenuFgColor=#ff00ff\nSelectBgColor=#660066\nSelectFgColor=#ffffff\nInputFg=#ff00ff\nInputBg=#100010\nCaseBg=#150015\nCaseFg=#dd00dd\nKeyBg=#300030\nKeyFg=#ffffff\nKeyHlBg=#800080\nKeyHlFg=#ffffff");
                
                await dos.save(`${THEME_DIR}/retrowin.cfg`, "Theme=retrowin\nFont=sans-serif\nBackgroundColor=#008080\nForegroundColor=#ffffff\nMenuBgColor=#c0c0c0\nMenuFgColor=#000000\nSelectBgColor=#000080\nSelectFgColor=#ffffff\nInputFg=#000000\nInputBg=#ffffff\nCaseBg=#c0c0c0\nCaseFg=#000000\nKeyBg=#c0c0c0\nKeyFg=#000000\nKeyHlBg=#ffffff\nKeyHlFg=#000000");
            }

            // Populate Datalist
            let files = await dos.dir(THEME_DIR);
            let datalist = document.getElementById('theme-list');
            datalist.innerHTML = '';
            
            files.forEach(f => {
                let nameOnly = f.name.substring(f.name.lastIndexOf('/') + 1);
                if (nameOnly.endsWith('.cfg')) {
                    let opt = document.createElement('option');
                    opt.value = nameOnly.replace('.cfg', '');
                    datalist.appendChild(opt);
                }
            });
        }

        async function init() {
            if (!window.parent || !window.parent.CylonDOS) {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            let dos = window.parent.CylonDOS;
            
            // Seed the directory and setup dropdown
            await initThemes(dos);
            
            // Load the current active theme
            try {
                if (await dos.exists(CFG_FILE)) {
                    let rawText = await dos.load(CFG_FILE);
                    applyTextToInputs(rawText);
                }
            } catch (err) {
                console.warn("Could not load cylon-colors.cfg, using defaults.");
            }
            updateLivePreview();
            
            // Listen for theme selection changes (dropdown or hitting enter)
            document.getElementById('Theme').addEventListener('change', async (e) => {
                let themeName = e.target.value.replace(/[^a-zA-Z0-9_-]/g, '').trim();
                if (!themeName) return;
                
                let themeFile = `${THEME_DIR}/${themeName}.cfg`;
                if (await dos.exists(themeFile)) {
                    let rawText = await dos.load(themeFile);
                    applyTextToInputs(rawText);
                    updateLivePreview();
                }
            });
        }

        async function saveConfig() {
            let btn = document.getElementById('save-btn');
            
            if (!window.parent || !window.parent.CylonDOS) {
                if(btn) btn.textContent = "ERROR";
                return;
            }

            // Sanitize theme name to make a safe filename
            let themeName = document.getElementById('Theme').value.replace(/[^a-zA-Z0-9_-]/g, '').trim() || 'default';
            document.getElementById('Theme').value = themeName; // update ui just in case

            let lines = [];
            for (let key in defaults) {
                let el = document.getElementById(key);
                let val = (key === 'Theme') ? themeName : (el ? el.value.trim() : defaults[key]);
                lines.push(`${key}=${val}`);
            }
            
            let cfgText = lines.join('\n') + '\n';
            
            try {
                // 1. Save system active config
                await window.parent.CylonDOS.save(CFG_FILE, cfgText);
                
                // 2. Save library theme file
                if (!(await window.parent.CylonDOS.exists(THEME_DIR))) {
                    await window.parent.CylonDOS.mkdir(THEME_DIR);
                }
                await window.parent.CylonDOS.save(`${THEME_DIR}/${themeName}.cfg`, cfgText);

                // 3. Re-init datalist in case it's a new theme
                await initThemes(window.parent.CylonDOS);

                // 4. Broadcast changes live
                if (window.parent.applyColorConfig) {
                    window.parent.applyColorConfig(cfgText);
                }
                
                if (btn) {
                    let oldText = btn.textContent;
                    btn.textContent = "SAVED!";
                    btn.style.backgroundColor = document.getElementById('ForegroundColor').value;
                    btn.style.color = document.getElementById('BackgroundColor').value;
                    
                    setTimeout(() => {
                        btn.textContent = oldText;
                        updateLivePreview(); 
                    }, 1000);
                }
                
            } catch (err) {
                console.error("Failed to save:", err);
                if(btn) {
                    btn.textContent = "FAIL";
                    setTimeout(() => btn.textContent = "SAVE", 1000);
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
